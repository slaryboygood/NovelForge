## 提示格式
【击杀：××】【等级提升：Lv.X → Lv.Y】【获得：品级·名称】【已吸收：××灵核×N】【任务更新：××】

## 灵核叙事禁区
- 可以写“逸散灵能/灵韵残响飘起并进入身体”，不可以写“实体灵核自行飘起并进入身体”。
- 写完整吞核时必须出现实体接触或入口动作；吞噬后只能留下核印/残响，不能说实体核仍在体内。
- 仍要交易、留证或喂剑的灵核，只能吸收其表层残响/逸散灵能，不能先写整核被吞掉。
- “获得灵核/碎片”表示进入库存；若本章当场吸收，应写“已吸收”，不得同时计入库存。
