# 活跃世界术语（Novel Reboot v2）

## 核心概念
- 本命灵核：硅基生命自身唯一的灵魂与等级核心，不是背包物品
- 怪物灵核：怪物体内的实体核心与可计数战利品，不会自行飘入身体
- 灵核碎片/核屑：可拾取、可交易、被吸收后实体消失的碎片材料
- 逸散灵能/灵韵残响：击杀后飘起并被吸收的非实体能量，不计入灵核数量
- 核印：吞噬实体灵核后保留下来的灵性信息，不是实体物品
- 灵能：战斗与技能能量
- 灵能结晶：矿物或储能设施生成的实体能源，不等于怪物灵核
- 腐化信号：制造怪物的污染源
- 腐化值：吸收污染灵核的代价累积
- 记忆仓：存档/回城点
- 能量仓：补给/治疗点
- 记忆库：记忆读取/解密设施

