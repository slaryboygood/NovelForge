# 作者设定档案（Novel Reboot v2）

## 作者风格 DNA（新版）

- 偏好：轻松明快、画面感强、动作戏爽快、人物鲜活、情绪外露、节奏快。
- 雷区：晦涩长句、哲学独白、工程参数、AI 腔（"这意味着/换句话说/从逻辑上"）。
- 长度：单章 3000-4500 汉字；卷目标 12-18 万汉字。

## 终局设计（作者方向）

- 大结局：万芯之巅决战，主角在继承/解放/封印之间选择——设计取向为「解放」（记忆回归个体）。
- 结局基调：爽快收束 + 留白余味（开放式续卷可能）。
- 终极秘密：零是万芯之主崩解时漏掉的那一粒执念——"选择"本身。

## 禁止终局走向

- 主角黑化或被夺舍。
- 万芯之主洗白成纯受害者。
- 解放结局变成"世界毁灭"或"全员失忆"。
