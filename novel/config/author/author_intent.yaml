# 作者意图（Novel Reboot v2）

## 写作方向（作者确认）

1. 硅基拟人世界 + MMO 游戏式升级 + 打怪掉宝 + 地图推进 + 小白爽文 + 长篇连载。
2. 全面拟人化：人形主角，有外貌/性格/情绪/吐槽；怪物视觉化。
3. 技术概念世界化（电压→灵能，电容→储能族，晶体管→门控者……），正文禁止工程术语。
4. 先爽，再故事，最后才是思想；哲学藏在事件与选择里。
5. 升级/装备/掉落/Boss 循环是硬性结构；禁止长期无战斗无升级。
6. 人物语言必须差异化；允许吐槽、打脸、装逼、贪财、暧昧、玩笑。

## 反方向（作者明确不要的）

- 技术报告式叙事、参数驱动剧情、抽象哲学讨论推动故事。
- 非拟人主角以晶核/探针/信号形式长期活动。
- 角色说话像 AI 或工程文档。
- 靠逻辑分析而不是行动推进剧情。

## 工程纪律（沿用）

- 生产程序/Agent/校验工具保留；内容层以新版 Canon 为唯一事实源。
- 旧版专名（见 legacy_worldview_denylist.yaml）不得进入正文与 plan。
