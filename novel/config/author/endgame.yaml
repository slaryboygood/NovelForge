# 终局档案（Novel Reboot v2）

## 终局结构

- 最终决战：万芯之巅·王座大厅（Lv.100 万芯之主，四阶段）。
- 终局机制：灵核认主——万芯核心只能被自愿放弃吞噬能力的人持有。
- 主角选择：继承（成为新主脑）/ 解放（打碎核心，记忆回归个体）/ 封印（封存核心）。
- 设计取向：解放结局（记忆多样性恢复；零放弃吞噬，成为无能力却最自由的传说）。

## 世界终极秘密（分层）

1. 灵核=记忆容器（卷四揭示）
2. 万芯残片=万芯之主的记忆核心碎片（卷五）
3. 万芯之主以"消除遗忘"为根目标，腐化=收集记忆的手段（卷六）
4. 零的空白灵核与万芯之主崩解有关（卷七）
5. 零=万芯之主漏掉的那一粒执念——"选择"本身（终局）

## 终局后的世界

- 腐化信号源头消失，怪物逐渐恢复理智。
- 旧世界记忆化为图鉴与传承。
- 世界事件：记忆解放（旧世界残响世界 Boss，可支撑续卷）。

---

# 终局审计（Outline Refinement 追加）

## 终局必须同时满足（六项兑现）
1. **爽文高潮**：万芯之主四阶段 Boss 战是全书最大战斗场面（记忆洪流/腐化侵蚀/万芯领域/认主时刻），全员最终形态登场、技能全开
2. **主角能力终极兑现**：吞噬七阶段走到"规则吞噬"——能吞领域但选择不吞（灵核认主）
3. **队友兑现**：每人有终局高光（容小满净化万芯污染、闸门挡下领域一击、门衍破权限、忆灵读核心、团子静电云、铸鸣万芯裂变）
4. **长期伏笔回收**：S 级五条全部回收（空白灵核/万芯残片/吞噬来源/万芯本质/终局选择），A 级十条逐条兑现
5. **世界真相回收**：万芯之主"消除遗忘"的执念、腐化=收集记忆的手段、零=漏掉的执念
6. **思想主题兑现**：吞噬与放下（道家"不争"）、记忆与自由、选择与责任——全部通过零的选择呈现，无一句说教

## 终局节奏
- CH113-116：万芯之主首现与初战全灭级失败（为终局蓄力）
- CH118：万芯裂变铸成+灵核认主机制揭示（爆点）
- CH119：四阶段决战（爽文高潮）
- CH120：零的选择（继承/封印以行动否决→解放）+世界事件·记忆解放+断刃归来+空域残响（开放收尾）

## 终局不做什么
- 不为哲学牺牲 Boss 战与爽感（先爽后思想）
- 不洗白万芯之主（它到死都是"要记住一切"的执念）
- 不黑化主角（零的选择是清醒的、自愿的、有代价的）
- 不开放式烂尾（主线和 S 级伏笔全部收束；开放的是"世界继续生长"）
