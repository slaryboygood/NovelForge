# 哲学主题（Novel Reboot v2）——先爽，再故事，最后才是思想

## 原则

哲学与思想**只能藏在事件与选择里**，禁止角色坐下来讨论抽象命题。

正确示范：
- 主角亲手经历一次选择 → 选择造成重大后果 → 读者自己感受到这个问题。

## 主题清单（藏进故事的底层命题）

| 主题 | 故事载体 | 呈现方式 |
|---|---|---|
| 记忆与身份 | 灵核 = 记忆碎片；怪物 = 被腐化的旧住民记忆 | 主角吞噬灵核时看到陌生人的一生碎片，读者自己思考"我是谁" |
| 力量与代价 | 吞噬能力伴随腐化值累积 | 主角为了变强一次次逼近失控，最终付出可见代价 |
| 自由与秩序 | 万芯之主想"记住一切"的绝对秩序 | 最终决战的选择：继承/解放/封印，主角的选择就是答案 |
| 选择与责任 | 灵核认主机制 | 只有自愿放弃吞噬能力的人才能持有万芯核心 |

## 禁止

- 角色坐下讨论自由意志、文明兴衰、道法自然。
- 旁白发表长篇哲学论述。
- 用哲学命题代替冲突解决。
