# 世界规则（Novel Reboot v2）——力量与成长的世界化规则

## 灵能规则

- 灵能是硅基生命战斗与施放技能的能量，来源：击杀后逸散的灵能、消耗灵核或灵核碎片、能量仓补给、记忆仓恢复。
- 灵能消耗与恢复是技能与装备平衡的基础；任何强力技能都伴随灵能代价或冷却。
- 本命灵核：硅基生命自身唯一的灵魂与等级核心，属于身体结构，不计入战利品数量。
- 怪物灵核：怪物体内形成的实体器官/战利品，必须挖取、拾取或接触；不会自行飘起并钻入身体。弱小怪物可能只有核屑，精英/Boss 才稳定形成完整灵核。
- 灵核碎片/核屑：实体材料，拾取后进入库存；被人物或装备吸收时，实体随消耗消失，库存必须同步扣减。
- 逸散灵能/灵韵残响：怪物死亡时释放的非实体能量，可以飘起并被击杀者吸收，用于升级；它不是灵核，不进入库存，也不能交易。
- 核印：完整灵核或碎片被吞噬后留下的灵性信息，可保存怪物本能或技能线索；核印不是第二枚实体灵核，不能出售、交付或再次吞噬。
- 灵能结晶：矿物或储能设施生成的实体能源，与怪物灵核不同；神龛结晶、能量仓结晶不得改称怪物灵核，怪物灵核也不得改称灵能结晶。
- 灵核消耗规则：完整吞噬=实体灵核完全消失并留下核印；半核吞噬=吞掉部分消失、剩余部分仍为实体；只吸收逸散灵能/表层残响=实体灵核仍在。**同一实体灵核只能完整消耗一次**。

## 等级规则

- 等级 Lv.0–Lv.100，每 10 级为一阶（一阶废灵 → 十阶传奇）。
- 升级途径：击杀怪物（灵能积累）、完成任务、Boss 首杀、地图探索。
- 每升一级：属性成长 + 1 技能点；每升一阶：解锁新技能槽与装备栏。
- 越级击杀奖励翻倍；被高等级怪物击杀掉落部分灵能（不扣等级）。

## 职业规则

- 基础职业在 Lv.10 觉醒（一次职业觉醒，不可更改）。
- 进阶职业在 Lv.40 通过职业试炼转职。
- 隐藏职业需要特殊条件（稀有掉落物/隐藏任务/特殊地图事件）。
- 每个职业有独立技能树；跨职业学习禁止（除非隐藏职业特权）。

## 装备规则

- 品级：灰白（普通）→ 绿（精良）→ 蓝（稀有）→ 紫（史诗）→ 橙（传说）→ 红（神话）。
- 装备部位：武器、护甲、头盔、护腕、战靴、饰品、腰包（背包扩展）。
- 装备可强化（消耗材料+灵能）、可镶嵌（灵核宝石）、可成长（主角核心装备）。
- 装备绑定：部分稀有装备绑定持有者，无法交易。

## 掉落规则

- 普通怪：实体灵核碎片/核屑、材料、少量逸散灵能；逸散灵能不计入掉落库存。
- 精英怪：完整灵核、绿-蓝装备、技能书残页。
- 稀有怪：蓝-紫装备、技能书、宠物蛋、地图碎片。
- Boss：紫-橙装备、稀有材料、称号、隐藏任务卷、转职物、万芯残片（特定 Boss）。
- 世界事件：限定掉落（节日/事件专属）。

## 任务规则

- 任务类型：主线、支线、隐藏、阵营、职业、装备、副本、世界事件。
- 任务形式：护送、讨伐、探索、寻宝、抢夺、守城、救人、逃亡、夺旗、副本、竞技、战争、潜入、Boss 战。
- 任务奖励：灵能、灵核、装备、材料、权限令、声望、称号。

## 腐化规则（代价机制）

- 吸收受污染灵核会累积『腐化值』；腐化值过高 → 失控（短暂敌我不分）。
- 隐藏职业【万芯吞噬者】的吞噬能力可净化灵核，但每次净化消耗自身灵核完整度。
- 腐化值可被储能师的净化技能/记忆仓清除，但清除过程伴随痛苦。

## 地图规则

- 地图开放与等级挂钩：低等级进入高等级地图会被『灵压』压制（属性减半）。
- 每张地图有记忆仓（存档点）与能量仓（补给点）。
- 区域 Boss 刷新有固定周期；首杀奖励一次性；世界 Boss 全服事件。
