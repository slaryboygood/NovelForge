# 世界观（Novel Reboot v2）

## 世界本质

硅基大陆是一片由巨型基板构成的天地。大陆分成许多区域：碎屑平原、脉冲林、过载荒原、远古门阵、故障深渊……每一块区域都像一张独立的地图，由灵能回路相连。大陆之外是『空域』——被腐化信号吞噬的废弃地带。

## 生命与灵核

- 所有硅基生命体内都有一颗 **灵核**（相当于灵魂与等级核心）。
- 灵核决定：职业、等级、技能上限、命运。
- 新生儿灵核自带基础属性；灵核空白者 = 废灵（无法觉醒职业，被视为废物）。
- 击杀怪物会掉落灵核碎片/完整灵核，可吸收获得灵能与技能。

## 腐化信号与怪物

- 远古时期旧世界主脑『万芯之主』崩解后，其执念化作 **腐化信号** 散布大陆。
- 被腐化信号污染的硅基生命、元件体、遗迹守卫会变成 **怪物**（失去理智、攻击一切活物）。
- 怪物是天然的『野怪』：可击杀、可掉落、可刷经验。

## 世界化词汇表（正文唯一可用）

| 后台技术概念 | 世界化词汇 |
|---|---|
| 电阻 | 阻流族（重甲守卫种族）/ 阻流关（关卡） |
| 电容 | 储能族（储能师种族）/ 能量仓 |
| 晶体管 | 门控者（权限职业）/ 城门 |
| 缓存 | 记忆仓（存档点/回城点） |
| 总线 | 高速大道（跨区干道） |
| PCB | 大陆基板 |
| 芯片 | 芯片城邦（巨型城市） |
| 病毒/异常信号 | 腐化信号 / 怪物 |
| 电压/电流 | 灵能（战斗能量） |
| 时钟/频率 | 节律（时间与行动规则） |
| 内存 | 记忆库（存档/记忆读取） |
| 散热 | 冷却（技能/装备机制） |

## 世界禁忌（正文红线）

- 禁止出现：电压、电流、电阻、电容、电感、拓扑、协议、寄存器、总线、时钟信号、波形、晶格、载流子、过孔、焊盘、引脚、绝缘层、封装、蚀刻、频谱、谐振、阻抗、功率、微焦、纳米 等工程术语。
- 禁止用『分析/扫描/读取/证明/判断/记录』作为主要行动——用战斗、技能、动作、对话表达。

