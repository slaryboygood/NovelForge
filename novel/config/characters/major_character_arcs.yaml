# 队伍体系与角色声音（Novel Reboot v2 · Outline Refinement）

## 队伍构成（8 人 + 1 宠，收队节奏：每人入队前经历认识→冲突→合作→信任→重大事件→加入）

| 角色 | 种族/职业 | 定位 | 入队章节 | 性格一句话 | 收队事件（重大事件） |
|---|---|---|---|---|---|
| 零 | 斩波者→雷弧剑士→万芯吞噬者 | 近战输出/核心 | 第 1 章 | 嘴硬贪吃莽，讲义气 | 觉醒吞噬 |
| 容小满 | 储能师→净化储能师 | 治疗/修复（奶妈） | 第 9 章 | 温柔但抠门，算钱一流 | 腐化潮中并肩+治疗术暴露 |
| 频闪 | 镜频猎手→巡影弓手 | 远程输出/侦察 | 第 18 章 | 话痨自大，手速快嘴更快 | 虫群围困被救+虫王首杀并肩 |
| 闸门 | 阻流族·重甲守卫→壁垒守卫 | 坦克/防御 | 第 21 章 | 沉默寡言，一开口就是金句 | 护送任务+族地线"他们是我兄弟" |
| 忆灵 | 缓存幽灵 | 辅助/情报/解密 | 第 27 章（隐藏任务入队） | 胆小怕事，关键时刻最可靠 | 旧钟楼隐藏任务+读仓秘密 |
| 铸鸣 | 拾荒者商会工匠 | 装备打造/强化 | 第 52 章 | 铁公鸡，见材料眼发光 | 锈蚀地牢锻造+雷弧战甲 |
| 门衍 | 门控者 | 特殊职业/权限/位移 | 第 68 章 | 贵族出身但叛逆，毒舌 | 门卫巨像权限认证（先冲突后信任） |
| 团子 | 静电史莱姆（宠物） | 控场/卖萌/进化 | 第 14 章（Boss 掉落蛋） | 圆滚滚，吞电，卖萌 | 静电史莱姆王掉落孵化 |

## 队友不可替代性（每人四项职责 + 独立目标）

### 容小满（女主线，感情线慢节奏）
- 战斗职责：唯一稳定治疗 + 净化腐化（卷七净化觉醒后不可替代——能净化万芯污染）
- 性格职责：队伍的"底线"与账本（制止零上头、管理财务）
- 剧情职责：储能族血脉秘密 → 净化储能师 → 记忆净化（万芯核心相关）
- 独立目标：查清储能族血脉；证明"治疗不是软弱"
- 个人高光：CH100 净化觉醒救零；CH102 "我来净化你"救赎
- 个人低谷：CH055 被铁锈领域困住（治疗者无力的自责）
- 与零互补：他莽她稳、他伤她医、他吞她净
- 自己的敌人：储能商会的旧派（认为血脉不该外流）
- 自己的升级线：回灵术→灵能护罩→净化术→群体修复→净化觉醒（Lv.10/25/40/70/100 五节点）
- 感情线：CH009 入队（谈价钱式）→CH022 血脉线索→CH030 赌斗并肩→CH044 过载巨人战后照料→CH058 转职夜谈心→CH090 挫败后安慰→CH101-102 失控与救赎（感情爆点）→CH120 终局并肩。前 60 章不写恋爱，只写默契与在意。

### 闸门（坦克）
- 战斗职责：嘲讽/壁垒/挡伤害（Boss 大招唯一接得住的人）
- 剧情职责：阻流要塞线、族规与守护主题
- 独立目标：让阻流族重新定义"守护"；为 CH041 灵核根基受损找解法（卷五回响）
- 高光：CH040 违抗族规挡击；CH105 深渊以命相护
- 低谷：CH041 灵核受损后短暂失去"壁垒"（自我怀疑）
- 升级线：重甲→壁垒守卫（Lv.40 试炼）→"守护之壁"觉醒（Lv.80）

### 频闪（远程）
- 战斗职责：远程输出/侦察/清场
- 剧情职责：猎手公会线、高速大道镖师线、赵璃感情线（轻）
- 独立目标：成为天梭城最强猎手（证明自己不是"只会说"）
- 高光：CH025 虫潮之夜的爆头连射；CH087 巨蜥追逐战的关键一箭
- 低谷：CH025 之前被虫群围困（自大害死队友的教训——救他的正是零）
- 升级线：镜频猎手→巡影弓手（Lv.40）→"频闪领域"（Lv.85）

### 忆灵（情报）
- 战斗职责：读仓/幻影/解密（非主战但关键）
- 剧情职责：记忆秘密、记忆废库线、万芯残片解读
- 独立目标：找回被封印的记忆；守护记忆库
- 高光：CH085 记忆废库解密（万芯执念残页）；CH118 读万芯核心
- 低谷：CH054 身世揭示的崩溃（被封印的记忆）
- 升级线：读仓术→幻影→"记忆共鸣"（Lv.75）

### 门衍（权限）
- 战斗职责：开门/位移/权限破解
- 剧情职责：门控议会线、贵族线、万芯残片线
- 独立目标：查清父亲门昭失踪真相；证明门控者不等于贵族特权
- 高光：CH074 门控者认证合击；CH112 残党首领战"不吞噬"的克制一剑
- 低谷：CH070 贵族秘密暴露被家族除名
- 升级线：门控者→"门中门"（Lv.60）→"权限真解"（Lv.88）

### 铸鸣（后勤）
- 战斗职责：非战斗（装备打造/强化/机关）
- 剧情职责：商会线、装备驱动线的"NPC 视角"
- 独立目标：打造一件"传说级"作品（万芯裂变的锻造者）
- 高光：CH048 四人锤出紫装；CH118 铸成万芯裂变
- 升级线：锻造师→大师级（每卷一次材料收集任务）

### 团子（宠物，成长线不卖萌工具化）
- 初始形态：静电史莱姆幼体（CH014 孵化，拳头大，吞电）
- 能力：吞电充能/放电控场/粘液束缚
- 成长：CH035 吞过载灵核异变（体型变大+放电鸣叫）→CH097 吞腐化核心未失控（纯净结晶）→CH103 结晶成净化圣水主料→CH110 真相揭示（旧世界宠物原型，万芯之主唯一没统一的记忆）→CH112 团子领域"静电云"
- 战斗用途：控场/干扰（Boss 战打断机制）
- 剧情用途：纯净结晶（净化线）、旧世界记忆钥匙（终局线）
- 最终形态：静电云史莱姆王（红级宠物）
- 轻松作用：卖萌/贪吃/护主（保持适量，不喧宾夺主）

## 队友独立升级原则

- 每个队友有自己的升级节点（见上），不跟随主角等级；主角不能替队友升级。
- 每卷至少一次"队友高光章"（队友主导解决冲突，主角辅助）与一次"队友低谷章"。
- 队友失败=主角不能完全兜底（否则失去独立意义）。

## 关系线（有过程：陌生→嫌弃→合作→信任→裂痕→理解→伙伴）

- 零×容小满：见上（感情线慢）
- 零×闸门：CH021 护送认识→CH033 族地冲突（嫌弃他的莽）→CH040 生死之交→CH041 受损后的理解
- 零×频闪：CH018 互怼→CH025 教训→CH030 赌斗配合→CH087 背靠背
- 零×忆灵：CH027 隐藏任务→CH054 身世→CH085 记忆废库互信
- 零×门衍：CH068 互看不顺眼（毒舌×吐槽）→CH070 秘密→CH074 背靠背合击→CH112 最默契
- 反派关系有层次：赖三（纯恶/打脸对象）→赵启（利益敌人→赌斗后记仇→卷三黑手）→腐化教团（理念敌人）→万芯残党执事（宿敌/碾压级）→万芯之主（终极反派）

## 女性角色差异化（禁止同一模板）

- 容小满：温柔抠门、算钱一流、外柔内刚、治疗者（"给钱！""别乱动，伤口会崩"）
- 忆灵：胆小结巴、半透明、情报者（"别……别吓我"但总在说关键情报）
- 赵璃：骄傲大小姐、嘴硬心软、猎手青梅（轻狗粮，不展开恋爱）
- 门昭（门衍之母，门控长老）：威严、古板、以家族为重（与儿子对立面）
- 女研究员（记忆幻境）：旧世界记忆中的温柔与决绝（终局揭示）

## 角色声音圣经（核心人物 15 项对白特征）

### 零（嘴硬吐槽型）
- 说话长度：短句为主，急了连珠炮
- 常用句式："切，就这？""先吃饭再说""关我屁事（然后第一个冲）"
- 情绪表达：紧张摸额角芯片纹；被夸耳朵红；狂笑掩饰心虚
- 遇到危险："卧槽——"然后硬着头皮上
- 遇到朋友：损人（"你行你上啊"）但护短
- 遇到敌人：嘴硬挑衅（"就你？不够我塞牙缝"）
- 绝不会说：长篇大论、哲学总结、自夸（会害臊）

### 容小满（温柔计较型）
- 常用句式："给钱！""先谈价钱""这笔账记下了"
- 遇到危险：先算损失再救人（嘴上），行动却先救人
- 绝不会说：嘲讽队友（只会翻账本）
- 三件套：记账/报价/翻旧账

### 闸门（沉默金句型）
- 说话极短，一词一句："……嗯。""挡在我身后。""他们是我兄弟。"
- 遇危险：不说废话直接挡
- 绝不会说：解释、辩解、长篇（说了就是大事）

### 频闪（话痨自大型）
- 连珠炮、自我吹嘘、被打脸后嘴硬："看我表演！""刚才那是失误！"
- 遇危险：嘴上慌身体稳（边说边射箭）
- 绝不会说：承认自己不行（除非生死关头）

### 忆灵（胆小结巴型）
- 结巴、音量小、常用省略号："别……别吓我……"
- 关键时刻：声音突然清晰（读者记住的瞬间）
- 绝不会说：大声宣言

### 门衍（毒舌贵族型）
- 优雅刻薄、反问多："这就是你们的待客之道？""门不是锁，是选择。"
- 遇朋友：毒舌但行动维护；遇敌人：居高临下嘲讽
- 绝不会说：粗话（会用优雅的方式表达同样的意思）

### 铁算盘（奸商油滑型）
- 套近乎、压价、话里有话："小零啊——""价钱好商量。"
- 绝不会说：把底牌说破

### 赖三（蛮横欺软型）
- 粗俗、威胁、欺软怕硬；求饶时："爷爷！我错了爷爷！"
- 绝不会说：讲道理

### 赵启（傲慢拿腔型）
- 拿腔拿调、炫耀家世、记仇
- 绝不会说：承认平民的胜利

### Boss 台词风格
- 静电史莱姆王：无台词（声音特效）
- 过载巨人：低沉轰鸣（"……热量……"）
- 锈王：锈蚀嘶哑、王座威严（"跪下。"）
- 门卫巨像：无台词（机制语音："权限不足。"）
- 干线巨蜥：嘶吼
- 故障之主：无数故障声音混杂（"……修复……遗忘……"）
- 万芯之主：万千记忆合声（"让我记住一切。"）
