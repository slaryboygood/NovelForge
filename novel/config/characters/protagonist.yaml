# 主角卡：零（Novel Reboot v2）

- 姓名：零（村民叫他"小零"；全名空白，灵核字段未写入名字）
- 性别：男
- 外貌：银灰色短发，琥珀色眼瞳，肤色瓷白偏冷；额角有一枚淡青色芯片纹（出生标记，废灵标记）；身形偏瘦但筋骨结实；右手掌心有一颗后来长出的暗紫灵核纹（吞噬能力印记）
- 年龄感：16-17 岁少年
- 种族：硅基人（灵核空白型）
- 职业：基础【斩波者】（Lv.10 觉醒）→ 进阶【雷弧剑士】（Lv.40 转职）→ 隐藏【万芯吞噬者】（Lv.60+ 觉醒）
- 等级：开局 Lv.0（全书唯一零级废灵）→ Lv.100（终局）
- 身份：废渣镇捡废料的孤儿 → 冒险者（天梭城注册）→ 雷弧剑士 → 万芯吞噬者 → 万芯之巅的传奇
- 性格：嘴硬、爱吐槽、贪吃、莽、讲义气、自卑藏在自信底下；被人夸会耳朵红
- 口头习惯："切，就这？" / "先吃饭再说" / 紧张时摸额角的芯片纹
- 价值观：变强是为了不再被欺负；同伴的命比装备值钱
- 欲望：变强、吃饱、让废渣镇的人刮目相看、查清自己空白灵核的来历
- 恐惧：灵核污染失控后伤害同伴；再次变回人人可欺的废物
- 缺点：莽撞、容易上头、对灵核代价后知后觉
- 秘密：他的空白灵核与万芯之主崩解有关（卷一埋线，卷七揭示一半，卷八全揭）
- 武器：成长型【裂变剑】（灰白→绿→蓝→紫→橙→红，吞噬灵核可喂剑成长）
- 装备：裂变剑（武器）+ 废灵护甲（卷三换）→ 雷弧战甲（卷五）→ 万芯之鳞（卷八）
- 技能：斩波斩（基础）、闪步（位移）、雷弧斩（进阶）、吞噬（隐藏）、静电束缚（控制）、灵核净化（隐藏进阶）
- 战斗方式：近战强攻 + 吞噬灵核临时强化 + 依靠战斗直觉与同伴配合；越级战斗靠"吞了再说"
- 与主角关系：本人（第一视角行动核心）
- 首次登场：第 1 章（废渣镇拾荒）
- 成长阶段：废灵（1-15）→ 新人冒险者（16-45）→ 转职剑士（46-75）→ 吞噬觉醒（76-105）→ 万芯之巅（106-120）
- 人物弧光：从自卑嘴硬 → 敢于承担 → 主动选择（继承/解放/封印）
- 最终去向：终局选择解放记忆（主线结局之一），背负万芯之名的传说
- 剧情作用：主线推进者——灵核秘密、万芯残片、最终决战的唯一核心
- 爽文作用：打脸担当（废灵开局+金手指吞噬+成长武器，全书最强打脸引擎）
