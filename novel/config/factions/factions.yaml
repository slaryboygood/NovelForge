# 势力（Novel Reboot v2）

## 主要势力

| 势力 | 类型 | 立场 | 核心地图 | 说明 |
|---|---|---|---|---|
| 冒险者公会 | 中立组织 | 任务发布/注册 | 各城邦 | 等级评定、任务板、副本组队；主角注册地（卷二人公） |
| 芯片城邦联盟 | 秩序方 | 支持冒险者 | 天梭城等 | 硅基大陆的文明秩序；贵族与议会 |
| 阻流要塞 | 种族势力 | 中立偏守 | 阻流关 | 重甲守卫的故乡；闸门的部族 |
| 门控议会 | 特殊势力 | 秩序方 | 远古门阵 | 门控者的认证机构；掌控权限与遗迹 |
| 储能商会 | 经济势力 | 中立 | 各城 | 能量仓运营、治疗服务、装备交易；容小满的出身 |
| 拾荒者商会 | 灰色势力 | 中立偏利 | 废渣镇/黑市 | 捡废料起家，情报与黑市；铸鸣的势力 |
| 腐化教团 | 反派势力 | 崇拜腐化 | 故障深渊边缘 | 认为腐化是"进化"，散播污染；前期幕后 |
| 万芯残党 | 最终反派 | 复活万芯之主 | 万芯之巅 | 收集万芯残片的旧世界遗民组织；卷六正式登场 |

## 势力任务

- 阵营任务：势力声望 + 专属装备/技能。
- 主角线：冒险者公会（卷一注册）→ 天梭城（卷二）→ 阻流要塞（卷三闸门线）→ 门控议会（卷五门衍线）→ 对抗万芯残党（卷六-八）。

## 势力冲突

- 芯片城邦联盟 × 阻流要塞：征税与自治的摩擦（卷三）。
- 门控议会 × 腐化教团：权限正统之争（卷五）。
- 冒险者公会 × 万芯残党：猎人与猎物的反转（卷六+）。
