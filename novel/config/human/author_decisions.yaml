# 作者决定（Novel Reboot v2）

## 已确认决定

- RD-R01：新版方向 = 硅基拟人世界 + MMO 升级冒险爽文（2026-08-26 作者指令）。
- RD-R02：旧版全部内容（大纲/角色/设定/正文/学习数据）退出生产；新版 Canon 为唯一事实源。
- RD-R03：技术概念世界化（电压→灵能、电容→储能族、晶体管→门控者、缓存→记忆仓、总线→高速大道、PCB→大陆、芯片→城邦、病毒→怪物）。
- RD-R04：全面拟人化；主角人形化；怪物视觉化。
- RD-R05：哲学只藏进事件与选择；先爽再故事最后思想。
- RD-R06：建立 SSOT 层级（constitution 最高解释权）。
- RD-R07：主角名为「零」（弃用旧名「序」）；最终 Boss 万芯之主；核心神器万芯残片。
- RD-R08：分卷 8 卷（每卷 15 章，前 120 章精纲重新推演）。
- RD-R09：等级 Lv.0-100；品级 灰白/绿/蓝/紫/橙/红；Boss 循环=发现→准备→首战→失败→研究→升级→再战→击杀→掉落→世界变化。
- RD-R10：不正式生成正文，直到 Canon 验收完成（本次任务边界）。

## 待作者确认

- 主角名字「零」是否采用（暂定，可替换）。
- 终局取向「解放」是否确认（备选：继承/封印）。
- 分卷数量 8 卷是否合适。
