# 地图逐张审计（16 问，每图必答）

> 原则：地图必须越来越大、世界感不断展开；每张地图必须有"必须来/完成什么才走/怎么走"的任务闭环。

## 1. 碎屑平原（Lv.0-10，卷 1）
- 视觉：灰白废料原野，遍地旧板与锈渣，风卷尘屑；地平线远处一线蓝光（天梭城方向）
- 种族：废灵拾荒者、少数储能族商贩、迁移中的猎手
- 社会：废渣镇（拾荒者商会据点）+ 散落废料堆营地；镇民抱团、排外、重利
- 资源：废铁/灵核碎片/火星牙/甲虫壳
- 怪物：静电史莱姆/腐化甲虫/废铁狼/烧蚀犬（精英）/腐化甲虫王（小 Boss）
- 城镇：废渣镇（记忆仓+能量仓+商会）
- 副本：静电洞穴（Lv.10-15）
- 区域 Boss：腐化甲虫王（Lv.10）
- 隐藏 Boss：锈铁神龛的守龛傀儡（CH006 隐藏任务）
- 掉落：灰白-绿装、灵核碎片、地图碎片（静电洞穴/脉冲林）
- 技能：闪步（CH006 隐藏任务）
- 等级段：Lv.0-10
- 主角为什么必须来：出生地（无选择）
- 完成什么才离开：Lv.10 职业觉醒 + 商会委托完成
- 进入下一地图：跟随商会车队走晶轨支线前往天梭城（CH015 末）

## 2. 脉冲林（Lv.8-20，卷 1-2）
- 视觉：蓝紫色雷光森林，树木=立式晶柱，枝干=导线藤；林间浮着电弧尘
- 种族：猎手营地、雷纹矿工
- 社会：猎手公会前哨 + 矿工营地（半自治）
- 资源：雷纹矿石（强化材料）、毒囊、光弓碎片
- 怪物：噬流虫/雷弧兽/镜频猎手（腐化）/噬流虫王（区域 Boss）
- 城镇：猎手前哨（记忆仓）
- 副本：无（林间精英区）
- 隐藏 Boss：雷弧兽王（CH017 触发）
- 掉落：蓝装、技能书残页、地图碎片·过载荒原
- 技能：频闪之眼（队）
- 等级段：Lv.8-20
- 主角为什么必须来：雷纹矿石强化裂变剑 + 猎手公会任务（频闪线）
- 完成什么才离开：噬流虫王首杀 + 地图碎片集齐
- 进入下一地图：碎片拼合→过载荒原入口（CH030 末）

## 3. 静电洞穴（Lv.10-15，卷 1 副本）
- 视觉：青白雷光洞窟，洞壁电苔发光，地面湿滑带电
- 种族：无（副本怪物）
- 社会：商会委托制（组队进洞）
- 资源：电苔材料、雷纹矿
- 怪物：静电水蛭/电苔怪/静电史莱姆王（副本 Boss）
- 城镇：无（入口营地）
- 隐藏 Boss：无（三阶段史莱姆王即核心）
- 掉落：雷纹护臂（蓝）、宠物蛋、技能书·静电束缚
- 技能：静电束缚（主角 Lv.15）
- 等级段：Lv.10-15
- 主角为什么必须来：商会委托（团子+雷纹护臂）
- 完成什么才离开：Boss 首杀
- 进入下一地图：→天梭城

## 4. 天梭城（Lv.15+，卷 2 主城）
- 视觉：巨型芯片城邦，街区=电路板纹路街道，中心高塔=晶核灯塔；日夜灯火（灵能路灯）
- 种族：多族混居（门控者贵族/储能师/猎手/商贩/拾荒者）
- 社会：芯片城邦联盟首府；冒险者公会/储能商会/猎手公会/贵族议会/黑市
- 资源：灵能币流通、装备市场、技能书商店、材料交易所
- 怪物：城内无（城外脉冲林）；黑市有"斗兽场"怪物
- 城镇：主城（多记忆仓/能量仓/学院/竞技场/酒馆/市场）
- 副本：竞技场挑战赛（PVE 模拟战）
- 区域 Boss：无（城防巨像守卫）
- 隐藏 Boss：黑市斗兽场隐藏层（CH026 触发）
- 掉落：蓝-紫装（市场）、称号（竞技场）、公会声望
- 技能：职业技能书商店
- 等级段：Lv.15-30（往返）
- 主角为什么必须来：注册冒险者、队伍补给、贵族线（赵启）
- 完成什么才离开：赌斗立威 + Lv.20 + 过载荒原委托
- 进入下一地图：阻流要塞委托→过载荒原

## 5. 过载荒原（Lv.20-35，卷 3）
- 视觉：赤红开裂的焦土原野，地面裂缝透出熔光，远处巨人领地的黑山
- 种族：拾荒者营地（老鼹）、阻流族巡逻队
- 社会：阻流要塞管辖的"危险税区"；雇佣兵制
- 资源：焦鳞、巨人心脏（橙材料）、散热井冷却点
- 怪物：焦土蜥/过载傀儡/荒原巨蝎/过载巨人（区域 Boss）
- 城镇：阻流关（要塞）
- 副本：散热井地下层（Lv.25-30）
- 隐藏 Boss：熔渊蝎王（CH035）
- 掉落：蓝-紫装、雷弧战甲图纸、转职线索
- 技能：壁垒（队·CH041）
- 等级段：Lv.20-35
- 主角为什么必须来：阻流要塞委托（闸门线）+ 过载巨人（转职线索）
- 完成什么才离开：过载巨人击杀 + 族长默许
- 进入下一地图：转职线索→锈蚀地牢

## 6. 阻流关（Lv.25-40，卷 3 势力）
- 视觉：巨型旧闸门要塞，城墙=散热塔群，关内族地以熔炉为中心
- 种族：阻流族（重甲守卫）
- 社会：族长制、族规森严、以守护为最高荣誉
- 资源：重甲材料、族器传承
- 怪物：关外巨兽（区域 Boss）、入侵兽群
- 城镇：要塞（记忆仓/锻炉）
- 副本：族地试炼场（Lv.30-35）
- 隐藏 Boss：关外熔岩兽王
- 掉落：重甲部件、壁垒技能书
- 技能：壁垒（闸门）
- 等级段：Lv.25-40
- 主角为什么必须来：闸门族地线（守护主题）
- 完成什么才离开：族长默许闸门离族
- 进入下一地图：→锈蚀地牢

## 7. 锈蚀地牢（Lv.30-45，卷 4 地下城）
- 视觉：三层锈红地下牢城，铁锈瀑布、蠕虫巢、王座大厅；空气锈腥
- 种族：地牢蠕虫、锈蚀甲虫、被囚的缓存幽灵（忆灵）
- 社会：无（遗迹化牢城）
- 资源：锈铁、蠕虫芯、转职试炼场
- 怪物：锈蚀甲虫/地牢蠕虫/锈王（地下城 Boss）
- 城镇：无（入口营地）
- 副本：三层地牢即主副本（Lv.30-45）
- 隐藏 Boss：典狱长残影（CH52 隐藏任务）
- 掉落：紫装（锈蚀重甲）、技能书·壁垒进阶、隐藏任务卷·远古门阵
- 技能：雷弧斩（转职技·CH60）
- 等级段：Lv.30-45
- 主角为什么必须来：转职试炼 + 忆灵线
- 完成什么才离开：锈王击杀 + 雷弧剑士觉醒
- 进入下一地图：隐藏任务卷→远古门阵

## 8. 远古门阵（Lv.40-60，卷 5 遗迹）
- 视觉：巨型石门阵列，浮空门环，门内空间折叠；遗迹内时间流速异常
- 种族：门卫石兵/阵灵/门控者（试炼者）
- 社会：门控议会认证体系（试炼制）
- 资源：门控钥匙（转职物）、记忆库残页、万芯残片
- 怪物：门卫石兵/阵灵/门卫巨像（遗迹 Boss）
- 城镇：门阵前哨（议会驻地）
- 副本：门内空间试炼（Lv.45-55）
- 隐藏 Boss：阵灵王（CH66 隐藏宝箱守护者）
- 掉落：橙装、灵核宝石·吞噬之眼、万芯残片其一、门控钥匙
- 技能：雷弧风暴（CH66）、开门（门衍）
- 等级段：Lv.40-60
- 主角为什么必须来：门衍线 + 万芯残片其一
- 完成什么才离开：门卫巨像击杀 + 残片现世
- 进入下一地图：残片指向→高速大道

## 9. 总线高速大道（Lv.55-75，卷 6 跨区）
- 视觉：横跨大陆的巨型晶轨大道，道面流光，两侧悬崖深渊；道上有驿站与匪寨
- 种族：镖师、劫道匪团、干线蠕兽
- 社会：镖行（护送制）+ 匪团割据
- 资源：干线鳞（橙材料）、高速通行令
- 怪物：劫道匪团/干线蠕兽/干线巨蜥（跨区 Boss）
- 城镇：大道驿站（记忆仓）
- 副本：匪寨（Lv.60-65）
- 隐藏 Boss：匪首·黑面（CH83）
- 掉落：橙装、通行令、万芯残片其二
- 技能：万芯吞噬者觉醒前置（CH84-89）
- 等级段：Lv.55-75
- 主角为什么必须来：残片争夺 + 忆灵记忆废库线
- 完成什么才离开：干线巨蜥击杀（残片被夺的挫败）
- 进入下一地图：残片指向→故障深渊

## 10. 记忆废库（Lv.60-80，卷 6 特殊）
- 视觉：半透明的记忆晶库，书架=记忆仓阵列，中央悬浮记忆巨球
- 种族：缓存幽灵（忆灵族）
- 社会：记忆守护者自治
- 资源：记忆残页、纯净记忆结晶
- 怪物：记忆守卫/记忆守护者（特殊 Boss）
- 城镇：记忆废库（读仓区）
- 副本：记忆试炼（Lv.65-75）
- 隐藏 Boss：遗忘之影
- 掉落：记忆残页、读仓术进阶
- 技能：读仓术（忆灵）
- 等级段：Lv.60-80
- 主角为什么必须来：忆灵身世 + 万芯执念残页
- 完成什么才离开：解密完成（忆灵归位）
- 进入下一地图：→故障深渊

## 11. 故障深渊（Lv.70-90，卷 7 禁区）
- 视觉：崩坏错位的故障峡谷，空间扭曲（部件漂浮重组），深渊底部腐化教团巢穴
- 种族：故障傀儡、腐化骑士、腐化教团
- 社会：腐化教团（"腐化=进化"邪教）+ 残党前哨
- 资源：深渊铁、深渊核心（红材料）、净化圣水配方
- 怪物：故障傀儡/腐化骑士/缓存幽灵王/故障之主（禁区 Boss）
- 城镇：深渊入口营地（冒险者禁区站）
- 副本：深渊三层（Lv.75-88）
- 隐藏 Boss：腐化祭司（CH103）
- 掉落：红材料、净化圣水配方、万芯残片其三
- 技能：灵核净化（零·CH102）、净化圣水（容小满·CH104）
- 等级段：Lv.70-90
- 主角为什么必须来：第三残片 + 吞噬失控与救赎（情感核心）
- 完成什么才离开：故障之主击杀 + 三残片集齐
- 进入下一地图：万芯之巅开启

## 12. 万芯之巅（Lv.90-100，卷 8 终局）
- 视觉：悬浮的记忆王座浮岛，万千记忆仓堆成山，核心处万芯领域（时间/记忆扭曲）
- 种族：记忆卫兵、万芯残党
- 社会：残党守墓一族（万芯之主的"记忆保管者"）
- 资源：记忆银、万芯核心
- 怪物：记忆卫兵/万芯之主（最终 Boss）
- 城镇：登顶驿站（最终补给点）
- 副本：记忆幻境试炼（Lv.92-98，四段）
- 隐藏 Boss：旧世界残响（世界事件·终局后）
- 掉落：传说三件套、万芯核心、世界事件·记忆解放
- 技能：万芯裂变（CH118）、灵核认主（终局）
- 等级段：Lv.90-100
- 主角为什么必须来：最终决战（三残片合钥）
- 完成什么才离开：万芯之主击杀 + 零的选择（解放）
- 进入下一地图：开放收尾（旧世界残响世界事件）

## 地图越来越大（世界感展开线）

废渣镇（角落）→ 碎屑平原（新手区）→ 天梭城（区域城市）→ 过载荒原+阻流关（势力地域）→ 锈蚀地牢（地下城）→ 远古门阵（古代文明遗迹）→ 高速大道（跨区干线，世界连接）→ 记忆废库（文明记忆）→ 故障深渊（禁区）→ 万芯之巅（世界核心）→ 终局后：空域残响（世界边缘扩展，支撑续卷）

## 回旧地图爽点（设计）

- 卷三 CH045：过载荒原任务完成后**途经废渣镇**——零以 Lv.30 冒险者身份回归：赖三磕头、镇民围拢、容小满被储能商会挖角、旧敌人（烧蚀犬群）变成练级杂兵、曾经打不过的废铁狼王被一刀秒——"原来世界这么大，原来我走了这么远"。
- 卷五 CH061：门阵任务前回天梭城——赵启已落魄（家族败落），零被贵族议会以贵宾礼遇；当年赌斗的看客主动攀关系。
- 卷七 CH092：故障深渊前回阻流关——闸门成为族内英雄，当年反对他的长老默认他"证明了自己"。
