# 地图体系（Novel Reboot v2 · Outline Refinement）

## 地图链总览

| 地图 | 类型 | 等级区间 | 核心 Boss | 特色 |
|---|---|---|---|---|
| 碎屑平原 | 新手区 | Lv.0-10 | 腐化甲虫群（小 Boss） | 出生地；废渣镇；静电史莱姆出没 |
| 脉冲林 | 野外地图 | Lv.8-20 | 噬流虫王 | 雷纹矿石；雷弧兽；林间记忆仓 |
| 静电洞穴 | 副本 | Lv.10-15 | 静电史莱姆王 | 首个副本；宠物蛋；蓝色装备 |
| 天梭城 | 主城 | Lv.15+ | — | 芯片城邦；冒险者公会；储能商会 |
| 过载荒原 | 野外地图 | Lv.20-35 | 过载巨人 | 烧蚀犬群；巨人领地；转职线索 |
| 阻流关 | 关卡/势力 | Lv.25-40 | 关外巨兽 | 阻流要塞；闸门族地 |
| 锈蚀地牢 | 地下城 | Lv.30-45 | 锈王 | 三层地牢；锈蚀甲虫；转职试炼 |
| 远古门阵 | 遗迹 | Lv.40-60 | 门卫巨像 | 门控者试炼；万芯残片其一；隐藏宝箱 |
| 总线高速大道 | 跨区地图 | Lv.55-75 | 干线巨蜥 | 高速晶轨大道；劫道匪团；万芯残片其二 |
| 记忆废库 | 特殊地图 | Lv.60-80 | 记忆守护者 | 忆灵种族地；读仓解密 |
| 故障深渊 | 禁区 | Lv.70-90 | 故障之主 | 腐化教团巢穴；深渊核心 |
| 万芯之巅 | 终局地图 | Lv.90-100 | 万芯之主 | 最终 Boss；世界结局 |

## 地图规则

- 每张地图有：记忆仓（存档/回城）、能量仓（补给/治疗）、任务点、精英怪区、区域 Boss 刷新点。
- 地图开放：等级门槛 + 权限令（部分）。
- 新地图新鲜感：新怪物、新职业任务、新势力、新装备、新资源、新规则、新 Boss、新任务。
- 地图碎片：部分地图入口需收集碎片拼合（卷四远古门阵）。

## 探索奖励

- 首次抵达区域：探索经验 + 地图图鉴条目。
- 图鉴收集：怪物图鉴/装备图鉴/地图图鉴（称号与属性奖励）。

