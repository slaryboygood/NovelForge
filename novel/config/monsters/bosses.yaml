## Boss 战画面要求
- 每个 Boss 战必须能想象"场地长什么样、谁站哪里、技能怎么躲、谁先倒下、怎么翻盘"。
- Boss 掉落必须匹配战斗强度（Boss 战后必有掉落节，掉落物预告下一张地图/下一次强化）。
