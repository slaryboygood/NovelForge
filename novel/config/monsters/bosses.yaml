# Boss 图鉴（Novel Reboot v2）

## Boss 循环标准

发现 → 准备 → 第一次交锋 → 失败/吃亏 → 研究弱点 → 升级 → 再战 → 击杀 → 掉落 → 世界变化

## 主要 Boss 详情

### 静电史莱姆王（静电洞穴·副本 Boss，Lv.15）
- 外形：三人高半透明青色史莱姆，体内一颗雷球缓慢滚动，头顶戴着一块锈王冠（装饰）
- 地图：静电洞穴最深处
- 等级：Lv.15
- 攻击方式：雷球轰炸（远程）、分裂小史莱姆（召唤）、扑压（近战）
- 机制：分裂阶段（血量 50% 以下分裂 4 只小史莱姆，需先清小怪）
- 阶段：狂暴（血量 20%：雷球连射+扑压交替）
- 弱点：怕火（烧蚀犬牙制作的燃烧瓶）；分裂期本体脆弱
- 第一次出现：第 11 章（洞穴深处阴影）
- 第一次交战：第 12 章（队伍 4 人 Lv.10-12，惨败——被分裂淹没）
- 最终击杀：第 14 章（零 Lv.13 吞噬小史莱姆灵核强化+燃烧瓶战术）
- 掉落：雷纹护臂（蓝）、史莱姆宠物蛋（团子）、技能书·静电束缚
- 推动剧情：首次 Boss 战教学；团子入队；零的吞噬能力第一次在 Boss 战显威

### 噬流虫王（脉冲林·区域 Boss，Lv.20）
- 外形：三米长蓝黑巨型噬流虫，口器张开如花瓣，环状细牙
- 地图：脉冲林深处虫巢
- 等级：Lv.20
- 攻击方式：毒液喷吐、召唤虫群、钻地突袭
- 机制：召唤阶段（每 30% 血量召唤虫群）
- 阶段：毒雾狂暴（血量 30%）
- 弱点：雷弧兽的雷纹矿石粉末（克制毒雾）；口器闭合时无法喷毒
- 第一次出现：第 9 章（虫巢阴影）
- 第一次交战：第 10 章（频闪单独遭遇，被虫群围困——零救援）
- 最终击杀：第 19 章（队伍 5 人 Lv.16-18，毒雾战术+雷纹粉）
- 掉落：毒王芯（蓝材料）、地图碎片·过载荒原、完整灵核
- 推动剧情：打通过载荒原地图；频闪入队考验

### 过载巨人（过载荒原·区域 Boss，Lv.35）
- 外形：五米高巨大人形，胸口熔炉般发亮，皮肤龟裂泛红
- 地图：过载荒原巨人领地
- 等级：Lv.35
- 攻击方式：重锤砸地（AOE 震击）、熔岩喷发、过载冲锋
- 机制：过热阶段（胸口越亮攻击越强，需要引它撞冷却点）
- 阶段：三阶段（正常/过热/熔毁临界）
- 弱点：冷却点（荒原上的旧散热井）；过热时防御下降
- 第一次出现：第 38 章（巨人领地边缘）
- 第一次交战：第 40 章（正面硬刚惨败——闸门被砸进地里）
- 最终击杀：第 44 章（引巨人撞散热井+雷弧战甲图纸实战）
- 掉落：巨人心脏（橙材料）、雷弧战甲图纸、转职线索·雷弧剑士
- 推动剧情：卷三高潮；转职线索开启卷四；闸门"守护"弧光第一幕

### 锈王（锈蚀地牢·地下城 Boss，Lv.45）
- 外形：王座上的巨型锈甲人形，手持锈剑，王冠锈成一体
- 地图：锈蚀地牢第三层
- 等级：Lv.45
- 攻击方式：锈剑斩、召唤甲虫群、铁锈领域（减速+腐蚀）
- 机制：王座战（开场坐王座，半血起身）
- 阶段：起身狂暴
- 弱点：速度压制（闪步绕后）；王座被破坏后失去召唤
- 第一次出现：第 53 章
- 第一次交战：第 55 章（被铁锈领域困住，容小满净化脱困）
- 最终击杀：第 58 章（零转职试炼前置战）
- 掉落：锈蚀重甲（紫）、技能书·壁垒、隐藏任务卷·远古门阵
- 推动剧情：转职试炼（零→雷弧剑士，第 60 章完成）；远古门阵开启

### 门卫巨像（远古门阵·遗迹 Boss，Lv.60）
- 外形：十米高石门巨像，胸口一扇紧闭的门，门上有锁
- 地图：远古门阵最深处的门厅
- 等级：Lv.60
- 攻击方式：门压（巨像扑倒）、锁链横扫、权限封印（封技能）
- 机制：权限战（门衍的开门技能可破封印）；门锁阶段（需三把钥匙）
- 阶段：门锁三阶段
- 弱点：门衍的权限共鸣；封印期间物理免疫但可被开门反制
- 第一次出现：第 69 章
- 第一次交战：第 71 章（门衍权限不足，被封印团灭边缘）
- 最终击杀：第 74 章（门衍完成门控者认证+队伍合击）
- 掉落：门控钥匙（转职物）、万芯残片·其一、记忆库残页
- 推动剧情：万芯残片主线正式开启；门衍入队；灵核秘密第一层揭示

### 干线巨蜥（高速大道·跨区 Boss，Lv.75）
- 外形：二十米长巨型蜥蜴，鳞片发光如流动的灯带
- 地图：高速大道中段
- 等级：Lv.75
- 攻击方式：冲撞、尾扫、光柱喷吐
- 机制：追逐战（在大道上边跑边打）
- 阶段：狂暴冲刺
- 弱点：鳞片发光时防御最强——打鳞片缝隙；劫道匪团的绊索
- 第一次出现：第 82 章
- 第一次交战：第 84 章（追逐战半程被甩）
- 最终击杀：第 87 章（绊索战术+零的雷弧风暴）
- 掉落：高速通行令、干线鳞（橙材料）、万芯残片·其二
- 推动剧情：万芯残党登场抢残片（第 90 章残片落入反派）；卷六高潮

### 故障之主（故障深渊·禁区 Boss，Lv.90）
- 外形：由无数故障部件拼成的巨像，核心处一张扭曲面孔
- 地图：故障深渊最底层
- 等级：Lv.90
- 攻击方式：部件飞射、故障领域、腐化吐息
- 机制：部件重组（拆散再组装）；核心暴露阶段
- 阶段：三阶段
- 弱点：净化圣水（容小满卷七习得）；核心部位
- 第一次出现：第 99 章
- 第一次交战：第 101 章（零吞噬过量失控，队伍败退）
- 最终击杀：第 105 章（容小满净化+零灵核净化觉醒）
- 掉落：深渊核心（红材料）、净化圣水配方、万芯残片·其三
- 推动剧情：卷七高潮；零的吞噬失控与救赎；万芯残党残片集齐 3/3

### 万芯之主（万芯之巅·最终 Boss，Lv.100）
- 外形：巨型王座上的万千记忆聚合体，面容不断变换，王座由无数记忆仓堆成
- 地图：万芯之巅·王座大厅
- 等级：Lv.100
- 攻击方式：全屏记忆洪流、腐化侵蚀、万芯领域（压制所有技能）
- 机制：记忆战（每阶段召唤一段旧世界记忆幻境）；灵核认主机制
- 阶段：四阶段
- 弱点：灵核认主——只有自愿放弃吞噬能力的人能持有万芯核心（终局机制）
- 第一次出现：第 113 章（王座大厅阴影）
- 第一次交战：第 116 章（全灭级失败——万芯领域压制）
- 最终击杀：第 119-120 章（零选择放弃吞噬→灵核认主→世界事件）
- 掉落：万芯核心、传说装备三件套、世界事件·记忆解放
- 推动剧情：终局；零的选择（继承/解放/封印）；全书主题收束

