# Boss 机制强化原则（Outline Refinement 追加）

普通 Boss 不能只是"血更多攻击更高"。每个核心 Boss 必须至少满足以下机制维度：

## 机制维度（每 Boss ≥3 项）
1. **阶段变化**：至少 2 阶段，阶段间有明显外观/行为切换（如锈王：坐王座→起身狂暴）
2. **环境变化**：Boss 战改变场地（史莱姆王分裂淹没洞穴、过载巨人熔岩喷发、锈王铁锈领域减速）
3. **技能机制**：需要应对的特殊技能（门卫巨像权限封印、故障之主部件重组）
4. **弱点机制**：有明确弱点需发现（静电史莱姆怕火、过载巨人过热撞散热井、干线巨蜥鳞片缝隙）
5. **队伍配合**：需要职业组合（坦克嘲讽+奶妈净化+输出集火、门衍开门反制封印）
6. **隐藏阶段**：特定条件下开启（吞噬特定灵核/达成条件后，如史莱姆王分裂阶段吞核可跳阶段但触发隐藏狂暴）

