# 《硅基升维》卷一《废灵崛起》精细章纲（第 1-15 章）
# 依据：volume_01.yaml / master_story.yaml / worldview.yaml / world_rules.yaml / premise.md / style_guide.md
# protagonist.yaml / major_character_arcs.yaml / levels.yaml / classes.yaml / equipment.yaml / drops.yaml
# maps.yaml / bestiary.yaml / bosses.yaml / factions.yaml / novel_constitution.json
# 节奏锚点：ch2-3 觉醒吞噬（Lv.0→3）；ch6 获得闪步技能书；ch8 打脸村霸赖三；ch9 容小满入队；
#           ch11-12 静电洞穴初战惨败；ch14 静电史莱姆王首杀（团子宠物蛋+雷纹护臂）；ch15 Lv.10 职业觉醒（斩波者）离开新手区
# 等级曲线：Lv.0（ch1）→ Lv.1（ch2）→ Lv.3（ch3）→ Lv.4（ch4）→ Lv.5（ch5-7 蓄力）→ Lv.7（ch8）→ Lv.8（ch9-11）→ Lv.9（ch12-13）→ Lv.10（ch14-15）
# 队伍：零（ch1）→ 零+容小满（ch9）→ 零+容小满+团子（ch14-15）
# 爽点节奏：小爽（ch2 觉醒反杀 / ch5 惨胜狼王）→ 中爽（ch8 打脸赖三）→ 虐点蓄力（ch11-12 惨败）→ 大爽（ch14 Boss 首杀）→ 爆点（ch15 职业觉醒+离村）

chapters:
  - chapter: 1
    title: 废渣镇的零
    goal: 开局立人设：空白灵核的零级废灵少年在废渣镇拾荒求生，从废料堆捡到断刃裂变剑；铺垫腐化潮将至；赖三欺压、容小满缝补、村长善意三条人物线同时立住
    map: 碎屑平原·废渣镇（废料堆、镇口、记忆仓广场）
    characters: 零、村长、容小满、赖三、赖三打手（阿肥、瘦猴）、镇民
    task_type: 主线（开篇铺垫）
    conflict: 废灵身份被全镇歧视；赖三带打手收保护费、抢废料，零护住破铁条挨打；镇口出现怪物残骸，腐化潮的传言让全镇不安
    monsters: 无正面打怪（镇边远观静电史莱姆蹦跳的影子；赖三牵的一条瘦野狗——后文伏笔）
    battle: 无打怪战，有一场小冲突：赖三打手抢废料，零护剑被推倒在地挨了两下，靠嘴硬和跑得快脱身，怀里死死抱着破铁条（动作场面+憋屈感）
    skills: 无
    equipment: 获得：裂变剑（灰白·破铁条，剑身断口有一道旧纹）；废灵护甲（灰白，容小满缝补，记在赊账本上）
    rewards: 裂变剑；灵核碎片×2（捡的，未吸收）
    relationship: 与镇民（轻视）；与村长（全镇唯一善意，啰嗦地叮嘱他别出镇）；与容小满（欠她补衣钱，被她记进账本）；与赖三（结怨起步）
    reveal: 零是全书唯一零级空白灵核的废灵；废渣镇是碎屑平原最穷的镇；腐化潮近日将临的传言；破铁条断口的旧纹不寻常，贴着额角芯片纹会微微发烫
    satisfaction: 憋屈开局蓄力打脸——破铁条被嘲笑“想当剑想疯了吧”，零攥紧拳头不服气；读者期待感拉满
    fun: 拾荒吐槽：“捡废料不丢人，饿死才丢人”；容小满算账：“补三针，记你账上，两块碎片，利滚利”；村长啰嗦：“小零啊，听叔说，明天别出镇，听见没？”
    suspense: 破铁条上的旧纹到底是什么？为什么空白灵核会发烫？
    hook: 腐化潮夜：镇外火光冲天，狗群嘶吼逼近，零握着破铁条被堵在巷子尽头
    word_count: 3800
  - chapter: 2
    title: 第一次吞噬
    goal: 腐化潮夜绝境中吞噬第一枚怪物灵核，觉醒隐藏能力【吞噬】并反杀野狗群，Lv.0→Lv.1；确立吞噬金手指的第一条规则与代价悬念
    map: 碎屑平原·废渣镇外围（巷子、镇口野地）
    characters: 零、容小满、村长、赖三（趁乱抢货逃命，丑态毕露）、镇民
    task_type: 主线（觉醒）
    conflict: 腐化潮爆发的怪物扑进镇子，零为护住容小满和半镇老小被狗群围住；吞灵核前的犹豫——吞下去可能死，不吞必死；吞噬后发现自己“能吃”怪物
    monsters: 腐化野狗（Lv.3，潮夜变异成群）、静电史莱姆小群（Lv.2）
    battle: 绝境战：零先被狗群放倒（冷汗、发抖、脸色惨白），摸到濒死怪物掉出的灵核——“饿得发疯，脑子一热吞了下去”——觉醒反杀；吞噬强化后的蛮力加破铁条劈砍
    skills: 觉醒【吞噬】（隐藏能力）；吞噬灵核获得临时强化（力量大增）
    equipment: 裂变剑灰白首次见血；无新装备
    rewards: Lv.0→Lv.1（【等级提升：Lv.0 → Lv.1】）；灵核碎片×3；吞噬能力面板（短提示，不刷屏）
    relationship: 与容小满（生死共患难，她还惦记记账）；与镇长镇民（被救的改观萌芽）；零与自己（第一次有力气，不再任人宰割）
    reveal: 【吞噬】初规则：可吞灵核、临时强化、越级杀怪经验翻倍；吞噬残留规则：整核吞噬=核本体消失不可再交易，半吞=剩半颗，只吸残响=核保留；全镇都说空白灵核是废的，自己的灵核却能“消化”怪物灵核——为什么？伏笔加深
    satisfaction: 小爽点：绝境反杀加全书唯一零级破壳升级，读者见证废灵第一次站直腰
    fun: 吞灵核当场打嗝冒蓝光；零吐槽：“味道像馊饭，但管饱”；容小满边发抖边记账：“救命之恩，先记着，以后还”
    suspense: 吞噬的代价是什么？为什么偏偏空白灵核能吞？
    hook: 火场外一道视线盯着零——某个戴兜帽的身影捡起他丢下的灵核壳，转身消失在夜色里
    word_count: 4200
  - chapter: 3
    title: 废料堆里爬出的怪物
    goal: 潮后三天，零用吞噬连续猎杀低级怪物冲上 Lv.3；镇民既感激又恐惧；拾荒者商会账房铁算盘第一次嗅到他的秘密
    map: 碎屑平原·镇外废野（甲虫窝、史莱姆洼地）
    characters: 零、容小满、村长、铁算盘（拾荒者商会账房）、赖三（远处盯梢）
    task_type: 主线+支线（清剿委托）
    conflict: 潮后怪物残留；镇民对他“怪物一样的孩子”的恐惧与排斥；铁算盘想压价收购他的战利品、套他的秘密；赖三记恨在身
    monsters: 静电史莱姆群（Lv.2）、腐化甲虫（Lv.3）
    battle: 连战车轮：先吞一只弱怪临时强化后横扫史莱姆群；再攻甲虫窝，学会躲酸液、劈背甲弱点，边打边被溅一身黏液
    skills: 吞噬熟练提升（可短暂借用所吞怪物的攻击本能）；自悟的蛮力横斩（斩击雏形，未成形）
    equipment: 裂变剑灰白（砍出缺口又咬回来——成长武器伏笔）；废灵护甲再补两针（记账）
    rewards: Lv.1→Lv.3（两次升级提示）；灵核碎片×8；甲虫壳材料（卖给商会换钱）
    relationship: 与镇民（感恩与恐惧并存）；与铁算盘（第一次被资本嗅到秘密）；与赖三（结怨加深）
    reveal: 吞噬后能短暂“借用”怪物本能（成长性初显）；潮后怪物的灵核都带着腐化味，吸收越多，夜里灵核越烫——腐化代价的第一次隐约感知（大虫坏核未吞：零只被临死残响冲击，核本体收进怀里——吞噬残留规则示范）
    satisfaction: 升级连跳的成长快感；从“被野狗追”到“横扫地甲虫窝”的肉眼可见变强
    fun: 容小满卖药水：“一瓶回灵水，两块碎片，谢绝还价——你是老客户，给你抹个零，抹掉那半块”；零：“我第一次见抹零是往多了抹的”
    suspense: 吞噬的代价在夜里隐隐发烫；赖三在跟谁打听他的事？
    hook: 铁算盘深夜敲开零的门：“小零啊，听说你能'消化'怪物——商会想请你干趟活，价钱好商量。”
    word_count: 4100
  - chapter: 4
    title: 第一单生意
    goal: 接下拾荒者商会首单委托，清剿镇西甲虫窝；学会组队打怪的配合；Lv.3→Lv.4；发现甲虫窝深处通往静电洞穴方向的地道
    map: 碎屑平原·镇西甲虫窝（废矿坑）
    characters: 零、铁算盘、容小满（随队治疗，收费）、临时搭档（商会两个半吊子猎手）
    task_type: 支线（商会委托）+主线铺垫
    conflict: 甲虫窝比情报里大得多；两个搭档拖后腿还想分赃不均；铁算盘压价；中途遭遇精英甲虫（小头目）突袭
    monsters: 腐化甲虫群（Lv.3）、精英甲虫（Lv.5 小头目）
    battle: 小队配合作战：零主攻（吞噬强化开路），搭档掩护，容小满治疗；精英甲虫突袭时零拼命——吞下精英甲虫的半颗灵核，惊险取胜
    skills: 吞噬强化第二形态（吞甲虫获得背甲硬化）；斩击熟练提升
    equipment: 无新装备（战利品卖给商会）；护甲再补
    rewards: Lv.3→Lv.4；灵能报酬加灵核碎片；拾荒者商会声望上升
    relationship: 与搭档（从看不起到服气）；与容小满（配合默契，她仍记账）；与铁算盘（他更想挖出他的秘密了）
    reveal: 吞半颗灵核等于不完全强化，代价更大（灵核发烫更久）——代价机制深化；甲虫窝深处的地道通向静电洞穴方向（地图伏笔）
    satisfaction: 小爽：一拖二照样完成任务；把精英甲虫掀翻在地的场面
    fun: 搭档吹牛被当场打脸；容小满收治疗费：“共急救两次，抹了零，你欠我八块碎片”
    suspense: 铁算盘到底想用零做什么？地道尽头通向哪里？
    hook: 地道尽头传来规律的“咕噜咕噜”声——像心跳，又像闷雷——静电洞穴方向有异动
    word_count: 3900
  - chapter: 5
    title: 废铁狼的獠牙
    goal: 升级期第一场硬仗：猎杀废铁狼群，Lv.4→Lv.5；遭废铁狼王伏击惨胜，左臂留下狼咬疤；狼窝里捡到半张旧地图碎片（下章隐藏地点线索）
    map: 碎屑平原·东侧废铁狼领地（锈铁林）
    characters: 零、容小满、老瘸（本地老猎户，教零辨识怪物习性）
    task_type: 支线（猎狼委托）+主线铺垫
    conflict: 废铁狼群会包夹围猎（狼很聪明）；狼王（Lv.7 精英）伏击；容小满为救零暴露了商会没教过的治疗术；零被狼王咬穿左臂（真伤、血、疼、狠劲）
    monsters: 废铁狼（Lv.5）、废铁狼王（Lv.7 精英）
    battle: 狼群包夹——零用吞噬强化速度突围；狼王伏击——零吃瘪挨一爪，靠容小满急救加自己反咬斩杀狼王（惨胜）
    skills: 尝试吞狼王灵核失败（灵核太烈，差点反噬）；斩击提升
    equipment: 获得：铁牙（材料）、完整灵核×1（废铁狼王低概率掉落）；左臂狼咬疤（人物标志伤疤）
    rewards: Lv.4→Lv.5；完整灵核×1（暂存）；铁牙材料；伤疤
    relationship: 与老瘸（半师半友，学猎杀经验）；与容小满（她暴露更强治疗术，被追问时含糊其辞——埋储能族血脉线）
    reveal: 完整灵核可学技能或喂剑（首次获得完整灵核，规则展示）；狼窝旧箱里的半张地图碎片指向“锈铁神龛”（隐藏地点）
    satisfaction: 惨胜的硬气；拿到第一枚完整灵核的激动（在手里掂了又掂）
    fun: 老瘸口头禅：“狼怕火，你怕狼，你俩都怕我”；容小满包扎时念叨：“这伤得加钱，皮肉伤两块，见骨三块”
    suspense: 容小满为什么会用商会没教过的治疗术？“锈铁神龛”里藏着什么？
    hook: 夜里，狼王灵核在包里发烫，裂变剑的剑刃微微发亮——破铁条在“馋”那枚灵核
    word_count: 4300
  - chapter: 6
    title: 锈铁神龛与闪步
    goal: 按地图碎片找到隐藏遗迹锈铁神龛，破解机关拿到藏宝：技能书·闪步加灵能结晶；但技能书“读不进去”——空白灵核的限制，埋下觉醒才能学的伏笔
    map: 碎屑平原·锈铁神龛（隐藏遗迹，废铁狼领地深处地洞）
    characters: 零、容小满、老瘸（守在洞口放风）
    task_type: 隐藏任务（地图碎片触发）
    conflict: 神龛机关（锁、陷阱）；守龛的腐化守卫；容小满与零分赃讨价还价；技能书到手却学不了的憋屈
    monsters: 锈傀儡（Lv.6，机关守卫）、烧蚀犬（Lv.8 精英，守龛）
    battle: 机关加守卫战：容小满用回灵术当“盾”，零硬拼烧蚀犬；烧蚀犬残血自爆——老瘸吼“躲！”——零第一次凭本能险险闪开（预演闪步）
    skills: 获得：技能书·闪步（暂不可学——“字是活的，在眼前打转，就是吞不进去”）；斩击提升
    equipment: 获得：灵能结晶×2、技能书·闪步（蓝级技能书）
    rewards: 技能书·闪步；灵能结晶×2；图鉴条目（锈铁神龛首次探索）
    relationship: 与老瘸（交情加深）；与容小满（并肩分赃，她明确“你欠我的钱又往上加了三笔”）
    reveal: 闪步是位移技（未来核心技能），到手却学不了——空白灵核连技能书都“读不进去”，第一次正面展示零灵核的异常：不是废，是“装不下”；烧蚀犬自爆习性等于燃烧瓶原材料（Boss 战伏笔）
    satisfaction: 开隐藏宝箱的兴奋；捡到技能书当场狂笑——然后发现学不了，笑容凝固（先扬后抑的喜剧爽感）
    fun: 零抱着技能书狂笑：“哈哈哈哈发了！”然后学不了；容小满：“你笑，我也笑——分我一半，不然我告诉商会你私挖神龛”
    suspense: 要什么条件才能学闪步？灵能结晶为什么被剑偷偷吸走？
    hook: 灵能结晶被裂变剑“偷吸一口”，剑刃上第一次浮现细小的裂纹灵纹——破铁条在自行“进食”
    word_count: 4200
  - chapter: 7
    title: 火星牙
    goal: 猎杀烧蚀犬获取火星牙材料（Boss 战燃烧瓶原料伏笔兼商会订单），遭遇赖三带打手截胡抢猎、打伤老瘸，结怨升级；容小满第一次展示“净化”能力
    map: 碎屑平原·西部烧蚀地（犬群领地）
    characters: 零、容小满、赖三、赖三打手（阿肥、瘦猴）、老瘸（被打伤）
    task_type: 支线（商会材料订单）
    conflict: 烧蚀犬群凶猛；赖三带打手半路截胡抢猎、打伤老瘸、抢走大半火星牙；零气炸但得先救人；容小满为老瘸净化伤口里的腐化毒（暴露净化能力）
    monsters: 烧蚀犬（Lv.8 精英×2）
    battle: 犬群混战：零主攻斩犬，容小满远程治疗加净化，赖三打手混水摸鱼；零被瘦猴偷袭得手（阴沟翻船的憋屈）——咬牙记下这笔账
    skills: 吞噬强化（火抗尝试）；斩击提升
    equipment: 获得：火星牙×3（被抢走一半，剩×1）；无新装备
    rewards: 等级未变（Lv.5，经验被截胡分流——蓄力）；火星牙×1；老瘸伤愈
    relationship: 与赖三（血仇结下：抢货加伤人）；与老瘸（愧疚加更敬重）；与容小满（她露了净化底牌，两人立约保密）
