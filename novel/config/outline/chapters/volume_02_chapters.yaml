# 卷二《天梭城新人》章节精细章纲（第 16-30 章）
# 数据源：volume_02.yaml / master_story.yaml / bible（worldview / world_rules / style_guide）/ characters / progression（levels / classes / equipment / drops）/ maps / monsters / factions / novel_constitution.json
# 生成方式：全新推演，未参考任何旧版章纲（旧版已删除）
# 卷末状态（供 Writer 对齐）：
# - 零：Lv.10 → Lv.20；裂变剑 绿→蓝（剑身裂纹灵纹，获技能残影·噬流虫突刺）；静电束缚（卷一 Boss 掉落）、闪步、斩波斩、吞噬（隐藏能力）
# - 队友：容小满（储能师，Lv.16 左右，储能族血脉线索已埋）；频闪（镜频猎手，第18章入队，Lv.17，获蓝装巡影披风）；闸门（阻流族重甲守卫，第21章入队，Lv.18）；忆灵（缓存幽灵，第27章入队，Lv.13）；团子（静电史莱姆宠，吞电进化异常伏笔加深）
# - 卷末：5 人 1 宠；地图碎片·过载荒原 2/2 拼合，过载荒原入口现（接卷三）；赵家脏灵能账册曝光，赵启当众下跪后灰溜溜离城
# - 伏笔：容小满储能族血脉（第22章）；过载荒原方向（第19章地图碎片）；腐化教团黑市痕迹（第22/23章埋，第26章印记首现，白袍客咬上队伍）；团子吞电进化异常（第17/23/29章递进）；忆灵“会读记忆仓的幽灵”与记忆仓秘密（第26/27章）；裂变剑来历（第30章裂纹灵纹呼应）

chapters:
  - chapter: 16
    title: 城门外的白眼，大厅里的打脸
    goal: 零一行抵达天梭城，完成冒险者注册，打出“势利眼接待”第一记小爽点打脸；赵启初次亮相结怨，立住“天梭城新人”卷题。
    map: 天梭城·南城门 → 冒险者公会大厅
    characters:
      - 零
      - 容小满
      - 团子
      - 公会接待（势利眼）
      - 公会执事
      - 赵启（二楼远观亮相）
    task_type: 主线·进城注册（阵营：冒险者公会）
    conflict: 入城登记官见零额角淡青废灵纹，百般刁难收“垃圾税”；公会接待见三人灰头土脸、装备寒酸，把注册费翻三倍，还安排最次的候审席；零不服，接待搬出“等级评定”压人，嘲讽废灵出身的一辈子只配当跑腿的。
    monsters: 无（城市场景）
    battle: 冲突升级为主，无大规模战斗：等级评定测试场，接待让零“演示一下”想看他出丑——零一记斩波斩把测试桩劈成两半，静电束缚把试炼傀儡定在原地三秒，全场安静。
    skills: 斩波斩、闪步、静电束缚（零）
    equipment: 裂变剑（绿）、雷纹护臂（蓝）测试场亮相，接待脸色发绿
    rewards: 冒险者徽章（二阶学徒·见习）、注册礼包、公会任务板接取权限、第一笔悬赏：脉冲林边缘噬流虫清剿
    relationship: 零×容小满（她一边心疼注册费一边小声算账，零嘴硬“进了城，钱能挣回来”）；零×团子（团子趴零脑袋上吞电，被登记官嫌弃“破史莱姆”，团子喷他一脸电花）
    reveal: 天梭城的规矩（等级决定待遇）；冒险者公会等级评定体系；贵族少爷赵启在二楼围观，嗤笑一句“废灵也配进天梭城”被零听见——梁子当场结下（赵启首次登场）。
    satisfaction: 小爽点：测试场一刀定音，势利眼接待脸色青白、当众改口“这位大人”，围观冒险者起哄叫好。
    fun: 团子吞了接待台的登记灵墨，吐出一串蓝墨水泡泡；容小满把注册费发票叠好收进腰包：“回去要记账的。”
    suspense: 赵启那句“废灵也配进天梭城”没有下文——他记住了零的脸。
    hook: 任务板上贴出一张新悬赏：脉冲林边缘噬流虫泛滥，报酬翻倍，落款是个陌生的贵族印章。
    word_count: 3900

  - chapter: 17
    title: 第一单，就遇见雷弧兽
    goal: 完成首单公会任务（脉冲林边缘噬流虫清剿），展示三人一宠配合，零 Lv.10 → 12 双连升；首次直面脉冲林生态；为赵启第一次使绊子埋线。
    map: 脉冲林边缘（天梭城东郊）
    characters:
      - 零
      - 容小满
      - 团子
      - 路过的猎手（背景）
    task_type: 讨伐任务（公会悬赏：噬流虫清剿）
    conflict: 悬赏写明“Lv.9 噬流虫”，实际虫群规模是平时三倍——有人暗里往林子深处放“引虫的饵”（赵启暗中做手脚的第一处痕迹）；容小满被吐灵能丝的虫缠住，差点被拖进虫巢。
    monsters:
      - 噬流虫群（Lv.9）
      - 雷弧兽（Lv.13 精英，被虫群惊出）
    battle: 虫群包围战：零斩波斩开路，容小满回灵术护场，团子吞电放静电弹晕一片；雷弧兽精英偷袭，零闪步拉开、静电束缚定身、反杀。
    skills: 斩波斩、闪步、静电束缚（零）；回灵术、灵能护罩（容小满）；静电弹（团子）
    equipment: 裂变剑（绿）、雷纹护臂（蓝）；掉落雷纹矿石、毒囊、完整灵核（雷弧兽）
    rewards: 【等级提升：Lv.10 → Lv.11】【等级提升：Lv.11 → Lv.12】双连升；首单报酬；雷纹矿石（裂变剑强化材料）；团子战后吞了雷弧兽的电，身上电纹明显变亮（异常首现）。
    relationship: 零×容小满（她护住受伤的零，零嘴硬“我没事”，耳朵却红了）；零×团子（团子吞电后精神抖擞，零揉它脑袋“出息了啊”）
    reveal: 脉冲林“边缘其实不边缘”——雷弧兽领地比地图标的大一圈；虫群暴动异常（有人引虫）；团子吞电进化异常伏笔加深。
    satisfaction: 小爽点：双连升加反杀雷弧兽，回城交货被公会记一笔“新人首单全清”，隔壁老冒险者刮目相看。
    fun: 容小满揪着团子耳朵教训“吞电会拉肚子的！”，团子打了个带电弧的嗝，烧焦她一缕头发。
    suspense: 引虫的饵是谁放的？脉冲林深部到底发生了什么？
    hook: 回城交货当晚，任务报酬被公会扣下一半，理由是“虫群规模与委托不符，怀疑你们虚报击杀”——背后有只手在动。
    word_count: 3500

  - chapter: 18
    title: 话痨猎手的求救信
    goal: 救援被虫群围困的猎手频闪，频闪入队；赵启第一次“买凶使绊子”浮出水面；频闪之眼亮相；青梅赵璃轻描一笔（狗粮点，不展开）。
    map: 脉冲林中部·虫巢谷
    characters:
      - 零
      - 容小满
      - 团子
      - 频闪（镜频猎手）
      - 赵家鹰镖队（暗手，露一面）
    task_type: 救援任务（公会紧急委托：猎手频闪失联）
    conflict: 频闪是出名的“话痨自大猎手”，自称脉冲林人形导航，结果被虫群围困虫巢谷三天；公会委托信息被人动过手脚——标的位置偏了一里，把人直引向虫巢深处（赵启买凶使绊子的实锤痕迹）；零带队进谷时，身后有佣兵跟着“收尸”。
    monsters:
      - 噬流虫群（Lv.9）
      - 雷弧兽（Lv.13）
      - 镜频猎手（腐化）（Lv.16 精英，虫巢谷霸主）
    battle: 谷口突围战：零正面开路，容小满护盾，团子放电开路；救出频闪后遭腐化镜频猎手幻影分身围攻，频闪残血用频闪之眼标记真身，零闪步加静电束缚加斩波斩连招收割。
    skills: 频闪之眼（频闪，侦察/标记弱点）、速射（频闪）；斩波斩、闪步、静电束缚（零）
    equipment: 光弓碎片（腐化镜频猎手掉落）、技能书残页
    rewards: 任务报酬；频闪入队（拍胸脯“这片林子以后归我罩了”）；技能书残页（裂变剑强化材料）
    relationship: 零×频闪（损友互怼，零吐槽“你是来救援还是来添乱的”）；频闪×赵璃（换药时频闪念叨“阿璃要是知道我这么狼狈，得笑死”——青梅轻暧昧点，一笔带过）
    reveal: 频闪之眼能标记怪物灵核弱点；腐化镜频猎手说明“林子里有人在猎杀猎手”；频闪认出跟梢佣兵腰上的鹰纹：“赵家的鹰镖队？”
    satisfaction: 小爽点：把话痨猎手从虫堆里拎出来，频闪心服口服改口叫“队长”，围观猎手起哄。
    fun: 频闪脱困后吹牛半小时“这是战略性撤退”，容小满一句“给钱，治疗费”，当场噎住他。
    suspense: 赵家鹰镖队为什么跟着零？赵启已经盯上这支队伍了。
    hook: 频闪入队第一句话，指着脉冲林深部：“那里面有一头三米长的虫王，赏金挂了一个月没人敢接。”
    word_count: 3600

  - chapter: 19
    title: 虫王首杀
    goal: 四人队伍首杀区域 Boss 噬流虫王（越级 Lv.20），零 Lv.12 → 13；掉落地图碎片·过载荒原，剑喂灵核获技能残影；赵家鹰镖队抢功被当场打脸——卷二第一个中爽点。
    map: 脉冲林深部·虫王巢
    characters:
      - 零
      - 容小满
      - 频闪
      - 团子
      - 赵家鹰镖队（抢功）
    task_type: Boss 讨伐（悬赏：噬流虫王）
    conflict: 虫王口器张开如花、毒液喷吐加召唤虫群，四人配合被冲散；打到残血时赵家鹰镖队杀出“替你们收尾”想捡漏抢首杀——零一句“首杀看印记”，虫王灵核上还嵌着他静电束缚打出的雷纹。
    monsters:
      - 噬流虫群（Lv.9）
      - 噬流虫王（Lv.20 区域 Boss）
    battle: Boss 战：团子静电弹控小虫，频闪穿云箭牵制虫王，容小满灵能护罩挡毒液，零闪步贴近砍口器；虫王狂暴召唤虫群，零静电束缚定住虫王三秒，一剑穿心。
    skills: 静电束缚（关键控制）、穿云箭（频闪）、回灵术、灵能护罩（容小满）、吞噬（零，战后吸收虫王灵核喂剑）
    equipment: 完整灵核·噬流（喂裂变剑 → 剑获技能残影·噬流虫突刺）、毒王芯（蓝材料）、地图碎片·过载荒原（1/2）、光弓碎片
    rewards: 【击杀：噬流虫王】【等级提升：Lv.12 → Lv.13】；越级击杀灵能翻倍；虫王首杀全城公告（公会喇叭响三遍）；地图碎片·过载荒原（新地图线索）
    relationship: 频闪战斗中第一次听指挥（“队长说蹲就蹲”）；零×容小满（她挡毒液时零红了眼，战后第一次认真说“下次别挡”）
    reveal: 过载荒原的方向与传说（灵压、烧蚀犬群、进不去的大门）；地图碎片需凑两片才能拼出入口；赵家鹰镖队抢功说明赵启已开始下绊子。
    satisfaction: 中爽点：Boss 首杀加地图碎片加全城公告，鹰镖队灰溜溜滚蛋，围观冒险者眼睛发亮。
    fun: 团子在虫王灵核边上打滚，吞了一口灵核碎屑，全身电纹亮得像过节。
    suspense: 地图碎片才一片——另一片在哪？赵启吃了亏，会怎么报复？
    hook: 回城庆功宴上，公会执事把“虫王首杀”挂到赵家名下的冒险队头上——全城都在传“废灵队捡了赵家的漏”。
    word_count: 4300

  - chapter: 20
    title: 谁才是首杀？
    goal: 赵启第一次正面登场，当众抢功羞辱；零用毒王芯证据反打脸；赵璃暗中帮频闪解围（狗粮点）；储能商会委托出现，牵出容小满出身线。
    map: 天梭城·冒险者公会大厅 → 闹市茶馆
    characters:
      - 零
      - 容小满
      - 频闪
      - 团子
      - 赵启
      - 赵家管事
      - 公会执事（赵家表亲）
      - 赵璃（暗中）
      - 围观冒险者
    task_type: 支线·悬赏结算风波（声望）
    conflict: 赵启当众宣读“我家护卫队首杀虫王”的公告，指着零一行说“废灵队也配抢功？”；公会执事和稀泥；零甩出毒王芯——芯上残留的雷纹只可能出自静电束缚，赵家护卫连虫王口器都没破防。
    monsters: 无（城市场景）
    battle: 无大战斗，冲突升级：语言交锋加证据打脸；赵启护卫想动手，频闪一箭钉在他靴尖，团子电弧噼啪作响压住全场。
    skills: 频闪之眼（当众标记毒王芯上的雷纹，全大厅看见）
    equipment: 毒王芯（蓝材料，当场作证据）
    rewards: 虫王首杀荣誉回归零小队；公会补偿金；声望上涨（“废灵小队”名号传开）；储能商会老掌柜在角落看完全程，递来一张委托单。
    relationship: 零×赵启（正式结怨，赵启撂话“让你在天梭城混不下去”）；频闪×赵璃（散场后频闪在衣兜里摸到一枚赵璃塞的疗伤膏——青梅狗粮点，一笔带过）
    reveal: 赵家势力网（公会执事是赵家表亲）；储能商会与容小满出身的关系苗头；赵启“记仇但怂”——当众打脸只会让他更恨。
    satisfaction: 小爽点：证据甩脸，赵启脸色铁青拂袖而去，围观者改口“废灵小队牛啊”。
    fun: 频闪把公告念三遍“首杀·零小队”，字正腔圆，气得赵家管事跳脚。
    suspense: 储能商会老掌柜为什么盯着容小满看了那么久？
    hook: 老掌柜的委托单：护送一支商队穿过脉冲林边陲，报酬是普通护送三倍——“但听说，商队里运的东西，赵家也想要。”
    word_count: 3400

  - chapter: 21
    title: 挡在我身后
    goal: 护送储能商会商队穿越脉冲林边陲；阻流族重甲守卫闸门登场入队；赵启雇佣兵假扮怪物劫道被拆穿；零 Lv.13 → 14。
    map: 天梭城 → 脉冲林边陲商道
    characters:
      - 零
      - 容小满
      - 频闪
      - 团子
      - 闸门（阻流族重甲守卫）
      - 商队管事
      - 赵启雇的劫匪（假扮怪物）
    task_type: 护送任务（储能商会委托）
    conflict: 商队半路遇“雷弧兽群”劫道——实际是赵启雇的佣兵披兽皮假扮，想抢货物嫁祸怪物；闸门作为商队护卫，独自挡在车队前，一人扛住十人冲击，沉默如铁；零发现兽皮下的布料是赵家商行的绸缎。
    monsters:
      - 雷弧兽（Lv.13）
      - 假扮怪物的佣兵（Lv.12-14）
    battle: 商道伏击战：闸门嘲讽技能拉稳仇恨、壁垒减伤扛住群攻，频闪远程点名，零绕后收割；混战中闸门为护商队中一记闷棍，闷哼一声反手把对方连人带兽皮拍飞。
    skills: 嘲讽、壁垒（闸门）、速射（频闪）、斩波斩、闪步（零）、回灵术（容小满）
    equipment: 闸门自带阻流族重甲（灰白偏绿）、阻流族族徽
    rewards: 【等级提升：Lv.13 → Lv.14】；三倍护送报酬；储能商会声望；闸门入队（他对零说“你们挡在别人前面，我挡在你们前面”——沉默金句）
    relationship: 零×闸门（生死之交开端：零把受伤的闸门扶上马车，闸门只说“……嗯”）；闸门×频闪（频闪话痨，闸门用沉默消化他，笑点）
    reveal: 阻流族背景（族规、要塞、重甲一族的守护传统）；赵启雇人假扮怪物的证据（绸缎加俘虏招供）；闸门违抗“族规不得离开要塞百里”的代价已埋。
    satisfaction: 中爽点前奏：一人扛十人的视觉爽点，“挡在我身后”成为队伍口号。
    fun: 频闪给闸门起外号“铁罐头”，闸门用沉默表达反对；团子爬到闸门肩甲上趴着，闸门没有拒绝。
