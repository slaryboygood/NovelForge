# 卷三《过载荒原》章节细纲（第 31-45 章）
# 等级线：Lv.20 → Lv.31（节点：第33章 Lv.21→23、第38章 Lv.25、第44章 Lv.28→30、第45章 Lv.30→31）
# 节奏锚点：31-32 入荒原+犬群清场小爽点｜33 闸门族地线｜37 教团暗桩伏笔｜38-40 巨人领地遭遇+闸门违抗族规｜41 壁垒｜42-44 Boss三阶段｜45 卷末爆点
# 闸门弧光：服从族规（“族长说不能离开阻流关”）→ 违抗族规（“他们是我兄弟”）；族长固执但最终默许
# 世界红线备忘：正文禁工程术语、角色语言差异化（闸门沉默金句/族长威严古板/老鼹油滑）、【】提示短促

chapters:
  - chapter: 31
    title: 热浪之门
    goal: 队伍抵达过载荒原南缘入口，完成首次探索与首战（焦土蜥），摸清荒原三规则（热浪、夜晚犬群、深入更凶），为犬群清场铺底。
    map: 过载荒原·南缘入口（记忆仓/能量仓）
    characters: 零（Lv.20）、容小满（Lv.20）、闸门（Lv.20）、频闪（Lv.20）、忆灵（Lv.19）、团子
    task_type: 主线·地图探索（开图）
    conflict: 热浪与灵压压制全队状态；零与频闪对“地图难度”嘴硬逞强 vs 真实战力吃紧；入夜后地平线亮起几十对橙火眼窝的不安。
    monsters: 焦土蜥（普通，Lv.22）、烧蚀犬群（远吠，未接战）
    battle: 首次遭遇三只焦土蜥小队：甩尾+喷土夹击，零斩波斩劈开背甲，频闪速射补刀，闸门盾挡喷土，容小满回灵术护场；零试吞一颗焦土蜥灵核，发现荒原灵核更“烫”，吞噬有腐化风险。轻胜收尾。
    skills: 零·斩波斩、闪步、吞噬（试吞）；频闪·速射；闸门·嘲讽；容小满·回灵术
    equipment: 无蓝装；焦鳞材料若干
    rewards: 【首次抵达：过载荒原】；焦鳞×6、灵核碎片×12；图鉴新增·焦土蜥
    relationship: 闸门望着荒原尽头沉默——那是阻流关外族人世代巡视的“家门之外”；他第一次当着队伍说出“族长说，不能离开阻流关”。
    reveal: 荒原三规则：白天热浪耗状态、夜晚烧蚀犬出没、越深入怪物越暴躁；焦土蜥灵核带“过载”余温，吞噬要付出腐化代价的风险初现。
    satisfaction: 开图爽点——新地图、新图鉴、首战轻胜；零吞灵核“烫嘴”的吃瘪小梗。
    fun: 频闪吹嘘能在荒原待三天三夜，转头被热浪烫得直跳；团子把焦鳞当零食啃，被辣得满地打滚。
    suspense: 夜幕降临，地平线亮起几十对橙火眼窝——烧蚀犬群围上来了。
    hook: 零握剑起身：“经验包自己送上门了。切，就这？”犬群低吼压过他的嘴硬。
    word_count: 3400

  - chapter: 32
    title: 犬群清场
    goal: 正面清掉烧蚀犬群（含犬王），立住“荒原第一战”的小爽点；喂剑成长出新残影；攒下火星牙材料与名气，为阻流关之行铺垫。
    map: 过载荒原·犬巢平原
    characters: 零、容小满、闸门、频闪、忆灵、团子
    task_type: 支线·清剿（小爽点）
    conflict: 犬群数量压制（三十余只）与残血自爆的威胁；犬王狡猾指挥迂回包抄；频闪被咬断弓弦的狼狈。
    monsters: 烧蚀犬（荒原变种，Lv.21-22，残血自爆）、烧蚀犬王（精英，Lv.24）
    battle: 三线合围战：闸门正面盾墙拦冲击，频闪风筝右翼，零闪步突入左翼劈杀，团子放电阵控场；犬王登场喷火，零静电束缚定住，吞噬犬王灵核喂剑——剑身多一道“火咬”残影，最后一剑劈穿犬王；容小满灵能护罩接住两波自爆火星。
    skills: 零·静电束缚、吞噬（喂剑）；闸门·嘲讽；频闪·速射、穿云箭；容小满·灵能护罩；团子·电击阵
    equipment: 蓝·火星战靴（犬王掉落，给频闪：速度+12，闪避+3%）
    rewards: 【获得：蓝色装备·火星战靴】；火星牙×18、灵核碎片×30；裂变剑习得技能残影·火咬；图鉴新增·烧蚀犬/烧蚀犬王
    relationship: 频闪第一次真心道谢（不再嘴硬“那是失误”）；闸门看着零吃灵核的样子，想起族里“吞噬是邪道”的说法，欲言又止。
    reveal: 荒原烧蚀犬是“被烫坏”的碎屑平原犬种，追着热源跑；教团收购火星牙的风声从犬巢边路过（暗桩线第1枚伏笔钉下）。
    satisfaction: 清场干净利落+蓝装掉落+喂剑新残影三连爽，小爽点达标。
    fun: 团子追着火星牙满地滚，被自爆犬炸成黑球；频闪的弓弦断了，哀嚎“我的老婆本”。
    suspense: 清完犬群，拾荒者商队的车辙从地平线延伸过来——有人盯着这批火星牙。
    hook: 忆灵小声说：“那……那不是普通商队，车上有……暗紫色的东西。”
    word_count: 3600

  - chapter: 33
    title: 族长令
    goal: 到达阻流关，接取阻流要塞委托（讨伐过载巨人）；族长立“族规”不许闸门出关，闸门族地线正式开启；零两连升并换下废灵护甲。
    map: 阻流关（要塞/闸门族地）
    characters: 零、容小满、闸门、频闪、忆灵、团子、阻流族长（威严古板）、族卫长
    task_type: 主线·阵营委托开启（阻流要塞）
    conflict: 族长固执不信外人，立下“闸门只许当向导探到荒原边缘、不许交手、探明即回”的族规；闸门沉默应下，队伍不满；族长单独召见时那句“你父亲就是死在巨人手里的”扎进闸门心里。
    monsters: 无（关内休整）；远处关外巨兽的低吼作背景
    battle: 无正面战斗；改为“谈判交锋”：零用激将法+阻流关外巡逻队折损的战报逼族长松口接委托，容小满算账砍价，频闪吹牛添乱。
    skills: 无新技能
    equipment: 蓝·焦鳞战衣（要塞军需官用犬牙+焦鳞赶制，给零换下废灵护甲：防御+15，火抗+10%）
    rewards: 【等级提升：Lv.21 → Lv.22】【等级提升：Lv.22 → Lv.23】；主线·阻流要塞委托·讨伐过载巨人；焦鳞战衣；要塞声望+10；补给·能量仓券×5
    relationship: 零×闸门：零拍胸脯“你守关，我杀巨人”，闸门低头：“……嗯。”；族长×闸门：威严下的压抑——“你爹死在那东西手里”这句话是族规之外的旧伤。
    reveal: 阻流族与过载巨人的世代旧仇：闸门之父死于巨人；阻流族视吞噬为邪道；要塞常年被巨人过载暴走威胁，委托人其实很急。
    satisfaction: 两连升的等级爽点；换上新甲的打脸感（废灵护甲光荣退役）；委托接住的推进感。
    fun: 零在族规碑前啃肉干被族长瞪；频闪偷摸族卫的盾被追着跑；团子把能量仓当成零食柜。
    suspense: 族长最后把闸门单独叫进祠堂，出来时闸门眼圈发红，却一个字不说。
    hook: 出关那晚，闸门握着族纹令牌站在城门下——令牌是“探路令”，还是“最后通牒”？
    word_count: 3800

  - chapter: 34
    title: 老鼹的营地
    goal: 荒原深处侦察，进入拾荒者营地结识油滑商人老鼹，买到巨人领地情报与“凉水井”传说，钉下教团收购怪物心脏的暗桩线索第2枚。
    map: 过载荒原·中部拾荒者营地
    characters: 零、容小满、闸门、频闪、忆灵、团子、老鼹（拾荒者，油滑）、营地伙计
    task_type: 支线·情报侦察
    conflict: 老鼹坐地起价的奸商嘴脸 vs 容小满的砍价功力；营地暗处有人盯着队伍的行囊；闸门在营地里听到族人巡关的传闻，心绪浮动。
    monsters: 焦土蜥群（Lv.22，营地外小规模遭遇）
    battle: 营地外焦土蜥群突袭商队骡子：零斩波斩+频闪穿云箭清场，闸门单手把骡车拖回营地——展示队伍战力，换来老鼹的好脸色与真情报。
    skills: 零·斩波斩；频闪·穿云箭；容小满·回灵术
    equipment: 无装备掉落；老鼹以“友情价”卖出一张手绘荒原图（灰白）
    rewards: 荒原中部地图（灰白）；情报：巨人领地位于北谷、荒原散布“凉水井”（老辈人打巨人用的）、有人高价收巨蝎尾刺与怪物心脏；灵核碎片若干
    relationship: 零×老鼹：互相试探的买卖关系建立（油滑 vs 嘴硬）；闸门×老鼹：老鼹认出征徽，态度突然恭敬又躲闪。
    reveal: 所谓“凉水井”其实是旧防线留下的冷却井，井口冒白气，巨人绕着走（散热井弱点线索首次进队）；“收心脏的人”出手阔绰不讲价（教团暗桩影子）。
    satisfaction: 情报到手+砍价成功的爽快；闸门单手拖骡车的力士场面。
    fun: 老鼹油滑话术三连：“货真价实、童叟无欺、就是有点贵”；团子偷喝井水被烫得跳脚。
    suspense: 老鼹送队伍出营时压低声音：“收心脏的那位爷，前天刚从这儿过——往北，巨人那边。”
    hook: 频闪回头，看见营地栅栏上钉着一枚焦黑的、形似徽记的东西，一闪就不见了。
    word_count: 3300

  - chapter: 35
    title: 赤蝎之巢
    goal: 荒原巨蝎巢穴支线——救援被蝎群围困的拾荒者商队，反杀巨蝎群，闸门换新甲，团子吞过载灵核现异常（进化伏笔）。
    map: 过载荒原·赤蝎沙窝
    characters: 零、容小满、闸门、频闪、忆灵、团子、商队幸存者
    task_type: 支线·救援+清剿
    conflict: 巨蝎群（Lv.28精英带队）围困商队，毒雾弥漫；零想速战却被毒尾逼退；团子趁乱吞了颗过载灵核，浑身滚烫抽搐——是进化还是出事，众说纷纭。
    monsters: 荒原巨蝎（精英，Lv.28，头领）、巨蝎幼体（Lv.24）
    battle: 毒雾战术战：容小满灵能护罩罩住伤员，频闪远程点杀幼体，零闪步绕后斩蝎尾，闸门盾牌硬顶蝎钳；巨蝎头领喷毒雨，零静电束缚定住，吞噬其灵核喂剑——剑新增“蝎尾刺”残影，一剑贯颅。
    skills: 零·闪步、静电束缚、吞噬（喂剑）；闸门·嘲讽；频闪·速射；容小满·灵能护罩、回灵术
    equipment: 蓝·赤蝎重甲（巨蝎头领掉落，给闸门：防御+18，嘲讽冷却-5%）
    rewards: 【获得：蓝色装备·赤蝎重甲】；蝎毒囊×9、巨蝎头领灵核；裂变剑习得技能残影·蝎尾刺；图鉴新增·荒原巨蝎
    relationship: 零×容小满：她给零包扎被蝎毒划伤的胳膊，一边骂一边记账：“这刀算你欠我三顿饭！”；闸门×队伍：他第一次主动开口要装备——“这个，给队伍用。”
    reveal: 团子吞电进化的异常升级：吞下过载灵核后皮毛出现橙红电斑，能吃但会“烫嘴”（卷八宠物原型的伏笔加深）。
    satisfaction: 反杀精英群+双掉落+喂剑新残影；救援成功被商队磕头的场面。
    fun: 团子一边冒烟一边追着零要吃的；频闪嘲笑商队头目“连蝎子都打不过”，转头自己被幼体追着满沙窝跑。
    suspense: 巨蝎头领腹甲里嵌着一块暗紫色碎片——不是天然长的，是被人塞进去的。
    hook: 忆灵盯着那块碎片，声音发抖：“这……和天梭城黑市那个灰袍人身上的一样。”
    word_count: 3400

  - chapter: 36
    title: 哨站遗址
    goal: 遭遇过载傀儡巡逻队，发现阻流族旧防线哨站遗址，找到打不开的密柜与散热井分布图的线索；教团暗桩痕迹第3枚（傀儡身上有暗紫纹）。
    map: 过载荒原·旧防线哨站遗址
    characters: 零、容小满、闸门、频闪、忆灵、团子
    task_type: 支线·探索（遗迹发现）
    conflict: 过载傀儡群（Lv.25）的“自爆式”围攻；密柜是阻流族老锁，需族纹血才能开，闸门陷入“开柜=违族规”的纠结；傀儡身上的暗紫纹让忆灵不安。
    monsters: 过载傀儡（普通，Lv.25，残血自爆）、傀儡头目（精英，Lv.27）
    battle: 自爆克制战：闸门嘲讽拉走自爆体，团子放电引爆，零闪步逐一点杀；傀儡头目重拳砸地，零吞噬其傀儡芯——发现芯里混着教团式的“暗紫芯”，吞下后腐化值+2，容小满净化失败，全队警觉。
    skills: 零·闪步、吞噬（试吞傀儡芯）；闸门·嘲讽；团子·电击
    equipment: 密柜未开（悬念）；拾获绿·阻流旧护腕（纪念物，闸门收下）
    rewards: 傀儡芯×14、过载灵核×3；散热井分布图残页（从哨站墙壁拓下）；零腐化值+2（隐患）
    relationship: 闸门在哨站碑前单膝跪下（阻流族旧俗），队伍第一次看见他脸上有表情——是恨；零把绿护腕塞进他手里：“戴着，你爹的盾不是白守的。”
    reveal: 旧防线历史：阻流族世代用“凉水井”打巨人，哨站是打巨人时期的斥候点；傀儡被教团改造过（暗紫纹=教团标记）。
    satisfaction: 发现遗迹+拓下散热井图的推进感；团子引爆自爆体的连环炸场面。
    fun: 忆灵被自爆声吓得挂在频闪背上；零吐槽“这破锁比我灵核还硬”。
    suspense: 密柜上的族纹在闸门掌心亮了一下——柜子认得他，却不肯开。
    hook: 夜半，哨站外传来整齐的脚步声——不是傀儡，是训练有素的、穿甲的人。
    word_count: 3300

  - chapter: 37
    title: 灰袍与密信
    goal: 腐化教团暗桩痕迹主线伏笔章：教团暗桩在拾荒者营地现身，忆灵读仓术截获密信（教团收过载巨人心脏、荒原部署、锈蚀地牢字样），零吞噬过载灵核腐化加重，容小满净化术半成。
    map: 过载荒原·拾荒者营地（暗桩交易现场）
    characters: 零、容小满、闸门、频闪、忆灵、团子、灰袍人（教团暗桩）、老鼹（装傻保命）
    task_type: 伏笔·暗桩遭遇
    conflict: 灰袍人当面交易“怪物心脏”露出教团徽记；老鼹两头糊弄的墙头草姿态；忆灵偷读记忆仓被发现，灰袍召唤污染傀儡与焦土蜥围杀灭口；零为救忆灵吞下教团的过载灵核，腐化值飙升。
    monsters: 污染焦土蜥（Lv.24）、污染傀儡（Lv.26）、灰袍人（人形怪，Lv.28）
    battle: 营地混战：忆灵幻影躲杀，频闪穿云箭射断灰袍咒印，闸门盾墙护伤员；零吞噬过载灵核强行提升战力，静电束缚+斩波斩连杀污染怪，但腐化值+3、眼前发黑；容小满净化术第一次成功半程——把腐化压住一半却没能清干净（技能差最后一步）。
