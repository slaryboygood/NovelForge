chapters:
- chapter: 46
  title: 回家的剑
  goal: 回旧地图爽点：队伍南下途经碎屑平原，零以 Lv.31 三阶行者身份回归废渣镇——赖三磕头、镇民围拢、当年追他满镇跑的废铁狼王被一刀秒（碾压战）；容小满被储能商会挖角（队伍内部波动）；随后整备转职线索，阻流族铁匠鉴定雷弧战甲图纸缺‘新锈合金’，并交付图纸配套的雷纹矿石粉×6，再开赴锈蚀地牢入口完成首次接触战。
  map: 阻流关→晶轨支线→天梭城→碎屑平原·废渣镇（回归）→锈蚀地牢入口/第一层前厅
  characters: 零、容小满、闸门、频闪、忆灵、团子、赖三、村长、铁算盘、储能商会管事、阻流族铁匠、镇民
  task_type: 主线·转职试炼前置（出发与探路）
  conflict: 回归的尴尬与敬畏并存：当年的嘲讽声变成敬畏，赖三磕头认错，铁算盘想高价收他的战利品；储能商会管事当众挖角容小满（‘跟他混不如来商会，待遇翻倍’）——容小满翻账本回绝，队伍气氛微妙；转职线索指向连阻流族都劝退的锈蚀地牢禁地（上一支冒险队连骨头都锈在里头）。
  monsters: 锈蚀甲虫（Lv.32，入口哨兵小队，5 只）
  battle: 碾压战：废渣镇外，当年追得零满镇跑的废铁狼王（Lv.7 精英）拦路——零一剑秒杀，镇民呆滞，‘以前打不过的，现在一刀’。随后地牢入口前厅遭遇战：锈蚀甲虫小队（锈蚀喷吐减速+腐蚀灵能），锈壳弹开斩波斩、频闪速射打不进甲缝、闸门嘲讽拉住、容小满稳血线；零临场找出弱点——甲壳接缝，闪步绕后挑缝斩入，团子喷黏液帮被锈住的队友除锈。小胜但赢得吃力，确立‘锈蚀=减速腐蚀’的地牢规则。
  skills: 零：斩波斩、闪步；闸门：嘲讽、壁垒；频闪：速射、频闪之眼；容小满：回灵术；团子：黏液除锈
  equipment: 裂变剑（蓝）、雷纹护臂（蓝）、巡影披风（蓝）；雷弧战甲图纸（未铸成）
  rewards: 回废渣镇人情：赖三赔偿款+镇民赠礼（腊肉一挂/储能膏）；废渣镇声望‘零发达了’传闻（第一次出名）；雷弧战甲图纸鉴定结论（缺新锈合金·地牢产出）；阻流族铁匠交付雷纹矿石粉×6；锈蚀甲虫材料（锈铁/甲壳）；地牢规则情报（大部分记忆仓沉寂）。
  relationship: 零×废渣镇：从‘小废物’到‘能打的那个’再到现在‘冒险者大人’——镇民态度三层变化；赖三磕头认怂（旧敌人反应）；容小满×储能商会：当场回绝挖角（‘我欠他一条命，账还没还完’）——队伍信任升温；闸门×零：押队同行时难得话多（‘你家，不错’）。
  reveal: 卷四开门信息：锈蚀地牢=Lv.30-45 地下城、转职试炼场、教团‘封炉’阴谋现场；雷弧战甲图纸完整材料清单（深渊铁/锈铁/地牢熔炉）；零的出名让教团暗探第一次注意到他（新悬念）。
  satisfaction: 回旧地图三连爽：身份变化（镇民态度）、实力变化（狼王一刀秒）、旧敌人反应（赖三磕头）——‘原来我走了这么远’的情绪爽点 + 开图新鲜感。
  fun: 容小满翻账本回绝挖角（‘商会欠我的三笔账还没结，你倒先来挖我’）；频闪在镇口吹牛被孩子戳穿（‘你上次不是被虫追着跑吗’）；团子被全村小孩追着摸。
  suspense: 铁算盘深夜单独找零：‘商会最近有批货走晶轨被人劫了，对方点名要‘能吃怪物的那孩子’——你小心。’
  hook: 地牢第一层深处的死寂记忆仓方向，传来极轻的抽泣声——声音与忆灵一模一样。忆灵脸色发白：“不、不是我。”
  word_count: 4200
- chapter: 47
  title: 死仓里钻出的半透明少女
  goal: 第一层推进并收集锈壳材料；既有队友忆灵在死仓中发现一段与自己同形的封存记忆投影；她读仓开捷径（小爽点）直插中层入口，并确认自己缺失的记忆被转移到中层；队伍兑现此前承诺，继续陪她寻找。
  map: 锈蚀地牢·第一层（甲虫走廊→死寂记忆仓区→捷径通道→中层入口）
  characters: 零、容小满、闸门、频闪、团子、忆灵（既有队友）
  task_type: 主线·探索；支线·读仓解密（捷径）
  conflict: 正路被甲虫海堵死，硬闯必引锈潮；大部分记忆仓沉寂，唯一苏醒的仓却映出一个与忆灵相同的半透明少女投影；频闪差点把投影当怪物射散，忆灵既害怕真相又必须亲自读仓；投影不断诱她留在仓内，队伍要在甲虫海逼近前把她唤回现实。
  monsters: 锈蚀甲虫群（Lv.32，甲虫海，绕行+清尾）
  battle: 捷径开启前的清尾战：零闪步斩甲缝+频闪点射漏网之虫+闸门堵口，边打边退；战斗是配角，主角是“捷径轰开、整片甲虫海被甩在身后”的畅快感。
  skills: 忆灵：读仓术（首次展示——死寂的仓在她手下一格一格亮起）、幻影（藏身）；零：闪步、斩波斩
  equipment: 无新增（锈壳材料+一批）
  rewards: 锈壳×20（锻甲材料集齐一半）；捷径通道直达中层入口；情报：中层有“会动的巨大影子”（地牢蠕虫活动痕迹）
  relationship: 零×忆灵：零用CH027以来的旧约定把她从记忆投影里唤回（“说好陪你找，少想一个人留下”）；容小满护住她的实体锚点；频闪为差点射散投影道歉又嘴硬；忆灵再次以读仓术证明“胆小但关键时刻可靠”。
  reveal: 忆灵并非本章初登场；死仓投影证明她曾在锈蚀地牢留下过封存记录，缺失记忆被转移到中层某座仓里；第一层仓还封着旧世界囚牢的看守记录（预埋锈王=典狱长），但不提前揭开完整身世。
  satisfaction: 小爽点：全场瞩目的“废仓变活路”，捷径轰开甩掉甲虫海；忆灵初见萌点（胆小但可靠的反差）。
  fun: 频闪被半透明的忆灵吓得语无伦次、团子好奇地围着忆灵转圈、忆灵紧张时说话结巴。
  suspense: 她的记忆里封着什么？她为什么被困在地牢？捷径尽头的中层阴影里，有什么在动？
  hook: 捷径尽头的黑暗中，一条巨大的暗红身影拖着一团“亮光”迅速缩回洞中——忆灵脸色煞白：“那、那是……它的巢。”
  word_count: 3800
- chapter: 48
  title: 四人锤出一件紫装
  goal: 中层首站：发现旧世界锻造间；集齐锻造三要素（巨人心脏+雷纹矿石+新锈合金），四人合力把雷弧战甲图纸铸成紫装；战中升级 Lv.31→33。
  map: 锈蚀地牢·中层·旧锻造间（旧世界兵工坊）
  characters: 零、容小满、闸门、频闪、团子、忆灵
  task_type: 主线·装备锻造（支线·旧锻造间解密）
  conflict: 锻造缺“新锈合金”——第一层只有锈壳，深层矿脉路线不明；地牢蠕虫（Lv.36 精英）把锻造间当巢穴边缘巡逻，钻地突袭把频闪连人带弓卷走半截；四人没一个工匠，照图纸硬锻第一炉直接炸炉，灵能炉差点把整个锻造间掀了；忆灵读锻造间旧仓找到了矿脉图和蠕虫弱点记录。
  monsters: 地牢蠕虫（Lv.36 精英，初遇——钻地突袭+缠卷）
  battle: 蠕虫战：钻地突袭卷走频闪→零闪步救援+斩波斩砍虫身（虫皮太韧斩不开）→忆灵喊出旧记录“它怕雷纹矿石粉”→容小满撒雷纹粉（卷三荒原库存），蠕虫剧痛甩尾→闸门壁垒硬接→团子放电麻痹→零抓住口器闭合瞬间斩入弱点，蠕虫钻地逃走。
  skills: 忆灵：读仓术（读锻造间记录：矿脉图+雷纹粉克制蠕虫）；零：闪步、斩波斩；闸门：壁垒；团子：放电麻痹
  equipment: 【获得：雷弧战甲（紫）——防御+40，雷弧斩冷却-20%】（四人合力锻成：闸门抡锤、零拉风箱、容小满控炉温+记账、频闪递料、忆灵念图纸）
  rewards: 雷弧战甲（紫，零）；蠕虫芯（蓝材料）；锻造经验；【等级提升：Lv.31→Lv.33】（战中击杀积累+锻造完成的任务奖励）
  relationship: 标题里的“四人”指零、闸门、容小满、频闪四位直接抡锤/控炉/递料者；忆灵负责读图与校正步骤，团子负责供能。六名队友协作的闹剧+默契；容小满算材料成本肉疼；零穿上紫甲显摆被频闪狂酸；忆灵作为既有队友承担不可替代的读图职责，不再重复“第一次被当自己人”。
  reveal: 锻造间=旧世界兵工坊（武器锻造记录）；蠕虫怕雷纹矿石粉（雷系克锈系的规律初显）；深层有锈铁矿脉=新锈合金来源。
  satisfaction: 本卷第一件紫装入手+双级升级，爽感直接拉满；四人锻造喜剧收尾。
  fun: 第一炉炸炉：零被熏成黑脸、频闪头发炸毛、闸门面无表情地给铁块“道歉”、容小满追着零讨材料费。
  suspense: 深层锈铁矿脉通向哪里？蠕虫的巢在深层还是别处？忆灵读仓时瞥见一段记录：锻造间的主人某一天“去守一扇门”，再没回来。
  hook: 锻造成功的当夜，中层深处传来沉闷的“咚、咚”声——像有什么巨大的东西，在王座方向一下一下地砸地。
  word_count: 4200
- chapter: 49
  title: 牢房记录与虫腹之路
  goal: 中层推进：解密中层记忆仓（旧世界牢房记录），确认锈王来历线索；清理蠕虫巢边缘；探明通往第三层的路线被甲虫封锁。
  map: 锈蚀地牢·中层·牢房区/蠕虫巢边缘
  characters: 零、容小满、闸门、频闪、团子、忆灵
  task_type: 支线·记忆仓解密；主线·探路
  conflict: 牢房区旧机关（牢门自锁）挡住去路，需忆灵解密；巢边缘幼虫群缠人；中层甲虫巡逻队开始集结（锈王已察觉侵入者）；忆灵读到一段“被关进最深处牢房的幽灵”记录，编号与她的记忆封存特征吻合——她当场失控，躲着所有人。
  monsters: 地牢幼虫群（Lv.33，小蠕虫）、锈蚀甲虫巡逻队（Lv.32）
  battle: 幼虫群战：密密麻麻的小蠕虫从锈洞钻出→频闪速射清场+零斩波斩扫尾→团子放电烫虫→忆灵强撑情绪读出旧世界管道图，喊出洞口分布规律→队伍逐洞封口。
  skills: 忆灵：读仓术+解密（开牢房区机关）；频闪：速射、频闪之眼；团子：放电
  equipment: 无（收集：旧钥匙×1、锈铁锭×8）
  rewards: 旧钥匙（中层牢房区通行）；锈铁锭；情报：中层→第三层通道被甲虫封锁，需绕行或硬闯；牢房区解密进度 1/3
  relationship: 忆灵读到“被囚幽灵”记录后反常地安静、发抖、躲着零；零笨拙地安慰（“怕什么，有哥在”），忆灵第一次主动拉住他的衣角；容小满察觉忆灵有心事，默默记在心里。
  reveal: 中层是旧世界囚牢主体（牢房编号+看守记录）；记录里多次出现“典狱长”——一位“与王座融为一体”的看守者；与忆灵编号吻合的记录最后一行写着：“已封存，永不开启。”
  satisfaction: 解密推进的抽丝剥茧感；忆灵情绪线的暗流（为 54 章身世揭示蓄力）。
  fun: 频闪蹲在锈洞边对着幼虫念悼词（“虫子也是命啊——看我不射死你们”）；团子吃幼虫吃得直打嗝。
  suspense: “典狱长”是谁？那条与忆灵编号吻合的记录里，到底封着什么？
  hook: 扎营过夜，忆灵独自溜去读最后一间牢房的仓——回来时整个人近乎透明，像是被什么吓空了：“那间牢房……今天有人住过。”
  word_count: 3600
- chapter: 50
  title: 锈潮
  goal: 锈潮（甲虫夜袭）生存战：忆灵为关锈潮闸门被蠕虫拖走；队伍获救却丢了她——救援线正式开启。
  map: 锈蚀地牢·中层·牢房区/锈潮闸道
  characters: 零、容小满、闸门、频闪、团子、忆灵
  task_type: 支线·救援（忆灵被掳）；生存战
  conflict: 锈潮夜袭——中层甲虫倾巢而出（锈王被惊动，清剿侵入者）；正面硬抗必死（数量碾压），逃生路线全被堵死；忆灵读仓发现旧世界防洪闸可关锈潮，但闸在潮心；她趁队伍被围独自冲向闸门——“别……别管我，你们快走！”——闸落、潮退、她被卷进蠕虫巢洞。
  monsters: 锈蚀甲虫潮（Lv.32，数百只）、地牢蠕虫（Lv.36，拖走忆灵的元凶）
  battle: 锈潮战：闸门嘲讽拉潮头+壁垒硬顶、容小满群体修复续命、频闪穿云箭点射精英甲虫、零闪步+斩波斩杀进潮里开路；忆灵关闸后潮水倒卷，队伍从闸缝爬出——回望时，她已被蠕虫拖进巢洞深处。
  skills: 容小满：群体修复、灵能护罩；闸门：嘲讽、壁垒；零：闪步、斩波斩；频闪：穿云箭；忆灵：读仓术（读防洪闸）
  equipment: 无（消耗：净化膏×3、回灵药剂×5）
  rewards: 锈潮战经验（逼近 Lv.34 门槛，未突破）；锈蚀甲虫灵核碎片×30；救援线索：蠕虫巢位置（忆灵被拖走前喊出“巢在牢房区正下方”）
  relationship: 忆灵“关键时刻可靠”第一次大展示——胆小到发抖的少女在潮心里反而最冷静；零第一次真正着急（“我还没答应带你找到记忆，你他妈别死”）；容小满红着眼眶给闸门包扎；队伍沉默地望向巢洞——救援不是选择题，是唯一选项。
  reveal: 锈潮是锈王的“清场机制”（地牢定期驱赶侵入者）；忆灵被拖向蠕虫巢（中层牢房区正下方）；锈王已经“醒”了。
  satisfaction: 忆灵关闸的高光（懦弱少女的一击）；队伍劫后余生的庆幸与自责交织。
  fun: 本章偏沉重，唯一笑点：团子被潮水冲成薄片贴在墙上，容小满把它揭下来吹气复原。
  suspense: 蠕虫巢里等着忆灵的是什么？锈王要缓存幽灵做什么？
  hook: 巢洞深处传来忆灵的一声尖叫，然后——安静了。安静得让人心里发毛。
  word_count: 4000
- chapter: 51
  title: 虫腹
  goal: 潜入蠕虫巢救援：破解巢穴迷宫与机关，找到被囚禁在记忆仓笼里的忆灵。
  map: 锈蚀地牢·中层·蠕虫巢（牢房区正下方的洞窟网络）
  characters: 零、容小满、闸门、频闪、团子、忆灵（被囚）
  task_type: 支线·救援（潜入/解救人质）
  conflict: 巢穴是蠕虫钻出的连环洞窟，方向感完全失效；幼虫群+巡逻蠕虫层层设防；时间压力：忆灵被吸进仓体，缓存幽灵离仓太久会消散——她正在“融化”；频闪侦察带错路翻车，被卷入虫堆，闸门救他（“我说了，跟紧我”）。
  monsters: 地牢幼虫群（Lv.33）、地牢蠕虫（Lv.36，巡逻个体×2）
