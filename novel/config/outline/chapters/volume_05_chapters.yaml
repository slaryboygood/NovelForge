# 卷五《远古门阵》（第 61-75 章）精细章纲
# Novel Reboot v2 全新推演（不参考旧版章纲）
# 每章 19 字段：chapter / title / goal / map / characters / task_type / conflict / monsters / battle / skills / equipment / rewards / relationship / reveal / satisfaction / fun / suspense / hook / word_count（3000-4500）
# 节奏锚点：61 卷四钩子承接（门阵开启前奏）→ 62 门阵开门开宝库（小爽点）→ 63 Lv.42→44 → 66 裂变剑→橙+技能书·雷弧风暴 → 68 门衍入队（中爽点·毒舌互怼）→ 70 门衍贵族秘密 → 72 隐藏宝箱·灵核宝石吞噬之眼（橙）→ 73-74 门卫巨像战（三阶段：权限封印团灭边缘→门衍完成门控者认证→合击杀·大爽点）→ 75 万芯残片其一现世+Lv.55+灵核秘密第一层收束（卷末爆点）
# 升级节点：63 Lv.42→44 / 68 Lv.46→48 / 74 Lv.52→54 / 75 Lv.55
# 卷末：残片指向高速大道方向（卷六铺垫）；Lv.55 满足跨区门槛

chapters:
  - chapter: 61
    title: 卷轴所指，石门森然
    goal: 承接卷四：队伍先撤出锈蚀地牢，在阻流关休整站完成三日治疗、补给、换甲与装备修复，再携隐藏任务卷·远古门阵沿灵能回路上行；击败门卫石兵前哨，抵达门阵外门，卷轴与锁眼共鸣。
    map: 锈蚀地牢出口→阻流关休整站→阻流关至远古门阵的灵能回路→远古门阵外门（外城废墟）
    characters: 零、容小满、闸门、频闪、团子、忆灵；NPC：铸鸣（随行工匠）、回路驿站的旅商（情报）
    task_type: 主线·门阵开启前奏（赶路+外门发现）
    conflict: 零转职并未治愈全队：他左臂、右掌、右腿与战甲均有伤，闸门重伤且新重甲未换好，容小满灵能近空，频闪右肩伤且无箭，团子空能，忆灵虚弱并持锈王灵核。必须先在阻流关休整站停留三日，明确治疗、回能、补箭、换甲与修复后才能上路；伤势只恢复到可战，不得无因满状态。此后卷轴只给方向不给路，回路又有旧世界塌方；绕行废墟时遭遇Lv.42门卫石兵六兵三角枪阵。
    monsters: 门卫石兵前哨小队（Lv.42×6，灰色石制兵俑，枪刺+结阵）
    battle: 前哨战：石兵结三角枪阵推进，零的斩波斩砍在石壳上崩出火星；雷弧斩蓄力劈开首具石兵的前胸石甲，露出构装材料“石兵阵芯”，它不是怪物灵核；频闪用新补短箭点射接缝，换好壁垒重甲的闸门拉住枪阵，恢复部分能量的团子放电卡关节；忆灵读界碑找出石兵同拍结阵、乱拍失阵的空隙，零闪步切入逐个击破。
    skills: 零：雷弧斩（转职后首次实战）、闪步；闸门：嘲讽、壁垒；频闪：速射、频闪之眼；忆灵：读仓术（读界碑）；团子：放电
    equipment: 裂变剑（紫，剑身半透明内蕴雷弧——卷四转职强化后首次登场）；雷弧战甲（紫）
    rewards: 休整站完成三日治疗与基础修复；通过公会探索委托预支和锈王战利品交易，取得短箭×30、灵能恢复剂×4、净化膏×5；石兵阵芯×6（构装材料，不是怪物灵核）；门阵守卫外扩和石兵节律情报；灵能回路图鉴解锁；【等级提升：Lv.40→Lv.41】
    relationship: 休整戏先让众人处理伤势与装备；铸鸣在地牢中层摊位与队伍重逢，因裂变剑旧世界纹路主动随行，工钱继续记账。团子只舔石兵阵芯表面余电，阵芯实体保留；铸鸣确认界碑纹路与裂变剑同源。
    reveal: 门卫石兵=门阵外扩的自动守卫（旧世界遗迹守卫机制）；灵能回路=阻流关与门阵之间的旧世界通路；界碑纹路与裂变剑同源（裂变剑来历暗线推进）。
    satisfaction: 新图开图新鲜感；雷弧斩首秀的“转职果然不同”爽感；石兵结阵被破的战术成就感。
    fun: 频闪被打脸的连环吐槽；团子啃石头崩牙；铸鸣三句不离工钱。
    suspense: 门阵里到底有什么？石兵只是前哨，深处的守卫是什么级别？界碑上的纹路为什么和剑一模一样？
    hook: 外门紧闭，卷轴共鸣亮起，锁眼里浮出一行旧世界文字——忆灵一个字一个字念出来：“持……令……者……入。”众人回头，看向零手里的裂变剑。
    word_count: 5000

  - chapter: 62
    title: 开门！宝库见
    goal: 破解外门：裂变剑剑柄纹路与锁眼吻合（剑即令）——外门开启；门厅首战石兵大队；开第一座宝库（开门开宝库·小爽点）；发现内层入口被封，需“门控权限”。
    map: 远古门阵·外门→门厅（外城宝库）
    characters: 零、容小满、闸门、频闪、团子、忆灵、铸鸣
    task_type: 主线·门阵开启（开门开宝库）；小爽点
    conflict: 卷轴插进锁眼只亮一半——还差“持令者”；零把裂变剑柄贴上锁眼，剑柄纹路与锁眼严丝合缝（剑=令，卷四保管者令牌伏笔回收）；门开瞬间门厅警报——石兵大队从墙龛苏醒（开门触发的守卫机制）；宝库有旧世界锁阵机关，暴力拆会自毁——忆灵读宝库门锁的旧记录：锁阵按节律转，须在“节律空拍”时拔锁栓。
    monsters: 门卫石兵（Lv.42，门厅苏醒大队×12）
    battle: 门厅战：石兵结方阵压来，闸门壁垒一人堵门，容小满回灵术稳住血线，频闪穿云箭点射接缝，零雷弧斩劈开阵线，团子放电卡关节；忆灵趁乱拔锁栓——宝库门轰然开启，石兵齐齐停住（守卫判定“入库者非入侵”，陷入宝库门的盲区）。
    skills: 零：雷弧斩、闪步；闸门：嘲讽、壁垒；频闪：穿云箭；忆灵：解密（拔锁栓）；团子：放电
    equipment: 【获得：蓝装·门卫护腕×2——零与闸门】；【获得：技能书残页·读仓深解】；灵核碎片×40（宝库实体碎片，入库后不得自行飘入身体）；旧世界货币饰件
    rewards: 小爽点达成：开门+宝库大丰收；地图：门厅图鉴；情报：宝库记录——“门阵三重，第一重石兵，第二重阵灵，第三重……守卫之名不可言”（名字被涂黑）；【等级提升：Lv.41→Lv.42】
    relationship: 开门瞬间全体嗨翻：频闪“开门！宝库！发财！”、容小满已经开始算这批灵核值多少钱、铸鸣捧着一件旧饰件手抖（“这、这是老货册上拍卖级的——工钱的事好说好说”）；零摸剑柄：“我是不是……在哪儿见过这把剑？”（身世暗线）。
    reveal: 裂变剑剑柄=外门钥匙（与保管者令牌同源纹路——剑即令）；门阵三重结构；宝库记录里“第三重守卫”名字被涂黑（巨像前兆）。
    satisfaction: 小爽点达成：开门那一刻的仪式感+宝库开箱的爆装备爽感。
    fun: 铸鸣对旧饰件当场估价三连；团子想把灵核碎片当糖豆，被容小满当场没收，碎片数量不得减少；频闪嚷着发财被提醒这是公账。
    suspense: 第三重守卫是什么？“门控权限”谁有？宝库深处的内门（与裂变剑同源纹路）为何打不开？
    hook: 内门门缝漏出光，卷轴再次共鸣——但锁眼不亮，门缝里反而浮现一枚印记：一扇门里套着一扇门。忆灵小声说：“这是……门控者的家徽。”（门衍线前奏）
    word_count: 3800

  - chapter: 63
    title: 石兵结阵，枪山压顶
    goal: 第一重门阵练兵：连续扫荡石兵结阵区，磨合新技能（雷弧斩实战化、门卫护腕试用）；阵灵首次现身（半透明符文人影隔空干扰）；战果：Lv.42→44。
    map: 远古门阵·第一重门阵（石兵结阵区/练兵场）
    characters: 零、容小满、闸门、频闪、团子、忆灵、铸鸣（扎营）
    task_type: 主线·探索+练级；怪物图鉴补全
    conflict: 石兵连续清剿后改变结阵，门阵深处的阵灵隔空封印频闪的穿云箭；团子只含住一枚石兵阵芯吸收表层余电，打嗝时喷出石屑，阵芯实体仍保留；容小满发现门阵回路让回灵术格外顺畅。
    monsters: 门卫石兵（Lv.42，结阵区两波×10）、阵灵（Lv.48，首次现身——隔空干扰，未正面交战）
    battle: 两场石兵战+阵灵干扰战：①三角阵战（正面硬劈打不动——忆灵读仓记录“龟甲阵怕侧翼，阵眼在左翼第三兵”→零闪步绕左翼+雷弧斩破阵眼，阵崩）；②龟甲阵+阵灵干扰战（频闪技能被封印→零雷弧斩挡符文、团子放电干扰投射、闸门硬顶、容小满净化术驱散封印余烬——发现净化术对封印有奇效）；阵灵见讨不到便宜，隐入深处。
    skills: 零：雷弧斩（实战化三连）、闪步；容小满：净化术（破封印首秀）、回灵术；闸门：嘲讽、壁垒；频闪：速射（被封印后换平射）；忆灵：读仓术（读石兵阵记录）；团子：放电
    equipment: 门卫护腕（蓝，零与闸门——节律抗性）
    rewards: 【等级提升：Lv.42→Lv.44】；石兵阵芯总库存增至26（CH061已有6，本章新获20；团子只吸表层余电，实体不减）；雷纹矿石×8；阵灵残响记录。
    relationship: 频闪被封印技能后跳脚（“凭什么封我的箭！”）；零吐槽“这门阵里的东西怎么一个比一个麻烦”；容小满血脉共鸣的嘀咕被零听见，零难得正经：“你家要是真跟旧世界有关系，那不叫怪，那叫来头。”（两个来历不明的人互看一眼）。
    reveal: 石兵会进化战术（结阵规则+1：阵眼）；阵灵=符文封印型守卫（封印技能，净化术可驱散——门控权限的残影）；门阵灵能回路与储能族血脉共鸣（容小满身世伏笔推进）。
    satisfaction: 双级升级（Lv.42→44）+破阵眼的战术爽；阵灵首次现身的神秘感。
    fun: 团子吞石兵芯打嗝喷石屑喷了频闪一脸；频闪被封印后拿弓当棍子抡（“老子没技能也是射手！”）。
    suspense: 阵灵为什么退走？它留下的半句旧语是什么？门阵深处到底守着什么？
    hook: 阵灵退走前留下的残响，忆灵逐字翻译——“门……不是锁……是……选择。”（这句话在门阵里，比人还老）
    word_count: 4000

  - chapter: 64
    title: 符文封印：打不出去的技能
    goal: 正面讨伐阵灵（Lv.48 精英）：破解符文封印机制，首杀阵灵；获得符文书页+紫装；确认“封印”是门阵守卫的核心能力（门控权限的雏形）。
    map: 远古门阵·第一重与第二重交界（符文回廊）
    characters: 零、容小满、闸门、频闪、团子、忆灵、铸鸣
    task_type: 主线·精英讨伐（阵灵首杀）
    conflict: 阵灵正面现身（Lv.48，比队伍高 4 级——越级压制）：符文投射群+封印术齐发——零的雷弧斩被封印放不出来、闸门被符文锁链捆住（嘲讽失效）、频闪被幻影分身围困；净化术只能驱散单点，封印源源不断；忆灵读符文书页残页发现规律：阵灵的符文按节律排列，节律走到“空拍”时封印有半息缺口——但节律是活的，阵灵会根据战斗改变节律。
    monsters: 阵灵（Lv.48 精英·符文人形）、门卫石兵（Lv.42，阵灵符文召唤的助阵×4）
    battle: 三幕：①被压制（零技能被封、闸门被捆、频闪被幻影围——队伍被打得四处躲）；②找规律（忆灵读残页+频闪之眼盯符文轨迹——发现空拍；团子放电打在空拍上，封印崩了一角；容小满净化术配合，队伍抓住空拍反击）；③阵灵变节律（阵灵察觉被读，节律骤变——零吃了个大亏被符文轰飞）；④破阵（零灵机一动：净化术与雷弧斩同拍打出——封印先被净化半息、雷弧斩趁隙劈中阵灵本体；阵灵崩散，留下一页金色符文书页）。
    skills: 零：雷弧斩、闪步；容小满：净化术（与雷弧斩配合的“净化同拍”战术）；忆灵：读仓术（读符文书页残页）；频闪：频闪之眼（盯符文轨迹）；闸门：壁垒（被捆后挣脱）；团子：放电
    equipment: 【获得：紫装·符文披风（防御+18，封印抗性+15%）——零】；【获得：符文书页（阵灵残页×3，可拼合成门阵内层地图）】
    rewards: 阵灵首杀（精英）；紫装·符文披风；符文书页×3；情报：阵灵=门控权限的“看守残影”（旧世界把门控者的封印能力做成了守卫）；【等级提升：Lv.44→Lv.45】
    relationship: “净化同拍”战术的成功让零难得夸容小满（“你这一手……挺行啊”——耳朵红了）；容小满记小本本“雷弧斩+净化术配合战术·专利费另算”；频闪被幻影吓得够呛（“那玩意儿长得像我！”）；忆灵读完残页拉住零的袖子：“第二重……叫记忆库。里面有人住过。”
    reveal: 阵灵=旧世界门控权限的残影守卫；封印术是门控者能力的源头（门衍线铺垫）；符文书页拼出内层地图——第二重门阵=记忆库。
    satisfaction: 精英首杀+紫装入手；“净化同拍”战术的配合爽。
    fun: 频闪被自己的幻影追着打（“你别过来！我跟你无冤无仇！”）；团子放电打在空拍上把自己弹了个跟头。
    suspense: 记忆库里“住过”的是谁？远处回路尽头扬起的尘土与议会旗号，是谁来了？
    hook: 远处，议会使团的车队出现在回路尽头——为首的长老闭着眼，他身边坐着一个银发少年，正百无聊赖地转着手里的令牌：“三叔，这破门阵有什么好看的。放我进去，我五分钟给你把宝库搬空。”（门衍登场前奏）
    word_count: 3800

  - chapter: 65
    title: 记忆库里的旧世界
    goal: 进入第二重门阵·记忆库；忆灵读记忆库主仓——门阵历史+旧世界保管者记录+记忆库残页（“万芯”二字首次以记录形式出现）；议会使团抵达，门衍首登场（毒舌贵族，与零第一次正面互怼）；权限之争首次爆发。
    map: 远古门阵·第二重门阵·记忆库（旧世界记忆仓群）
    characters: 零、容小满、闸门、频闪、团子、忆灵、铸鸣；NPC：门控议会长老·门衡、执事·门崇、叛逆公子·门衍（首登场）
    task_type: 主线·记忆库解密；阵营·门控议会（首次接触）
    conflict: 记忆库主仓被旧世界封存术锁封（比宝库锁阵更高级，忆灵读不动）；议会使团赶到，长老门衡声称记忆库是议会保管物（“门阵是门控议会的地界，闲人退下”）——队伍与议会对峙；门衍插嘴拆台（“三叔，他们连外门都开了，你说闲人？外门钥匙是人家剑柄——议会开了三十年没开开”）——毒舌首秀，同时点破零的底细（“银毛小子，Lv.40 出头，紫剑紫甲，靠一把旧断刃开门——捡垃圾的运气不错”）；零反呛（“大少爷，你转令牌转得我头晕，再转一下我就当你是在帮我们开门”）；执事门崇跳出来护主踩人（“哪来的野路子，也配跟门氏嫡公子说话”）——零当场一剑劈开一尊石兵，把石兵芯丢到门崇脚边（“议会的地界？这石头兵刚才还想咬我。你们议会管不管？”）。
    monsters: 门卫石兵（Lv.42，巡逻队×4——其中一尊被零当场劈开）
