    equipment: 【获得：记忆碎屑×7（材料，铸鸣鉴定：“这玩意儿能补记忆仓，也能喂武器”）】
    rewards: 废库档案·干线巨蜥篇（巨蜥=被反复投喂过量灵能的“养护队集体记忆”凝聚体——残党在放牧它）；废库档案·旧世界宠兽篇（记载一种“圆滚滚、吞电、鸣叫如铃”的宠兽——忆灵读完抬头看团子，团子打了个嗝）；情报：废库最深处有一口“封死的主仓”，全库档案都指向它——“漏掉的执念”（残页所在）
    relationship: 忆灵在废库的状态转变：从发抖到主动——她开始自己找仓读，不等人吩咐：“这里我熟。”；频闪失忆笑话三连（“我是谁？我在哪？我要射谁？”）；零逗团子：“听见没，鸣叫如铃——你那是鸣叫吗？那是打嗝。”
    reveal: 干线巨蜥=被“放牧”的集体记忆怪（残党喂大它的实锤，回扣 80 章“过载灵核”）；旧世界宠兽档案=团子原型的第一次纸面证据（吞电、鸣叫）；“漏掉的执念”主仓存在；忆灵与废库的联系逐渐浮出——她读过的档案，她全都眼熟。
    satisfaction: 解密推进的探索爽感；世界观第三层秘密开始松动（怪物=被腐化的旧住民记忆的实证）；团子原型伏笔回收第一步。
    fun: 频闪失忆后对着自己名字发呆；忆灵被蛀虫打断读仓的抓狂（胆小幽灵第一次发火：“我的记录！！”）；铸鸣对记忆碎屑两眼放光。
    suspense: “漏掉的执念”主仓里封着什么？忆灵为什么“都眼熟”？巨蜥被放牧的最终目的是什么？
    hook: 忆灵站在通往主仓的走廊口，指尖按上死锁的门，忽然整个人一震：“……钥匙。钥匙是——我自己。”
    word_count: 4200

