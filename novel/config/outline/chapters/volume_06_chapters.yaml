# 卷六《高速大道》（第 76-90 章）精细章纲
# Novel Reboot v2 全新推演（不参考任何旧版章纲）
# 每章 19 字段：chapter / title / goal / map / characters / task_type / conflict / monsters / battle / skills / equipment / rewards / relationship / reveal / satisfaction / fun / suspense / hook / word_count（3000-4500）
# 节奏锚点：76 进入高速大道 → 77 飙速追逐（小爽点）→ 78 Lv.57→60 → 80 团子吞电异变（伏笔）→ 81 铸鸣随行（8 人+宠满编）→ 82 干线巨蜥首现 → 83-86 记忆废库（忆灵身世线：读仓解密、万芯之主“漏掉的执念”残页——85 关键揭示）→ 84 万芯吞噬者觉醒前置+Lv.63→65+巨蜥首战 → 86 腐化教团与残党关系 → 87 干线巨蜥击杀（绊索战术+雷弧风暴，大爽点）Lv.67→69 → 88 裂变剑→红+残片其二 → 89 万芯吞噬者正式觉醒（隐藏职业，中爽点）→ 90 万芯残党执事夺走第二残片+Lv.70（全书第一次重要挫败，卷末爆点）
# 升级节点：78 Lv.57→60 / 84 Lv.63→65 / 87 Lv.67→69 / 90 Lv.70
# 地图：高速大道（配置名：总线高速大道，正文一律写“高速大道”）、记忆废库（第 83-86 章）
# 卷末状态：残片其二被执事夺走（残片 2/3 现世——其一在零手中、其二在反派手中）；第三枚指向故障深渊（卷七铺垫）

chapters:
  - chapter: 76
    title: 大道尽头有什么
    goal: 队伍携残片其一踏上高速大道（跨区干道开图）；熟悉大道规则（灵压、巡道站、飙行载具）；主道首遇劫道匪团设绊索劫商队并出手相救；残片其一在入口段发烫共鸣——第二枚残片就在大道深处。
    map: 高速大道·入口段（前哨巡道站→主道）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；NPC：巡道站守员、被劫商队、劫道匪团（首遇）
    task_type: 主线·开图（进入新地图）；支线·商队救援
    conflict: 大道深处灵压更强，Lv.55 刚够门槛，越往里越吃力；巡道站守员警告“大道中段被匪团包圆，最近还闹大虫”；刚上主道就撞见劫道匪团设绊索劫商队——救不救（对方人多势众）；残片其一在怀里发烫，方向指着大道深处，忆灵读不出具体位置，只读得出“很远”。
    monsters: 劫道匪团（Lv.58，弯刀劫匪小队×6，设绊索）
    battle: 商队救援战：匪团绊索绊翻货车、弯刀队围杀车夫；零闪步入场斩断绊索，闸门挡下弯刀雨，频闪点射放箭的匪，门衍一记位移门把货主挪出包围圈，忆灵读商队旧仓找出撤退路线；小胜逼退匪团，匪徒逃跑时撂话：“记住我们铁头疤的记号！”
    skills: 零：斩波斩、闪步；门衍：位移门；频闪：速射、频闪之眼；忆灵：读仓术
    equipment: 裂变剑（橙）；残片其一（贴身携带，发烫共鸣中）
    rewards: 大道地图·入口段图鉴解锁；商队谢礼（回灵药剂×10）；情报：大道规矩（灵压递增、巡道站分布、匪团活动区）；【等级提升：Lv.55→Lv.56】
    relationship: 上道整备戏：容小满列补给账单，闸门把盾擦得发亮，频闪吹“大道就是我们猎手的舞台”，门衍盯着大道尽头低声说“这条路……我小时候来过”（贵族秘密暗扣）；团子趴在车顶吹风被吹成薄片；忆灵缩在车厢里，脸色却罕见地平静——她认出了大道深处的某种气息。
    reveal: 高速大道=跨区干道（Lv.55 门槛，深处灵压更强）；残片其一能感应第二枚残片的存在（发烫共鸣=方向指引）；匪团是大道的“常态威胁”。
    satisfaction: 新地图开图的新鲜感+首战小胜+升级；“进入新篇章”的仪式感。
    fun: 团子被风吹成薄片；巡道站守员吹嘘“我年轻时也是冒险者”被频闪当场拆台；容小满追着商队算“救命钱”。
    suspense: 残片指向的大道深处——第二枚残片到底在哪？铁头疤的匪团会不会报复？
    hook: 深夜扎营，团子突然朝大道深处竖起耳朵，身上电丝噼啪乱跳；忆灵猛地睁眼：“有人……在大道深处喂了什么东西。它在长大。”
    word_count: 3600

  - chapter: 77
    title: 飙到冒火星
    goal: 飙速追逐战（小爽点）：匪团夜里报复，拆巡道车设路障并劫持下一班商队；队伍抢车反追，高速追逐+车顶混战；追回被劫货物，逼问出“有蒙面黑袍人出钱雇我们盯带碎片的人”；Lv.56→57。
    map: 高速大道·主道（入口段→中段前哨）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；NPC：铁头疤（匪首，幕后指使）、匪团飙车队
    task_type: 主线·追逐战（小爽点）；支线·商队救援
    conflict: 匪团白天吃了亏，夜里拆了巡道站的巡道车当路障，顺手劫持下一班商队报复；队伍只有一辆货车，飙不过匪团的轻快飙车队；频闪自吹车技一流，上车三分钟现原形；门衍的位移门耗灵能巨大，开一次歇半天；路中央还横着干线蠕兽的粪便堆（路况杀）。
    monsters: 劫道匪团·飙车队（Lv.58，轻车×4）；干线蠕兽幼体（Lv.60，路边偷袭）
    battle: 飙速追逐战：频闪驾车（灾难级，被容小满换下——她居然是个老司机）；零站车尾斩断匪团甩来的勾索，闸门用盾替货车挡流矢，忆灵读巡道站旧仓实时播报弯道与障碍，门衍掐准时机一记位移门把匪车挪到蠕兽粪堆上（匪车侧翻）；最后追上匪首轻车，零跳车一刀斩断车轴，匪团全数落网。
    skills: 零：闪步（跳车斩轴）、斩波斩；门衍：位移门（关键反杀）；频闪：穿云箭（车顶点射）；忆灵：读仓术（路况播报）；容小满：回灵术
    equipment: 无新增（缴获：匪团赃物袋×3、轻车一辆可改装）
    rewards: 追回被劫商货（商队双倍酬谢）；【等级提升：Lv.56→Lv.57】；情报：匪团供出“一个蒙面黑袍人出钱让我们盯'带发光碎片的路人'”（万芯残党执事·首闻其名）；缴获轻车（后续代步）
    relationship: 追逐战全员高光+笑料：容小满车技之王反差（“以前在储能商会送货，什么路没开过”）、闸门全程一声不吭但脸都白了（他不晕刀，晕车）、团子被甩到车顶迎风放电、零跳车后回头邀功被容小满泼冷水（“你差点把自己甩出去！”）。
    reveal: 有人（黑袍人）正在暗中寻找残片持有者——万芯残党已嗅到残片其一的气息；匪团与黑袍人是雇佣关系，不知其底细（“他给的钱够我们干十年”）；大道中段有蠕兽出没区。
    satisfaction: 小爽点达成：高速飙车+车顶混战+翻车反杀，节奏飞起。
    fun: 频闪车技被容小满骂哭（“你给我坐好！”）；团子被吹成“高速史莱姆”；门衍面无表情补刀：“他的车技，是门控议会教的吗？”（频闪破防）。
    suspense: 黑袍人是谁、在哪、离队伍多远？他盯上的“碎片”是残片其一还是其二？
    hook: 夜半，被绑的匪首铁头疤盯着零怀里的残片其一，忽然咧嘴笑了：“你们完蛋了。那位大人……已经在大道那头，等你们很久了。”
    word_count: 4000

  - chapter: 78
    title: 蠕兽潮
    goal: 干线蠕兽群过境（守点生存战+护送）：中段补给站救援战，护住商队与补给站；战后大额经验与任务奖励结算，零连升 Lv.57→60；发现蠕兽群是被“大道深处的什么东西”赶出来的。
    map: 高速大道·中段补给站（能量仓/记忆仓区）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；NPC：补给站站长、商队、干线蠕兽群
    task_type: 主线·讨伐（守点生存战）
    conflict: 蠕兽潮正面碾压补给站（扁平巨虫碾碎一切），正面硬抗必死；补给站记忆仓濒临报废、灵能储备见底；蠕兽皮厚喷酸，斩波斩打不动；更要命的是——蠕兽群是从大道深处被“赶”出来的，它们身后还有更大的东西在逼近（巨蜥踪迹初现，无人敢确认）。
    monsters: 干线蠕兽（Lv.64 精英，过境群×9+壮年个体×2）
    battle: 守点战三幕：①闸门+门衍卡住站门（壁垒+位移门封口），零临战观察发现蠕兽腹侧鳞缝是弱点，团子放电引它翻面；②容小满紧急修能量仓+群体修复续命，忆灵读补给站旧仓找到旧防空闸机关，频闪点射蠕兽眼睛；③闸门拉闸、虫群被堵在闸外，零带团子清尾，斩杀领头壮年蠕兽，虫群退散。
    skills: 零：雷弧斩（AOE 清尾）、静电束缚；容小满：群体修复、净化术；闸门：壁垒、嘲讽；忆灵：读仓术（防空闸）；团子：放电引翻
    equipment: 无新增（消耗大量药剂）
    rewards: 【等级提升：Lv.57→Lv.60】（越级击杀翻倍+守点任务奖励，三连跳）；干线鳞×14、蠕兽芯×3；补给站谢礼（能量仓补给×3）；情报：蠕兽群是被“更大的东西”驱赶的
    relationship: 战后全员瘫坐：频闪第一次服软（“刚才我数了一下……我们差点团灭”被闸门一个“嗯”顶回去）；容小满红着眼眶修好记忆仓（“这是补给站，不是坟场”）；忆灵小声说蠕兽群是被赶出来的；零蹲下来逗团子：“你说，大道那头，到底有什么大家伙？”团子把脑袋埋进黏液里（怂了）。
    reveal: 蠕兽群被动迁徙=大道深处出现更高级捕食者（干线巨蜥存在的首次间接证据）；补给站站长透露“最近站里总丢旧货，像有人翻过”（残党/教团踩点痕迹）。
    satisfaction: 三连升 Lv.57→60 的爆发爽感+守点战的团队协作感。
    fun: 团子被蠕兽酸液喷成一团冒烟果冻；频闪“我数了一下我们差点团灭”名场面；闸门一整天唯一台词：“……嗯。”
    suspense: 大道深处“更大的东西”是什么？补给站丢的“旧货”是谁翻的？
    hook: 夜里，补给站站长把零拉到一边，指着大道深处：“半个月前，我在那儿看见过一道会发光的长影子……二十米长。它一直沿着大道走，像是在找什么。”
    word_count: 4400

  - chapter: 79
    title: 铁头疤的买卖
    goal: 端掉劫道匪团营地（讨伐）：循线直捣匪营，生擒匪首铁头疤；铁头疤为保命供出“绊索猎兽法”与巨蜥情报、黑袍人雇佣真相；缴获赃物中有一枚“过载灵核”（储能商会被劫货）。
    map: 高速大道·匝道支路·匪团营地（废弃旧站）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；NPC：铁头疤（匪首）、匪团余党
    task_type: 支线·讨伐（匪团）；主线·情报
    conflict: 匪营设在山坳旧站，环形壕沟+绊索雷区（他们的看家本领）；铁头疤本人 Lv.62 悍匪，弯刀又狠又怪；营里还有一车贴着“储能商会”封条的货物（被劫物资，容小满认出自家商会印记，情绪波动）；硬攻会踩绊索，得先破掉他们的看家本领。
    monsters: 劫道匪团（Lv.58 主力×8）、铁头疤（匪首·精英 Lv.62）
    battle: 营地攻防战：忆灵读旧站图纸找出绊索布设图，零闪步清索点，团子放电点引爆索（炸了半圈壕沟），闸门顶着弯刀队推进，频闪点名放哨匪；正面单挑铁头疤：弯刀对裂变剑，疤哥刀路狠辣，零用卷四枪意“拦”字诀挡刀，雷弧斩破势，铁头疤被摁在地上。
    skills: 零：雷弧斩、闪步、静电束缚；忆灵：读仓术（图纸）；团子：放电引爆；闸门：嘲讽、壁垒
    equipment: 【获得：匪首弯刀·断牙（蓝，频闪副武器）】；【获得：过载灵核（剧情物·储能商会失物，通体裂纹、灵能外溢）】
    rewards: 匪团歼灭（大道治安任务完成，公会声望+）；赃物袋×5；【等级提升：Lv.60→Lv.61】；情报三件套：①铁头疤的“绊索猎兽法”（专绊大型路兽，含布设图）；②干线巨蜥情报（“二十米长，鳞会发光，正在往记忆废库那边挪窝”）；③黑袍人雇佣内幕（“他给了一页图纸让我们盯带碎片的人——图纸上画的就是那种碎片”=残党残片通缉图）
    relationship: 容小满盯着“储能商会”封条货红了眼眶（商会是她出身的地方，也是她离家出走的地方，她低声说“这车货……是我以前送的那条线”）；铁头疤被绑着还嘴硬，被闸门一瞪闭嘴；零把断牙弯刀抛给频闪（“你不是缺把帅的？”），频闪当场表演刀花，割了手。
    reveal: 万芯残党正在通缉“携带发光碎片的人”（执事已布下眼线）；干线巨蜥=大道深处的大家伙，正被某种力量引向记忆废库方向；“过载灵核”=被塞了过量灵能的仓芯（来路蹊跷，像有人故意做出来的）。
    satisfaction: 端匪窝的完整爽感（图纸破局+单挑擒王）；三连情报爆出，主线推进感强烈。
    fun: 频闪刀花割手还硬撑（“这叫试刀！”）；铁头疤被绑着还要嘴硬（“我这条命值钱！我认识人！”）；团子炸完索场打嗝冒烟。
    suspense: 那枚“过载灵核”是“有人故意做出来”的——给谁用的？巨蜥为什么被引向记忆废库？
    hook: 夜里，那枚过载灵核在货车上嗡嗡作响，裂纹里渗出细小的电花。团子蹲在它旁边，眼睛亮得像两颗小灯泡，口水滴答：“呜……”——容小满喊：“团子！那不能吃！”
    word_count: 4000

  - chapter: 80
    title: 团子吞了颗雷
    goal: 团子异变（伏笔章）：趁夜偷吞过载灵核，体型暴涨+放电鸣叫；队伍慌乱中确认这是进化休眠；异变后团子解锁新形态（体型变大、会放电鸣叫），零立誓看紧它；残片其一在异变当夜剧烈共鸣——第二枚残片就在前方废库方向。
    map: 高速大道·中段补给站（夜营）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子（异变）
    task_type: 支线·宠物事件（异变）；主线·线索
    conflict: 团子偷吞过载灵核（防不胜防），随即剧变：体型撑到半人高、电丝噼啪乱炸、发出从未有过的尖利“放电鸣叫”；容小满的净化术压不住，忆灵的读仓术读到“它的灵核在重新长”；频闪吓得要射它，零第一次对团子吼“吐出来！”；更糟的是异变动静太大，像在给什么东西打信号。
    monsters: 干线蠕兽哨兵×2（被异变动静引来，团子一记大放电全灭——异变战力初显）
    battle: 小规模清场：两只被异变动静引来的干线蠕兽哨兵，团子一记大放电全灭（异变后第一次出手，威力与体型一起暴涨）；零补刀收尾。
    skills: 团子（异变后）：大放电（范围麻痹）、放电鸣叫（警告/信号音）；零：雷弧斩；容小满：净化术（压制异变余波）
    equipment: 无（团子异变后体型+1 档，行动略笨重）
