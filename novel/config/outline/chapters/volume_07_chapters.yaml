# 卷七《故障深渊》（第 91-105 章）精细章纲
# Novel Reboot v2 全新推演（不参考旧版章纲）
# 每章 19 字段：chapter / title / goal / map / characters / task_type / conflict / monsters / battle / skills / equipment / rewards / relationship / reveal / satisfaction / fun / suspense / hook / word_count（3000-4500）
# 节奏锚点：91 进入故障深渊（禁区灵压）→ 92 腐化骑士清场小爽点 → 93 Lv.72→75 → 97 团子吞掉腐化核心未失控（团子真相伏笔）→ 98 Lv.78→80 → 99 深渊幻境揭示空白灵核一半真相（故障之主首现）→ 100 容小满净化储能师觉醒（中爽点）→ 101 零吞噬过量失控（一剑劈向容小满→队友以命相护）→ 102 容小满净化术+零灵核净化觉醒（救赎爆点）→ 103 万芯残党 Boss（万芯之鳞红装）Lv.84→86 → 104 净化圣水配方 → 105 故障之主三阶段 Boss 战+第三残片+Lv.88→90（卷末爆点）
# 升级节点：93 Lv.72→75 / 98 Lv.78→80 / 103 Lv.84→86 / 105 Lv.88→90；卷末三残片集齐，万芯之巅开启（卷八铺垫）
# 世界红线：禁止工程术语（一律用灵能/记忆仓/灵核/部件/节律/腐化/灵压等世界化词汇）；人形拟人化；【】提示短促；角色语言差异化

chapters:
  - chapter: 91
    title: 深渊的呼吸
    goal: 队伍沿残片共鸣抵达故障深渊入口；门衍以权限令开禁区闸门；进入深渊第一层，亲历禁区灵压（低于 Lv.70 者属性减半）；入口遭遇故障傀儡哨兵，确立“部件坟场+抽搐傀儡”的深渊规则；深渊首次探索奖励。
    map: 故障深渊·禁区入口（深渊闸门→第一层·部件坟场边缘）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子、铸鸣；NPC：守闸老兵（冒险者公会）
    task_type: 主线·进入禁区（开图）；探索
    conflict: 深渊闸门需要权限令+满编登记（公会警告“上一支队伍进去，只回来一个疯的”）；灵压骤然压下——忆灵和铸鸣当场脸白（两人 Lv.70 以下被压制），团子被压扁成一张皮；入口的故障傀儡动作卡顿却暴烈，乱舞攻击无规律可循，斩波斩砍在旧部件上“叮”地弹开；更糟的是——深渊里的记忆仓全灭，补给线断了，退路只有一条。
    monsters: 故障傀儡（Lv.72，入口哨兵×4）、深渊锈鼠群（伏击小怪）
    battle: 入口战：傀儡乱舞无规律，频闪速射被卡顿闪避弹开；闸门嘲讽拉住、容小满回灵术续血；零观察出“卡顿=节律错拍”的规律——在傀儡“僵住”的半拍里闪步绕后，从关节缝切入，雷弧斩劈散第一只；门衍用权限令封住第二只的重组（部件想拼回去），铸鸣抄起扳钳当场拆件——“材料别浪费！”；团子压扁后弹起来，一口吞掉傀儡芯打嗝冒烟（异变小伏笔）。
    skills: 零：斩波斩、闪步、雷弧斩；闸门：嘲讽、壁垒；频闪：速射、频闪之眼；容小满：回灵术；门衍：权限令·封禁；团子：吞芯
    equipment: 雷弧战甲（紫）、裂变剑（红·万芯残片余韵）；无新增
    rewards: 【等级提升：Lv.70 → Lv.71】；深渊铁×6；第一层图鉴解锁（故障傀儡）；情报：禁区灵压规则（低阶压制）、深渊记忆仓全灭、退路已断
    relationship: 灵压下的患难：铸鸣嘴硬“老子做了一辈子买卖，第一次被人压着打”；忆灵抖着缩在零身后（“好、好冷……这地方在吃记忆”——她感应到深渊在啃食记忆仓的残留）；容小满给被压扁的团子吹气复原，零嘴硬“怕啥，有哥在”，转头自己也被灵压压得一趔趄，全队笑不出来地笑了。
    reveal: 故障深渊=旧世界“废弃件坟场”（堆积无数被丢弃的旧部件与记忆残渣，腐化最浓）；禁区灵压规则；深渊深处有什么在“重组”（守闸老兵酒后真话：“闸门最深处，有东西每天夜里在拼自己。拼了十年。”）
    satisfaction: 开新图的新鲜感+禁区压迫感；傀儡“节律错拍”的破敌小技巧爽点；门衍权限令首次在禁区显威。
    fun: 团子被压成皮、被拆件、吞芯打嗝冒烟；铸鸣边拆件边报价（“深渊铁，黑市价，一斤三十灵币——先记账！”）；频闪被傀儡卡顿闪避弹开箭时的大叫：“它有毛病吧！它卡着躲我！”
    suspense: 深渊最深处“每天夜里拼自己”的东西是什么？入口的旧冒险队只回来一个疯子——他疯前说了什么？
    hook: 深夜扎营，第一层的死寂记忆仓方向传来极轻的“咔、咔”声——像部件在拼装。零握紧裂变剑，剑身上的残片纹路正轻轻发烫，指向深渊最深处。
    word_count: 3800

  - chapter: 92
    title: 骑士甲碎
    goal: 第一层→第二层推进；遭遇腐化骑士清剿队，满编配合打一场漂亮的清场战（小爽点）；确认腐化骑士=被腐化的旧守卫记忆；零克制吞噬欲望（回应卷四誓言）。
    map: 故障深渊·第一层至第二层通道（部件坟场→断层裂隙）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子、铸鸣
    task_type: 主线·推进（清场战）
    conflict: 腐化骑士（Lv.78 精英）清剿队堵住断层口——黑甲骑士暗紫纹路，冲锋+腐化斩，旧部件被它们“指挥”着飞起来当盾牌；零满脑子“吞了它们”——腐化骑士的灵核里有旧守卫的记忆残片，吞了能学冲锋；但卷四立过誓（不到万不得已不吞灵核），容小满盯着他：“你想都别想。”；频闪贪功冒进被骑士冲锋顶飞；团子被部件盾牌砸得咕噜咕噜滚。
    monsters: 腐化骑士（Lv.78，精英，清剿小队×5）、故障傀儡（Lv.72，被骑士“指挥”的杂兵×8）
    battle: 清场战（小爽点）：闸门嘲讽拉散骑士阵型、壁垒硬顶腐化斩（甲上划出火花）；频闪穿云箭点射骑士甲缝（学乖了，不打正面打关节）；门衍权限令封住“部件盾牌”，骑士失去指挥物；零闪步切后排、雷弧风暴把杂兵傀儡连片劈碎；团子放电麻痹冲来的骑士；容小满净化术驱散骑士的腐化斩余波（对“腐化”出奇有效——她自己也愣住，血脉异常第三显）；零最后一剑斩碎队长骑士的黑甲——【击杀：腐化骑士队长】。
    skills: 零：雷弧风暴、闪步、静电束缚；闸门：嘲讽、壁垒；频闪：穿云箭；容小满：净化术（对腐化异常有效）；门衍：权限令·封禁；团子：放电麻痹
    equipment: 无新增（战利品：骑士黑甲残片×6、腐化芯×5）
    rewards: 【等级提升：Lv.71 → Lv.72】；腐化芯×5（深渊锻造材料）；情报：腐化骑士=旧世界守卫的记忆残渣（铠甲下是空的，只有记忆在撑）；净化术对腐化克制确认（容小满血脉线+1）
    relationship: 清场后的队伍默契（一个眼神一句话）；容小满盯零：“刚才想吞？”零别过头：“……没。”忆灵补刀：“你刚才口水都要流出来了。”零耳朵红透；闸门把裂开的盾边敲正，沉默地站回队首（“……走。”）；频闪揉着被顶飞的腰嘴硬：“我刚才那是失误！”
    reveal: 腐化骑士=被腐化信号啃剩的旧守卫记忆（铠甲是空壳，记忆在驱动）；深渊的腐化=记忆被啃食后的疯狂（与锈王同源，程度更深）；“部件被指挥”=深渊能“指挥”死物（故障之主的领域雏形——它已开始接管深渊）
    satisfaction: 小爽点：满编配合的教科书清场战（坦克拉、输出切、辅助净化、控场补刀）；“打关节不打正面”的聪明打法。
    fun: 团子被部件盾牌砸得咕噜滚进零怀里（零：“你是史莱姆还是球？”）；铸鸣蹲在骑士残甲边估价（“黑甲，旧世界手艺！拆了卖能回本！”）；频闪的“失误论”被全员无视。
    suspense: 谁在“指挥”这些部件？深渊最深处那个“每天夜里拼自己”的东西——和骑士们有关系吗？
    hook: 断层裂隙深处，一队黑影整齐划一地“咔、咔、咔”转着同样的角度——它们不是巡逻，是在朝同一个方向行军。那个方向，隐约传来布道声：“……腐化不是病，是进化。”
    word_count: 3600

  - chapter: 93
    title: 腐潮
    goal: 第二层·教团祭坛区遭遇战：腐化骑士大队+故障傀儡潮；队伍首次正面击溃腐化潮并缴获教团祭器；零连升三级 Lv.72→75（升级节点一）。
    map: 故障深渊·第二层·断层祭坛区
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子、铸鸣
    task_type: 主线·升级节点（大规模遭遇战）
    conflict: 第二层被教团改造成祭坛区——腐化骑士被“编队”成军，故障傀儡潮一波接一波；潮水里有教团的祭器（会喷腐化雾的旧香炉），雾里灵能外泄、技能失灵；队伍被分割成两半（零+闸门+团子被潮头卷进祭坛，容小满+忆灵+门衍+频闪+铸鸣被困雾区）；零看着腐化潮心动又想吞——容小满在雾里喊：“零！你敢吞我今晚断你粮！”（全队哄笑，但零真的忍住了——用剑，用脑子）。
    monsters: 腐化骑士大队（Lv.78，精英×8）、故障傀儡潮（Lv.72，数十只）、教团祭器·腐香炉（机关型）
    battle: 分割战：雾区被困组——容小满净化术开雾（她发现净化术能烧穿腐化雾）、忆灵读仓找祭坛结构图、门衍权限令封香炉、频闪点射漏网傀儡、铸鸣拆香炉（“这玩意儿值钱！”）；祭坛组——闸门嘲讽拉潮头+壁垒硬顶、团子放电开路、零雷弧风暴+静电束缚清潮，最终闪步绕后斩断教团祭坛的“引潮柱”，腐潮溃散；【击杀：腐化骑士队长×2】。
    skills: 零：雷弧风暴、静电束缚、闪步；容小满：净化术（烧穿腐化雾）；忆灵：读仓术（祭坛结构图）；门衍：权限令·封禁；闸门：嘲讽、壁垒；团子：放电
    equipment: 无新增（战利品：祭器残件、骑士黑甲×10）
    rewards: 【等级提升：Lv.72 → Lv.75】（腐潮大捷+祭坛破解）；深渊铁×20、腐化芯×12；情报：教团在深渊建了三级祭坛（第二层只是外围），“引潮柱”只是诱饵——真正的祭坛在更深处；腐香炉=教团“布道”用的法器
    relationship: 容小满“断粮威胁”全场最佳（零当场举手投降：“我、我不吞了！”）；忆灵读仓时瞥见祭坛记录——教团在“喂养”深渊深处的东西（她脸色发白，一个字一个字念出来）；门衍望着教团祭器皱眉：“这做工……不是教团的手艺。是旧世界的。他们在用旧世界的东西，干旧世界的事。”（门控者家族的旧世界秘闻伏笔）
    reveal: 教团三级祭坛结构（外层引潮/中层布道/内层献祭）；教团“喂养”深渊深处之物（故障之主雏形情报）；引潮柱只是诱饵（教团故意让冒险者以为破了祭坛——它在等队伍深入）
    satisfaction: 升级节点大爽（连升三级）；分割战合流的“队伍两开花”配合爽感；容小满净化术烧穿腐化雾的救场高光。
    fun: “你敢吞我今晚断你粮”名场面；铸鸣拆香炉拆出三斤旧世界铜料（“发了发了——记账！”）；团子吞了只傀儡芯又打嗝冒烟，这次冒的烟是紫色的（异变+2）。
    suspense: 教团在喂养什么？“内层献祭”祭的又是什么？——为什么祭坛记录里，被献祭者的画像，画的是个“灵核空白”的人形？
    hook: 深夜，容小满给零换药时忽然停手——零的右臂灵核纹，在腐潮后悄悄爬长了一寸。“……你老实说，刚才打潮的时候，你到底有没有想吞？”零没答，盯着纹路看了很久：“……它在长大。每一次离深渊更近，它就长得更快。”
    word_count: 4200

  - chapter: 94
    title: 他们说，腐化是进化
    goal: 教团正面登场：祭司布道+劝降+腐化术战；队伍拒绝教团“进化”说，祭司败退至内层；容小满血脉异常再次显影（净化术对祭司腐化术的压制）。
    map: 故障深渊·第二层·教团布道场
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子、铸鸣；NPC：腐化教团·祭司「染罪」、教团护卫
    task_type: 主线·阵营对抗（腐化教团正面登场）
    conflict: 布道场对峙：祭司「染罪」一身暗紫法袍，笑容和蔼地“布道”——“诸位一路杀来，可曾想过，为何越靠近深渊，你们的灵核越饿？因为进化在呼唤你们”；他点出零的吞噬能力（“万芯吞噬者……多完美的容器”），当场劝降：加入教团，让腐化完成进化；队伍集体拒绝（连最贪财的铸鸣都骂了句“放屁”）；祭司翻脸，腐化术+傀儡潮压来——他的腐化术能“感染”人的灵核（零的灵核纹一阵灼痛，容小满的净化术却被祭司的腐化术激发得烫手）。
    monsters: 教团祭司·染罪（精英人形，Lv.80）、教团护卫（腐化骑士改装版×4）、故障傀儡（Lv.72，召唤）
    battle: 教团战：祭司腐化术三连（腐化雾/感染咒/傀儡召唤），容小满净化术硬顶——她的净化术竟把祭司的腐化术“压”了回去（祭司第一次色变：“储能族？你身上……”）；闸门壁垒+反震把护卫骑士弹飞；频闪穿云箭点祭司法袍破绽；零闪步近身，雷弧斩劈向祭司——祭司架起腐化盾，被零“灵核净化”的雏形（零下意识催动 Lv.70 隐藏技能，只催动出一丝白光）烧穿一角；祭司惊退：“灵核净化……不可能，那是主才能用的……”狼狈退向内层。
    skills: 零：雷弧斩、闪步（+灵核净化雏形一丝白光）；容小满：净化术（压制腐化术）；闸门：壁垒、反震；频闪：穿云箭；忆灵：读仓术（读布道场记录：教团教义来源）
    equipment: 无新增（缴获：教团经卷×1、腐香炉残件）
    rewards: 【等级提升：Lv.75 → Lv.76】；教团经卷（情报：教团教义=“腐化是进化的阶梯”——旧世界“遗弃理论”的变种）；情报：祭司认识“万芯吞噬者”与“灵核净化”（教团与万芯之主的渊源暗线）
    relationship: 全队同仇敌忾的高光：零嘴硬“老子就算是废灵，也是自己说了算的废灵，轮不到你替我进化”；容小满攥紧净化术的光，第一次眼神发狠：“你说腐化是进化？那我把你的'进化'，洗回原样。”；闸门站在最前，只说了四个字：“挡在我身后。”（卷三回响）；忆灵读完经卷抖着声音：“这书里说……万芯之主崩解的时候，把'选择'漏掉了。教团想替主，把'选择'捡回来……或者说，消灭它。”
    reveal: 教团教义=旧世界“遗弃理论”变种（腐化=进化）；教团知道万芯吞噬者与灵核净化（渊源）；万芯之主崩解时“漏掉了选择”（忆灵读到的经卷——空白灵核真相的又一块拼图）；祭司对容小满的异常反应（储能族血脉+1）
    satisfaction: 阵营对立正面展开的爽快感；容小满“把进化洗回原样”的名场面；灵核净化雏形首现（白光一闪）。
