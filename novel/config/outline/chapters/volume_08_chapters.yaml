# 卷八《万芯之巅》（第 106-120 章）精细章纲
# Novel Reboot v2 全新推演（不参考旧版章纲）
# 每章 19 字段：chapter / title / goal / map / characters / task_type / conflict / monsters / battle / skills / equipment / rewards / relationship / reveal / satisfaction / fun / suspense / hook / word_count（3000-4500）
# 节奏锚点：106 登顶之路 → 107 记忆幻境打脸小爽点（万芯之巅旧记忆幻境考验）→ 108 Lv.91→93+万芯之鳞实装 → 110 团子真相揭示（旧世界宠物原型）→ 112 万芯残党首领战（中爽点）+Lv.95 → 113 万芯之主首次出现（王座大厅阴影）→ 116 万芯之主初战全灭级失败（万芯领域压制）+Lv.97→98 → 118 万芯裂变铸成（红·神话，吞噬三残片）+灵核认主机制揭示 → 119 最终决战（四阶段：记忆洪流/腐化侵蚀/万芯领域/认主时刻）+Lv.100 → 120 零的选择（继承/解放/封印→解放）+世界事件·记忆解放+开放式收尾（卷末终极爆点）
# 升级节点：108 Lv.91→93 / 111 Lv.93→94 / 112 Lv.94→95 / 114 Lv.95→96 / 115 Lv.96→97 / 116 Lv.97→98 / 118 Lv.98→99 / 119 Lv.99→100

chapters:
  - chapter: 106
    title: 万仓为阶
    goal: 三残片合钥开启万芯之巅入口；登阶第一段首遇记忆卫兵，确立"记忆投射"规则；山脚营地整备（铸鸣补给出场）；团子吞记忆银异样（预埋）。
    map: 万芯之巅·山脚→万仓长阶·第一段
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；NPC：铸鸣（山脚营地）、万芯残党旗帜残迹
    task_type: 主线·终局地图开启（登顶之路）
    conflict: 三残片合钥需同时共鸣（容小满灵能注入+门衍权限共振+零以空白灵核做引——残片认"记得一切的人"，却对零的空白迟疑）；入口灵压（全队属性被压，咬牙登阶）；长阶首遇记忆卫兵（Lv.92 精英）：记忆投射打中人会闪回陌生人一生——频闪被命中当场愣住，战斗节奏被打乱；铸鸣的山脚报价贵到离谱。
    monsters: 记忆卫兵（Lv.92 精英·哨兵×3）
    battle: 首遇战：卫兵阵列攻击+记忆投射——频闪被投射命中看见别人的婚礼愣神，闸门嘲讽拉仇恨却被投射影响（看见族规典礼），容小满回灵+净化压惊，零闪步绕后斩卫兵外壳接缝（银白外壳接缝=弱点），团子放电麻痹，门衍权限令封住一只；小胜但人人出了一身冷汗——记忆投射比灵压更可怕。
    skills: 零：闪步、斩波斩、雷弧斩；闸门：嘲讽、壁垒；频闪：速射；容小满：回灵术、净化术；门衍：权限令；团子：放电
    equipment: 裂变剑（红）、万芯之鳞（红·未实装——入巅后微微发烫）、雷弧战甲（紫，待换）
    rewards: 探索奖励（万芯之巅图鉴开启）；记忆银×6；灵核碎片×12；情报：记忆卫兵怕外壳接缝、记忆投射可被净化术驱散；铸鸣免息"人情账"
    relationship: 队伍登顶前的热闹：容小满与铸鸣砍价（人情账要利息），频闪吹牛"这山也就这样"被记忆投射教做人（脸色发白还嘴硬），闸门默默把频闪挡在身后，忆灵缩在队伍中间发抖（"这、这里的仓……全都在说话"——她听见万芯之巅的记忆仓在低语，预埋她与崩解纪的关系），门衍盯着入口纹章沉默（家徽与纹章同源——预埋看门人血脉），团子偷吃记忆银眼睛发亮。
    reveal: 万芯之巅=万芯之主崩解后遗留的主脑残躯化作的记忆之山（万仓为阶）；入口铭文"记得一切的王，等一个忘记的人"；三残片认零的空白灵核时短暂发亮（残片在"找他"——预埋空白灵核真相）
    satisfaction: 终局地图开启的大场面+首遇战小胜（发现接缝弱点）；图鉴解锁的新鲜感
    fun: 铸鸣的山脚报价单（连"登顶保险费"都算出来了）；频闪被记忆投射打中后愣了半天才回神（"我、我刚才参加了一场别人的婚礼？！"）；团子偷吃记忆银被零弹脑门
    suspense: 谁在长阶尽头放行？入口铭文里的"忘记的人"是谁？忆灵为什么说"仓全都在说话"？
    hook: 首战结束，队伍正要继续登阶——一名记忆卫兵没有攻击，反而侧身，向他们深深鞠了一躬，让出了路。像在等什么人上去。
    word_count: 3600

  - chapter: 107
    title: 人人都记得我
    goal: 长阶幻境门廊的旧记忆幻境考验；全队陷入各自幻境，逐一靠"选择"破幻；零打脸幻境守卫（小爽点）；幻境深处的众声首次发声（预埋万芯之主）。
    map: 万芯之巅·长阶幻境门廊（旧记忆幻境）
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；幻境守卫（记忆卫兵·幻境主持）
    task_type: 主线·幻境试炼（万芯之巅登顶考验）
    conflict: 幻境门廊把登顶者拉进"最想回到的记忆"——全队被逐个吞没；零的幻境最诡异：废渣镇全员围着他笑，没人再叫他废灵——但他找不到破绽，直到发现幻境里的容小满给他治伤不收钱（真容小满必收钱——破绽）；幻境守卫嘲讽"你没有记忆，你是废物，连幻境都装不下你"；队友幻境：容小满差一点留在"不用算账的家"，忆灵差一点溺死在"找到的记忆"里（预埋）。
    monsters: 记忆卫兵·幻境主持（Lv.93 精英·幻境化形）
    battle: 幻境战：零看穿破绽（幻境只能拼别人的记忆，改不掉他亲眼见过的细节）→反手吞噬幻境（空白灵核吞记忆碎片，幻境崩塌）→一剑斩碎幻境守卫化形（打脸：守卫的"你没有记忆"被反杀"我连记忆都没有，你拿什么考我"）；队友破幻（容小满自己走出"不收费的家"，闸门走出的理由是"我的家不在这儿"，频闪笑醒"台下没人骂我，假"，门衍破门而出"门不是锁，是选择"，忆灵被队友齐声喊醒，哭着出来）；团子把幻境残余全吸了（肚子鼓鼓，预埋）。
    skills: 零：吞噬（吞幻境记忆）、斩波斩；容小满：净化术（净化幻境残留）；门衍：开门（破幻境之门）；团子：吸收
    equipment: 无新增（零获得技能残影·记忆盾：短暂格挡记忆类攻击）
    rewards: 情报：幻境=万芯之主"记忆统一"世界的缩影（没有遗忘=没有破绽=也没有人会说"不"）；零获得技能残影·记忆盾；队友全员破幻（韧性成长）
    relationship: 破幻即人物弧光：容小满的"不收钱的家不是我家"（她的记忆观=算得清清楚楚才安心），闸门一句"我的家不在这儿"（守护对象已从族地变成队伍），频闪自嘲（他以为自己要万人喝彩，结果发现他要的是有人骂他），门衍主动破门（第一次主动选择队伍而非家族），忆灵哭着拉住容小满的衣角（她被封的记忆在幻境里闪了一下——预埋117），团子吸饱幻境后打嗝冒金光。
    reveal: 幻境门廊的真相：登顶者会在"被记住的世界"与"自己的记忆"之间做选择——万芯之主的考验=它想知道"人为什么不肯被统一"；零的空白灵核在幻境中免疫（幻境造不出他的记忆，只能拼别人的——第一次正式展示空白的护身属性）
    satisfaction: 小爽点：幻境"人人都记得你"的温柔陷阱被一个废灵当众拆穿+反吞；队友各自破幻的弧光时刻
    fun: 频闪的幻境全场喝彩他反而不爽（"骂我啊！怎么不骂！"）；幻境里的闸门话太多把零吓醒（"闸门不可能说这么多话，这必是假的"）；团子吸饱幻境打嗝喷出一串记忆画面（都是些陌生人的旧事）
    suspense: 幻境深处的众声是谁？它说"你是我漏掉的那一块"——零的空白到底是什么？忆灵在幻境里看见的"被封的记忆"是什么？
    hook: 幻境崩塌的废墟里，一道众声叠合的话音响起，像千万人同时开口："你是我漏掉的那一块——上来，让我看看你。"全队汗毛倒竖——长阶尽头，那扇门缝里的光，亮了。
    word_count: 3800

  - chapter: 108
    title: 红鳞覆身
    goal: 长阶中段记忆灯塔守卫战；零借灯塔灵能洪流与万芯之巅共鸣，万芯之鳞正式实装（红甲生效）；战中升级 Lv.91→93；立刻用新力量打脸记忆卫兵长。
    map: 万芯之巅·长阶中段·记忆灯塔
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子
    task_type: 主线·清剿+装备实装
    conflict: 记忆灯塔是登阶补给点却被卫兵军阵占据（卫兵靠灯塔汲取记忆之力无限增援）；零的万芯之鳞实装条件苛刻：需在灯塔灵能洪流中共鸣（洪流冲刷=灵核受损风险——卷七灵核完整度本就有伤）；容小满坚持要在场（她怕零又莽）；卫兵长（Lv.94 精英）指挥军阵围杀，记忆投射如雨。
    monsters: 记忆卫兵军阵（Lv.92 精英×8）、记忆卫兵长（Lv.94 精英）
    battle: 攻灯塔战：闸门壁垒堵口，频闪点射卫兵接缝，忆灵读仓找出灯塔控制位（关掉增援），门衍权限封门断援，团子放电清近身；零在容小满的净化护持下冲进洪流——灵核剧痛（旧伤复发）——他咬牙把万芯之鳞贴向心脏——共鸣完成：【万芯之鳞实装：全属性+80，腐化抗性+50%】——鳞甲覆身（红甲替代紫甲）——零冲出来一记雷弧斩，记忆盾硬接卫兵长的记忆投射，反手斩碎卫兵长（实装后立刻证明：投射打在鳞上弹开）。
    skills: 零：雷弧斩、雷弧风暴、记忆盾（残影）、闪步；容小满：净化术、灵能护罩；闸门：壁垒；频闪：穿云箭；忆灵：读仓术；门衍：权限令；团子：放电
    equipment: 【万芯之鳞实装（红·护甲）：全属性+80，腐化抗性+50%】（替代雷弧战甲）；裂变剑（红）
    rewards: 【等级提升：Lv.91→Lv.93】（卫兵军阵越级击杀+灯塔共鸣回流）；记忆银×24；紫装·记忆之盔（频闪）；灯塔补给点开启（记忆仓/能量仓归队伍使用）
    relationship: 实装戏的队友反应：容小满边骂边给他灌净化（"你再莽一次试试"），闸门默默点头（鳞甲比紫甲厚——他放心了），频闪酸"红甲了不起啊"转头去摸记忆之盔，忆灵读仓时手抖（灯塔的仓里存着旧世界登顶者的记忆——全是失败者——预埋），门衍看着灯塔纹章愣住（与家徽同源——他偷偷用权限比对），团子绕着鳞甲转圈，蹭了一身光。
    reveal: 万芯之鳞=旧世界万芯之主的守护鳞甲遗物（需在万芯之巅共鸣才能生效）；记忆灯塔=旧世界登顶者的试炼记录仓（所有登顶失败者的记忆都在这里——没有一个人成功过）；零的灵核旧伤在共鸣后愈合大半（鳞甲护住了他的灵核完整度）
    satisfaction: 红甲实装+双级升级（本卷第一个升级爽点）；实装后立刻硬刚卫兵长、投射弹开的打脸感
    fun: 频闪戴上记忆之盔发现能看到"别人的记忆"后开始偷看闸门的记忆（被闸门瞪回去）；团子蹭鳞甲蹭出一身光，走路像一颗夜明珠；容小满在灯塔里发现了旧世界的"账本"（登顶者的补给记录——她两眼放光）
    suspense: 灯塔仓里所有登顶者的记忆——他们是怎么失败的？万芯之主从没让任何人登顶成功过，为什么独独放行这支队伍？
    hook: 队伍补给的深夜，忆灵颤抖着从灯塔最深一座仓里读出一段记忆——一个旧世界登顶者最后的画面：无数记忆卫兵列队鞠躬，万千记忆聚合成一张巨大的脸，那脸缓缓睁眼，说："又来了一个……记得我的人。"忆灵猛地抬头，看向王座方向。
    word_count: 4200

  - chapter: 109
    title: 半山记忆泉
    goal: 半山记忆花园探索；团子在记忆泉狂吸记忆后沉睡异变（预埋110）；门衍家世秘密初揭（看门人血脉）；万芯残党首领首次传讯现身（隔空交锋）；零护团子怒怼首领。
    map: 万芯之巅·半山·记忆花园与记忆泉
    characters: 零、容小满、闸门、频闪、忆灵、门衍、团子；万芯残党首领（传讯影像）
    task_type: 主线·探索；支线·团子异变；门衍血脉线
    conflict: 记忆花园的旧世界日常记忆具象化（有人钓鱼的记忆、有人等门的记忆——全是没被统一前的旧世界）；团子像回家一样扑进记忆泉狂吸——身体发光、陷入沉睡（零急得跳脚，容小满查不出原因）；门衍在花园石碑上发现家徽（看门人血脉的石刻——他家族谱上没有这段）；万芯残党首领的传讯影像第一次现身（苍老执拗的声音）："把残片留下，我让你们的宠物醒来——它吃的是万芯之主的记忆，你养不起"——零当场炸毛。
    monsters: 记忆花园的残影守卫（Lv.92-93，花园记忆具象化的守卫）；首领传讯投影
    battle: 花园遭遇战：残影守卫（旧世界人的剪影，攻击方式=记忆片段轰炸——被打中会短暂变成"别人"）——零用记忆盾硬吃，频闪速射剪影接缝，团子沉睡中被零抱在怀里（战斗单手抱宠，另一手挥剑——频闪吐槽"你抱着它打什么架"），忆灵读花园仓找出守卫核心（一块旧世界墓碑），门衍权限封住，容小满净化，斩碎墓碑守卫消散。
    skills: 零：记忆盾、雷弧斩；频闪：速射；忆灵：读仓术；门衍：权限令；容小满：净化术
    equipment: 无新增（收集：记忆之露×8）
    rewards: 情报：记忆花园=旧世界普通人的日常记忆具象化（"没被统一前"的世界样本）；门衍家徽石刻（看门人血脉证据）；万芯残党首领现身（残党在山上布了天罗地网——他等着队伍）
    relationship: 团子异变戏（零抱着沉睡的团子不撒手，谁碰跟谁急；闸门用大盾给团子挡风，频闪罕见地没开嘲讽——"它别有事啊"）；门衍首次主动开口谈家族（"我家谱第一章写着：看门人不得登顶——我不知道为什么"）；忆灵读完墓碑后脸色发白（墓碑上的名字与她的封存记忆编号一致——预埋117）
    reveal: 万芯残党首领=旧世界守墓人（万芯之主的守墓者）；首领认识团子（"它是旧世界的东西"——预埋110）；看门人血脉=守墓人同源（门衍与残党是旧世界一族分出的两支）
    satisfaction: 记忆花园的温柔与诡异并存（旧世界日常记忆的图鉴感）；首领登场压迫感（隔空交锋零护宠炸毛的爽）
    fun: 频闪被残影守卫打中后短暂变成"一个等人回家的老头"（清醒后疯狂甩头："我刚等了三十年家门？！"）；容小满认真分析"旧世界的人为什么不用钱"（结论：那一定很可怕）；团子睡梦中打呼噜喷泡泡
    suspense: 团子吃下去的记忆是什么？它为什么对记忆泉"像回家"？守墓人为什么会为万芯之主守三百年坟？
    hook: 当夜，沉睡的团子第一次发出人声般的呜咽，身体浮起，周身浮现旧世界纹路——零一把抱住它，它睁开眼，眼神却像在看一个很老很老的朋友，吐出两个模糊的音节，像是旧世界古语的"回家"。没人听得懂，但零莫名觉得心口发紧。
    word_count: 3800

