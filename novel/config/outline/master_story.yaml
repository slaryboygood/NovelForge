# 总主线（Novel Reboot v2 · Outline Refinement）——MASTER_STORY（最高解释权之一）

## 总主线

零从碎屑平原废渣镇的零级废灵起步，觉醒隐藏能力【吞噬】后一路打怪掉宝、升级开图、收队友建势力。随着地图推进，他逐渐发现：灵核是记忆的容器，怪物是被腐化的旧住民记忆，而万芯残党正收集万芯残片，试图复活旧世界主脑『万芯之主』——一个要把所有记忆统一"保管"的绝对秩序。零必须在万芯之巅做出最终选择：继承（成为新主脑）、解放（打碎万芯核心，让记忆回归个体）、封印（保留核心但封存）。

## 大结局（设计方向）

- 主线结局：零选择「解放」——万芯核心崩解为千万记忆回归各自灵核，世界恢复记忆多样性；零自愿放弃吞噬能力（灵核认主机制的代价），成为无能力却最自由的传说。
- 世界变化：腐化信号源头消失；怪物逐渐恢复理智；旧世界记忆化为图鉴与传承。
- 留白：零的空白灵核之谜以"他是万芯之主崩解时漏掉的那一粒执念"收束——他不是容器，而是"选择"本身。

## 世界终极秘密（分层揭示）

- 第一层（卷四）：怪物体内有记忆残片（灵核=记忆容器）。
- 第二层（卷五）：万芯残片是万芯之主的记忆核心碎片。
- 第三层（卷六）：万芯之主以"消除遗忘"为根目标，腐化是它收集记忆的手段。
- 第四层（卷七）：零的空白灵核与万芯之主崩解有关。
- 终局（卷八）：零是"漏掉的那一粒执念"——万芯之主唯一无法统一的选择。

## 主角最终目标

表层：变强、吃饱、不再被欺负。
深层：查清空白灵核的来历 → 理解记忆与自由 → 在万芯之巅做出自己的选择。

## 最终敌人

万芯之主（Lv.100 最终 Boss）+ 万芯残党（组织）+ 腐化教团（前期幕后）。

## 主要阵营

冒险者公会 / 芯片城邦联盟 / 阻流要塞 / 门控议会 / 储能商会 / 拾荒者商会 / 腐化教团 / 万芯残党。

