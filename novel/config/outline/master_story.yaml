## 伏笔分级（S/A/B/C）

### S 级（贯穿全书，终局回收）
1. 零的空白灵核来历（卷一 CH001 埋 → 卷七 CH099 揭示一半 → 卷八 CH120 全揭：万芯之主漏掉的执念）
2. 万芯残片真实用途（卷五 CH075 首曝 → 卷六-八 收集 → 卷八 CH118 合钥）
3. 吞噬能力的来源与代价（卷一 CH002 觉醒 → 卷七失控 → 卷八认主机制）
4. 万芯之主本质（卷六 CH085 残页 → 卷八正面）
5. 最终敌人与终局选择（卷一轻伏笔：裂变剑断口旧纹与万芯同源 → 卷八对决）

### A 级（跨卷回收）
6. 裂变剑=旧世界断刃（卷三 CH044 共鸣 → 卷八 CH118 铸成万芯裂变）
7. 团子=旧世界宠物原型（卷二 CH022 异常 → 卷八 CH110 真相）
8. 容小满储能族血脉（卷二 CH022 → 卷七 CH100 净化觉醒）
9. 门衍父亲门昭失踪（卷五 CH070 → 卷八 CH112 残党首领线）
10. 忆灵被封印的记忆（卷四 CH054 → 卷六 CH085 记忆废库）
11. 腐化教团真面目（卷三 CH037 暗桩 → 卷七正面）

### B 级（卷内回收）
12. 静电洞穴"守门人"记忆（卷一 CH11 → CH15 收）
13. 赵启背后的黑手（卷二 CH16 → CH30 赌斗）
14. 阻流族守护之秘（卷三 CH33 → CH45）
15. 远古门阵的"门不是锁"（卷五 CH63 → CH75）

### C 级（几十章内回收）
16. 铁算盘的天梭城接头人身份（CH003 → CH015）
17. 老瘸的猎户半师线（CH003 → CH009）
18. 兜帽身影（CH002 → CH019 身份小揭）
19. 锈铁神龛守龛傀儡（CH006 → CH006 即收）
20. 巡影披风隐藏任务（CH025 → CH027）

### 提问-解答节奏（3 问解 1 问再产生 1 个更大的问题）
- 每卷至少 1 个 C/B 级伏笔完成回收 + 1 个新伏笔埋下；每 2 卷至少 1 个 A 级伏笔推进一层；S 级伏笔每卷只推进一层、终局全部回收。
- 禁止"一直谜语"：读者问题账本按"提出→强化→部分回答→兑现"四态推进（与 review-committee 的 reader_questions 机制一致）。

## 爽点矩阵（前 120 章轮换，避免只有打怪升级）

升级爽 / 掉宝爽 / 越级击杀 / 绝境翻盘 / 反杀 / 打脸 / 身份反转 / 赚钱 / 抢资源 / 开隐藏地图 / 开隐藏职业 / 技能进化 / 装备进化 / 队友认可 / 敌人震惊 / 群众震惊 / 第一次出名 / 第一次悬赏 / 第一次建立队伍 / 第一次守城 / 第一次副本首杀 / 第一次区域公告 / 回旧地图碾压 / 融合新技能 / 净化宝物 / 收服宠物 / 赌斗 / 竞技场 / 解密开图

轮换原则：连续 3 章同类爽点后必须换类（如两章打怪升级后接一章打脸或解密或社会生活）。

## 社会生活（拟人世界"活起来"，服务人物与节奏，不水文）

- 吃饭/住宿：废渣镇大锅饭（CH001-008）、天梭城酒馆（CH016-030）、驿站（CH076-090）
- 市场/讨价还价：容小满的记账（贯穿）、黑市捡漏（CH023）、铸鸣的锻造铺（CH052+）
- 训练/休息：斩波者学院训练场（CH017）、队伍集训（每卷 1 次）
- 队友斗嘴：零×频闪（CH018+）、零×门衍（CH068+）
- 节庆：天梭城灵能节（CH024 前后）、废渣镇丰收祭（CH045 回归时）
- 职业考试：冒险者注册考试（CH016）、转职试炼（CH059-60）、门控者认证（CH074）
- 公会/悬赏：任务板日常（CH017-019）、高速大道镖行委托（CH076-079）

## 主线节奏（先爽后思想）

- 卷一-三：纯爽（打脸、升级、掉宝、收队友）。
- 卷四-五：爽+故事（转职、遗迹、残片现世）。
- 卷六-七：爽+代价（残党对抗、吞噬失控、救赎）。
- 卷八：故事+思想（最终选择，思想通过选择呈现）。

## 终局可回看（从第一卷就能回看）

- CH001：破铁条断口旧纹（=与万芯同源的轻伏笔，第一次阅读看不懂）
- CH002：兜帽身影捡灵核壳（=残党"收集记忆"的第一次暗示）
- CH005：裂变剑"馋"灵核（=吞噬本能的来源暗示）
- CH014：团子挑食吞蓝装（=旧世界宠物原型的异常）
- CH022：容小满能量仓金纹（=储能族血脉）
- 终局回看："原来第一卷早就写了"——S 级伏笔全部有一卷内的轻种子。
