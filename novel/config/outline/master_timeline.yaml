# 主线时间线（Novel Reboot v2）

## 世界纪年（简）

- 旧世界纪：万芯之主统治一切记忆，硅基民无遗忘、无选择。
- 崩解纪：万芯之主崩解，世界分裂为芯片城邦与荒野；腐化信号散布。
- 新历（正文时间）：崩解后第 300 纪；碎屑平原腐化潮周期约每 10 纪一次。

## 正文时间线（8 卷）

| 卷 | 时间跨度 | 事件 |
|---|---|---|
| 卷一 | 新历 300 纪·春 | 零觉醒吞噬；静电洞穴首杀；Lv.10 职业觉醒 |
| 卷二 | 春-夏 | 天梭城注册；噬流虫王；赵启打脸；Lv.20 |
| 卷三 | 夏 | 过载荒原；过载巨人；闸门族地；Lv.30 |
| 卷四 | 夏-秋 | 锈蚀地牢；忆灵入队；锈王；转职雷弧剑士；Lv.40 |
| 卷五 | 秋 | 远古门阵；门衍入队；门卫巨像；万芯残片其一；Lv.55 |
| 卷六 | 秋-冬 | 高速大道；干线巨蜥；万芯吞噬者觉醒；残片其二被夺；Lv.70 |
| 卷七 | 冬 | 故障深渊；吞噬失控；容小满净化觉醒；故障之主；残片其三；Lv.90 |
| 卷八 | 冬-春 | 万芯之巅；万芯之主；灵核认主；记忆解放；Lv.100 |

## 关键节点纪年

- 空白灵核：新历 300 纪·春（卷一埋线）
- 万芯残片现世：新历 300 纪·秋（卷五）
- 记忆解放：新历 301 纪·春（卷八）
