# 卷一《废灵崛起》（第 1-15 章）

- 卷名：废灵崛起
- 大玩法：生存探索（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：废铁狼王；卷中Boss：腐化甲虫王；卷末Boss：静电史莱姆王
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：碎屑平原、静电洞穴
- 当前等级：Lv.0 → Lv.10
- 主要任务：主线（觉醒吞噬、首杀 Boss）；支线（拾荒、村霸打脸、容小满入队）
- 核心冲突：废灵身份的歧视 vs 吞噬能力的秘密
- 队友变化：零 + 容小满（第 9 章）+ 团子（第 14 章宠物蛋）
- 主要敌人：村霸赖三、腐化甲虫王、静电史莱姆王
- 主要 Boss：静电史莱姆王（Lv.15 副本 Boss）
- 核心装备：裂变剑（灰白→绿，第 14 章）、雷纹护臂（蓝，第 15 章）
- 核心技能：斩波斩、吞噬（觉醒）、闪步（第 6 章技能书）
- 升级节点：第 2-3 章 Lv.0→3（觉醒爆发）、第 8 章 Lv.5→7、第 14 章 Lv.10（首杀 Boss 大升级）
- 爽点：小爽点（第 2 章觉醒吞噬反杀野狗）；中爽点（第 8 章打脸村霸）；大爽点（第 14 章 Boss 首杀+双蓝装）；爆点（第 15 章 Lv.10 职业觉醒+离开新手区）
- 伏笔：零的空白灵核（第 1 章）；裂变剑来历（第 3 章剑身断口旧纹）；团子异常（第 14 章）
- 卷末高潮：静电洞穴 Boss 战 + 职业觉醒
- 进入下一卷的理由：Lv.10 觉醒职业，获得冒险者资格，前往天梭城
