# 卷三《过载荒原》（第 31-45 章）

- 卷名：过载荒原
- 大玩法：势力委托（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：关外巨兽；卷中Boss：熔渊蝎王；卷末Boss：过载巨人
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：过载荒原、阻流关
- 当前等级：Lv.20 → Lv.30
- 主要任务：主线（阻流要塞委托、过载巨人讨伐）；支线（烧蚀犬群、闸门族地）；阵营（阻流要塞）
- 核心冲突：荒原过载危机 vs 阻流族自治摩擦；闸门的族规 vs 同伴
- 队友变化：闸门主线章（第 33-40 章他的族地线）
- 主要敌人：烧蚀犬群、荒原巨蝎、过载傀儡、过载巨人
- 主要 Boss：过载巨人（Lv.35 区域 Boss，第 44 章击杀）
- 核心装备：雷弧战甲图纸（第 44 章，第 48 章铸成紫装）
- 核心技能：壁垒（第 41 章技能书·闸门）、净化术（第 39 章·容小满）
- 升级节点：第 33 章 Lv.21→23、第 38 章 Lv.25、第 44 章 Lv.28→30（Boss 大升级）
- 爽点：小爽点（第 32 章烧蚀犬群清场）；中爽点（第 40 章闸门违抗族规）；大爽点（第 44 章过载巨人首杀+橙材料）；爆点（第 45 章转职线索现世+Lv.30）
- 伏笔：巨人心脏与旧世界断刃的共鸣（第 44 章，裂变剑来历）；腐化教团在荒原的暗桩（第 37 章）；转职线索指向锈蚀地牢
- 卷末高潮：过载巨人战 + 闸门"守护"弧光第一幕
- 进入下一卷的理由：获得转职线索与锈蚀地牢地图碎片，Lv.30 满足转职试炼门槛
