# 卷四《锈蚀地牢》（第 46-60 章）

- 卷名：锈蚀地牢
- 大玩法：地下城与职业（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：地牢蠕虫王；卷中Boss：典狱长残影；卷末Boss：锈王
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：锈蚀地牢（地下城）、阻流关至地牢的通道
- 当前等级：Lv.30 → Lv.40
- 主要任务：主线（转职试炼、锈王讨伐）；支线（拾荒者商会·铸鸣入队、记忆仓解密）；阵营（拾荒者商会）
- 核心冲突：地牢深处的旧世界遗迹 vs 冒险者的贪婪；吞噬能力的第一次失控预警
- 队友变化：+ 忆灵（第 52 章地牢中层解救）；+ 铸鸣（第 52 章商人线，非战斗成员）
- 主要敌人：锈蚀甲虫群、地牢蠕虫、锈王
- 主要 Boss：锈王（Lv.45 地下城 Boss，第 58 章击杀）
- 核心装备：锈蚀重甲（紫，第 58 章）、裂变剑→紫（第 60 章转职强化）
- 核心技能：雷弧斩（第 60 章转职技）、读仓术（忆灵）
- 升级节点：第 48 章 Lv.31→33、第 53 章 Lv.35、第 58 章 Lv.37→38、第 60 章 Lv.40（转职大升级）
- 爽点：小爽点（第 47 章忆灵读仓开捷径）；中爽点（第 52 章忆灵入队+隐藏任务）；大爽点（第 58 章锈王击杀+紫装）；爆点（第 60 章职业试炼完成·转职雷弧剑士+Lv.40）
- 伏笔：地牢深处的旧世界门（第 55 章，指向远古门阵）；灵核=记忆容器的第一层揭示（第 54 章忆灵的身世）；吞噬失控预警（第 57 章吞噬锈王灵核反噬）
- 卷末高潮：转职试炼（三场守关战）+ 雷弧剑士觉醒
- 进入下一卷的理由：转职完成+隐藏任务卷开启远古门阵；Lv.40 满足遗迹门槛
