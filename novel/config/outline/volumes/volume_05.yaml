# 卷五《远古门阵》（第 61-75 章）

- 卷名：远古门阵
- 大玩法：遗迹解密与权限（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：门昭残影；卷中Boss：阵灵王；卷末Boss：门卫巨像
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：远古门阵（遗迹）、阻流关至门阵的灵能回路
- 当前等级：Lv.40 → Lv.55
- 主要任务：主线（门阵开启、门卫巨像讨伐、万芯残片其一）；支线（门控议会认证、记忆库解密）；阵营（门控议会）
- 核心冲突：门控议会的正统 vs 门衍的叛逆；遗迹记忆 vs 冒险者好奇心
- 队友变化：+ 门衍（第 68 章）
- 主要敌人：门卫石兵、阵灵、门卫巨像
- 主要 Boss：门卫巨像（Lv.60 遗迹 Boss，第 74 章击杀）
- 核心装备：裂变剑→橙（第 66 章）、灵核宝石·吞噬之眼（橙，第 72 章隐藏宝箱）
- 核心技能：开门（门衍）、雷弧风暴（第 66 章技能书）
- 升级节点：第 63 章 Lv.42→44、第 68 章 Lv.46→48、第 74 章 Lv.52→54、第 75 章 Lv.55
- 爽点：小爽点（第 62 章门阵开门开宝库）；中爽点（第 68 章门衍入队+毒舌互怼）；大爽点（第 74 章门卫巨像击杀+万芯残片其一+转职物）；爆点（第 75 章万芯残片真相首曝——Lv.55+灵核秘密第一层收束）
- 伏笔：万芯残片其一（核心伏笔正式上线）；记忆库残页（旧世界记忆）；门衍的贵族秘密（第 70 章）
- 卷末高潮：门卫巨像战 + 残片现世引发的势力震动
- 进入下一卷的理由：残片指向高速大道方向；Lv.55 满足跨区门槛
