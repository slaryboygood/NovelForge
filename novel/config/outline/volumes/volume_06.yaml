# 卷六《高速大道》（第 76-90 章）

- 卷名：高速大道
- 大玩法：跨区护送与文明冲突（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：万芯残党执事；卷中Boss：匪首·黑面；卷末Boss：干线巨蜥
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：总线高速大道、记忆废库（第 83-86 章忆灵线）
- 当前等级：Lv.55 → Lv.70
- 主要任务：主线（残片争夺、干线巨蜥讨伐）；支线（劫道匪团、记忆废库解密）；阵营（对抗万芯残党）
- 核心冲突：万芯残党登场抢残片 vs 队伍护送；忆灵的身世与记忆废库
- 队友变化：队伍 8 人+宠满编（第 81 章铸鸣随行）
- 主要敌人：劫道匪团、干线蠕兽、万芯残党·执事、干线巨蜥
- 主要 Boss：干线巨蜥（Lv.75 跨区 Boss，第 87 章击杀）
- 核心装备：裂变剑→红（第 88 章，吞噬第二残片余韵）
- 核心技能：万芯吞噬者隐藏觉醒（第 84 章前置，第 89 章正式觉醒）
- 升级节点：第 78 章 Lv.57→60、第 84 章 Lv.63→65、第 87 章 Lv.67→69、第 90 章 Lv.70
- 爽点：小爽点（第 77 章高速大道飙速追逐）；中爽点（第 84 章吞噬隐藏觉醒）；大爽点（第 87 章干线巨蜥击杀）；爆点（第 90 章万芯残党夺走第二残片——全书第一次重要挫败）
- 伏笔：万芯之主"漏掉的执念"（第 85 章记忆废库残页）；团子吞电异变（第 80 章）；腐化教团与残党的关系（第 86 章）
- 卷末高潮：干线巨蜥战 + 残片被夺的转折
- 进入下一卷的理由：残片集齐 2/3 指向故障深渊；Lv.70 满足禁区门槛
