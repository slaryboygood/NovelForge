# 卷七《故障深渊》（第 91-105 章）

- 卷名：故障深渊
- 大玩法：禁区远征与情感（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：缓存幽灵王；卷中Boss：腐化祭司；卷末Boss：故障之主
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：故障深渊（禁区）
- 当前等级：Lv.70 → Lv.90
- 主要任务：主线（腐化教团巢穴、故障之主讨伐、第三残片）；支线（净化圣水、忆灵记忆线）；阵营（对抗腐化教团+万芯残党）
- 核心冲突：吞噬能力的失控 vs 零的执念；容小满净化觉醒
- 队友变化：全队满编深度磨合；容小满净化储能师觉醒（第 102 章）
- 主要敌人：故障傀儡、腐化骑士、缓存幽灵王、腐化教团祭司、故障之主
- 主要 Boss：故障之主（Lv.90 禁区 Boss，第 105 章击杀）
- 核心装备：万芯之鳞（红，第 103 章残党 Boss）
- 核心技能：灵核净化（第 102 章容小满净化术+零觉醒）、净化圣水（配方第 104 章）
- 升级节点：第 93 章 Lv.72→75、第 98 章 Lv.78→80、第 103 章 Lv.84→86、第 105 章 Lv.88→90
- 爽点：小爽点（第 92 章腐化骑士清场）；中爽点（第 100 章容小满净化觉醒）；大爽点（第 103 章万芯之鳞+残党 Boss）；爆点（第 105 章故障之主击杀+第三残片——但零失控的代价）
- 伏笔：零的空白灵核（第 99 章深渊幻境揭示一半）；万芯之主执念（第 101 章失控时万芯残片共鸣）；团子真相（第 97 章团子吞掉腐化核心未失控）
- 卷末高潮：故障之主战 + 零吞噬失控被队友救赎（全书情感爆点）
- 进入下一卷的理由：三残片集齐，万芯之巅开启；Lv.90 满足终局门槛
