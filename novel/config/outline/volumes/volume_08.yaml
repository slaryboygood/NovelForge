# 卷八《万芯之巅》（第 106-120 章）

- 卷名：万芯之巅
- 大玩法：终局远征与世界选择（每卷核心玩法不同，避免八卷同质化）
- 阶段Boss：旧世界残响；卷中Boss：万芯残党首领；卷末Boss：万芯之主
- 升级节点：进入等级→关键突破→离开等级（曲线见 progression/levels.yaml）
- 核心地图：万芯之巅（终局地图）
- 当前等级：Lv.90 → Lv.100
- 主要任务：主线（万芯残党决战、万芯之主讨伐、最终选择）；支线（记忆解放事件、旧世界残响世界 Boss）
- 核心冲突：继承 vs 解放 vs 封印——记忆与自由的选择
- 队友变化：全员最终形态；团子真相揭示
- 主要敌人：记忆卫兵、万芯残党首领、万芯之主
- 主要 Boss：万芯之主（Lv.100 最终 Boss，第 119-120 章）
- 核心装备：万芯裂变（红·神话，第 118 章吞噬残片后）
- 核心技能：灵核认主（终局机制）
- 升级节点：第 108 章 Lv.91→93、第 112 章 Lv.95、第 116 章 Lv.97→98、第 119 章 Lv.100
- 爽点：小爽点（第 107 章登顶路上的记忆幻境打脸）；中爽点（第 112 章万芯残党首领战）；大爽点（第 118 章万芯裂变铸成）；爆点（第 120 章最终选择+世界事件·记忆解放）
- 伏笔收束：空白灵核真相（零=万芯之主漏掉的执念）；团子=旧世界宠物原型；门衍贵族秘密；容小满血脉；裂变剑=旧世界断刃
- 卷末高潮：万芯之主四阶段决战 + 灵核认主 + 解放结局
- 进入下一卷的理由：开放式收尾——记忆解放后旧世界残响（世界 Boss 事件）可支撑续卷；主角传说留白
