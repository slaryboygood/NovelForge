# 职业体系（Novel Reboot v2 · Outline Refinement）

## 职业总览

| 职业 | 系别 | 定位 | 觉醒/转职条件 |
|---|---|---|---|
| 斩波者 | 战士系 | 近战输出 | Lv.10 基础觉醒 |
| 储能师 | 辅助系 | 治疗/修复 | Lv.10 基础觉醒 |
| 重甲守卫 | 坦克系 | 防御/嘲讽 | Lv.10 基础觉醒 |
| 镜频猎手 | 射手系 | 远程输出 | Lv.10 基础觉醒 |
| 缓存幽灵 | 辅助系 | 情报/解密 | Lv.10 基础觉醒（特殊种族限定） |
| 门控者 | 特殊系 | 权限/位移/开门 | Lv.10 基础觉醒（门控议会认证） |
| 巡影弓手 | 射手系（进阶） | 远程输出+隐身 | 镜频猎手 Lv.40 转职 |
| 雷弧剑士 | 战士系（进阶） | 近战爆发 | 斩波者 Lv.40 转职 |
| 净化储能师 | 辅助系（进阶） | 治疗+净化腐化 | 储能师 Lv.40 转职 |
| 壁垒守卫 | 坦克系（进阶） | 防御+反伤 | 重甲守卫 Lv.40 转职 |
| 万芯吞噬者 | 隐藏职业 | 吞噬/解析/重构/进化 | 特殊条件（吞噬 ≥30 枚完整灵核 + 隐藏任务） |
| 灵核吟诵者 | 隐藏职业 | 记忆/共鸣/复活 | 特殊条件（万芯残片 + 记忆仓共鸣） |

## 职业参与剧情（正文必须真实出现）

- 战士系：斩波者/雷弧剑士是冒险者主力（主角线）；天梭城有斩波者学院与竞技场。
- 辅助系：储能师是储能商会核心职业（容小满的成长线）；净化储能师在腐化前线地位极高。
- 坦克系：重甲守卫是阻流要塞世袭职业（闸门族地线）。
- 射手系：镜频猎手隶属猎手公会（频闪线）；巡影弓手是高速大道镖师主力。
- 特殊系：门控者是门控议会认证贵族职业（门衍线）；缓存幽灵被视为"不祥"但情报价值极高（忆灵线）。
- 隐藏职业：万芯吞噬者被教团与残党同时追猎（主角身份危机）；灵核吟诵者是记忆废库的传说。
- 职业克制：射手克坦克、坦克克近战、近战克辅助、辅助克射手；组合技在 Boss 战中兑现（雷弧+壁垒+净化 三连）。
- 社会地位差异：门控者>储能师>斩波者>镜频猎手>重甲守卫>缓存幽灵（影响 NPC 态度与任务报酬）。

## 主角职业路线

- Lv.10 觉醒【斩波者】
- Lv.40 转职【雷弧剑士】
- Lv.60 隐藏觉醒【万芯吞噬者】（吞噬能力全面升级）

## 技能树

### 斩波者/雷弧剑士（主角）
- 斩波斩（基础攻击，随等级提升范围）
- 闪步（位移，Lv.15）
- 静电束缚（控制，Lv.25）
- 雷弧斩（爆发，Lv.42 转职技）
- 雷弧风暴（AOE，Lv.55）

### 队伍技能
- 储能师：回灵术（单奶）/灵能护罩（盾）/净化术（驱散）/群体修复（群奶）
- 重甲守卫：嘲讽/壁垒（减伤）/反震
- 镜频猎手：速射/穿云箭/频闪之眼（侦察）
- 缓存幽灵：读仓术（读记忆仓）/幻影（隐身）/解密（开机关）
- 门控者：开门（开图/开宝库）/位移门/权限令（临时通行）

## 技能获取

- 觉醒自带 1 技能；技能点升级现有技能；技能书学习新技能（掉落/商店/任务）。
- 隐藏职业技能只能通过隐藏任务与特殊掉落解锁。

