# 【吞噬】七阶段进化线（全书第一爽点发动机）

> 吞噬不只是技能——它是主角的成长引擎，也是整本书"看得见的变强"的核心。每个阶段改变玩法。

## 阶段总览

| 阶段 | 解锁 | 玩法变化 | 代表场景 |
|---|---|---|---|
| 1 吞噬 | Lv.1（CH002） | 吞噬怪物灵核：获得经验、恢复灵能、短时强化；代价=眩晕/饥饿 | 第一次吞噬野狗灵核反杀 |
| 2 解析 | Lv.12（CH012） | 吞噬完整灵核可"尝出"怪物的技能本质：获得技能残影（一次性使用） | 吞噬废铁狼王灵核获得"狼嚎威慑" |
| 3 提纯 | Lv.25（CH025） | 净化受污染灵核：剥离腐化杂质，得到纯净灵核（可交易/喂养）；自身腐化值可逆 | 净化地牢蠕虫灵核救回忆灵 |
| 4 融合 | Lv.45（CH044） | 把两种技能残影融合成新技能（成功率与熟练度相关，失败反噬） | 融合"史莱姆电击"+"狼嚎"→"电吼" |
| 5 重构 | Lv.60（CH089） | 吞噬装备/职业碎片：改造装备词条、强化武器、改变自身职业特性 | 吞噬雷弧战甲碎片→裂变剑雷纹觉醒 |
| 6 进化 | Lv.75（CH087） | 吞噬 Boss 核心：获得 Boss 级能力形态（领域雏形、特殊体态）；一次性上限提升 | 吞噬干线巨蜥核心→"巨蜥形态"短暂进化 |
| 7 规则吞噬 | Lv.95（CH116） | 吞噬领域/规则/权限/世界碎片：理解并改写局部世界规则 | 万芯之巅吞噬"遗忘领域"反制万芯之主 |

## 吞噬的爽点（每阶段都要兑现）

- 阶段 1-2：捡到灵核→吞→变强→打脸（频率高、单章内闭环）
- 阶段 3-4：合成新技能/净化宝物的"创造感"（读者期待下一种组合）
- 阶段 5：武器/装备被"喂"出隐藏词条的养成感（裂变剑成长线）
- 阶段 6-7：Boss 能力到手与"以彼之道还施彼身"（终局高潮）

## 吞噬的限制（保持代价与张力）

- 同一灵核只能吞噬一次；强行二次吞噬引发腐化值暴涨。
- 吞噬有冷却与容量：灵核槽有限（10 槽），吞新需弃旧（"取舍"主题的机制化）。
- 吞噬越强的存在，腐化值越高、失控风险越大（卷七失控戏的机制基础）。
- 吞噬≠无敌：解析需要时间、融合有失败率、规则吞噬需要"理解"而非蛮吞。
- 别人不能复制：空白灵核是唯一能承载吞噬的载体（万芯之主崩解时漏掉的执念——只有"选择"本身能吞下一切而不被吞没）。

## 吞噬的消耗与残留（核心是否还存在——明确规则 2026-08-27）

> 本规则回答"吞噬之后，那枚灵核/材料还在不在"。一切库存、交易、喂剑、掉落核对都以此为准。

- **整核吞噬 = 核本体完全消化消失**：不可再交易、储存或喂剑；"吞了又拿去卖/又出现"为逻辑错误。唯一允许的残留是极少数呛咳吐出的外壳残片（无价值、不可用，如 CH002 的灵核壳被兜帽人捡走）。
- **半核吞噬 = 被咬下的部分消失**：剩余半颗保持核形态，可储存/交易（带残缺与腐化味），但同一颗核不能二次吞噬（如 CH004 精英甲虫：零吞半颗、另半颗收进怀里，此后只可储存或喂剑，不可再吞）。
- **只吸收残响/碎灵 = 不消耗核本体**：怪物临死泄出的能量、散在虫肉里的碎灵可被吞噬吸收；核本体仍留在原地/尸体中，可挖取、交易（如 CH003 大虫坏核：零只被残响冲击，核未吞、揣进怀里，镇公所拒收、铁算盘称"收着"）。
- **未吞噬的核保持原状**：可交易、储存、喂剑、制作；一旦发生吞噬（整吞/半吞/吸收残响），该核即被消耗，禁止再次出现在交易或库存中。
- **数量守恒**：正文中的掉落、卖出、交付、喂剑数量必须与库存一致；吞噬掉的核不得再计入可交易数量。

## 终局兑现

- 灵核认主机制：只有自愿放弃吞噬能力的人能持有万芯核心——"拥有吞掉世界的能力，却选择让世界自己生长"（道家"不争"的机制化）。
