# 掉落体系（Novel Reboot v2）

## 掉落分类

| 掉落物 | 来源 | 用途 |
|---|---|---|
| 灵核碎片 | 普通怪 | 实体材料；拾取后计库存，吸收后实体消失 |
| 完整灵核 | 精英怪/Boss | 实体战利品；学技能/喂剑/隐藏职业条件，完整消耗后不可再次使用 |
| 逸散灵能 | 怪物死亡/任务结算 | 非实体升级收益；可飘入身体，不计库存，不等同灵核 |
| 核印 | 吞噬灵核后形成 | 非实体信息残留；保存本能/技能线索，不能交易或再次吞噬 |
| 灵能结晶 | 矿脉/神龛/能量仓 | 实体储能材料；不是怪物灵核 |
| 装备 | 精英/稀有/Boss | 武装 |
| 技能书 | 稀有怪/Boss/隐藏任务 | 学技能 |
| 材料 | 各图怪物/采集 | 强化/锻造/任务 |
| 地图碎片 | 稀有怪/宝箱 | 拼出新地图入口 |
| 权限令 | 任务/Boss | 进入高级地图/势力 |
| 宠物蛋 | 稀有怪/Boss（团子） | 宠物 |
| 称号 | Boss 首杀/事件 | 属性加成+装逼 |
| 隐藏任务卷 | Boss/随机 | 触发隐藏任务 |
| 转职物 | 特定 Boss/副本 | 进阶/隐藏职业 |
| 万芯残片 | 特定 Boss/遗迹 | 主线关键物 |

