## 掉落提示格式

【获得：蓝色装备·雷纹护臂】
（短，一次一行）

灵核进入背包时使用【获得：完整灵核·名称】；当场消耗时使用【已吸收：名称灵核×N】。不得对同一枚灵核同时使用“获得”和“已吸收”。
