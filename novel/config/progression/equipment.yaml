# 装备体系（Novel Reboot v2 · Outline Refinement）

## 品级

灰白（普通）→ 绿（精良）→ 蓝（稀有）→ 紫（史诗）→ 橙（传说）→ 红（神话）

## 部位

武器、护甲、头盔、护腕、战靴、饰品、腰包（背包扩展）

## 核心成长装备：裂变剑（全书第二成长发动机）

- 类型：武器（单手剑 → 形态进化）
- 品级：灰白起步 → 红（终局）
- 绑定：主角专属（灵核认主绑定，不可交易不可掉落）
- 外观与形态线（读者可见的成长具象化）：

| 形态 | 解锁 | 外观 | 能力变化 |
|---|---|---|---|
| 破铁条 | CH001 捡到 | 灰白断刃，断口带旧纹 | 攻击 +5；"馋"灵核（隐藏感应） |
| 裂变·雷纹 | CH014 吞噬史莱姆王灵核 | 补上青色雷纹 | 攻击 +12；对电系怪物 +20% |
| 裂变·蓝刃 | CH030 天梭城强化 | 剑身浮现裂纹灵纹 | 攻击 +20；斩波斩范围 +1 |
| 裂变·紫弧 | CH060 转职强化 | 剑刃半透明，内蕴雷弧 | 攻击 +35；雷弧斩冷却 -20% |
| 裂变·橙名 | CH066 遗迹余韵 | 剑名显形"裂变" | 攻击 +50；可吞噬装备词条（重构阶段） |
| 裂变·红鳞 | CH088 吞噬残片余韵 | 万芯之鳞剑身 | 攻击 +70；领域雏形（进化阶段） |
| 万芯裂变 | CH118 吞噬三残片 | 红·神话，剑身万芯纹 | 攻击 +100；可斩"规则"（终局） |

- 成长方式：吞噬灵核喂剑（获得怪物技能残影：噬流虫突刺/雷弧兽电尾等）+ 材料强化 + 剧情节点觉醒。
- 剧情意义：从"破铁条"到"万芯之刃"，是主角身份与成长的双重具象；终局"万芯裂变"的归属=主角选择的象征。

