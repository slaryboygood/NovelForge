## 装备驱动设计（第二成长发动机）

- 掉落期待链：小怪→材料；精英→装备/技能碎片；Boss→高级装备/技能/职业道具；隐藏 Boss→独有物品；世界 Boss→改变格局的奖励。
- 套装体系：雷弧套（护臂+战甲+披风，3 件套触发"雷弧回响"）、阻流套（闸门线）、门控套（门衍线）——每套有套装效果与收集驱动。
- 强化：+1~+9（材料+灵能，失败不碎掉到 +0）；镶嵌：灵核宝石。
- 主角至少一件长期成长装备（裂变剑）贯穿全书；重要 Boss 后必须有"下一件装备"的期待钩子。

## 装备规则

- 强化：消耗材料+灵能，+1~+9；失败不碎（降到 +0）。
- 镶嵌：灵核宝石。
- 绑定：蓝以上部分装备绑定。
- 强化失败保护：护符（掉落/商店）。
