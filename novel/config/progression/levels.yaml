关键曲线检查：
- 前 30 章升 20 级（新读者快速爽点闭环）；30-60 章再升 20 级（稳定）；60-90 章升 35 级（后段提速但不失控）；90-100 章升 10 级（终局慢升、以剧情兑现为主）。
- 每卷至少一次越级战（跨 5-8 级）与一次碾压战（回旧怪/同级秒杀），形成"强弱对比"。
- 升幅分配避免：前期过慢（>30 章无 5 级）或后期停滞（连续 20 章无升级）。

## 升级提示格式（正文唯一允许的面板）

【等级提升：Lv.7 → Lv.8】
【属性：攻击 +5，灵能 +20】
（短，不刷屏）
