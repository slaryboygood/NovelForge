# 等级体系（Novel Reboot v2 · Outline Refinement）

## 等级与阶位

- Lv.0–Lv.100；每 10 级为一阶。
- 阶位名：一阶废灵 → 二阶学徒 → 三阶行者 → 四阶猎手 → 五阶守卫 → 六阶骑士 → 七阶宗师 → 八阶霸主 → 九阶传说 → 十阶传奇。
- 主角开局 Lv.0（全书唯一可见的零级）。

## 升级途径

- 击杀怪物：获得灵能（同阶怪正常，越级翻倍，低于自身 10 级无收益）。
- 完成任务：主线/支线/隐藏/阵营任务奖励灵能。
- Boss 首杀：大额灵能 + 称号。
- 地图探索：首次抵达新地图区域获得探索奖励。

## 每级成长

- 属性：灵能上限、攻击、防御、速度、韧性（5 项基础属性自动成长）。
- 每级 +1 技能点（可投入技能树）。
- 每阶（10 级）解锁：新技能槽、新装备栏位、地图通行权限。

## 属性表（5 项）

| 属性 | 作用 |
|---|---|
| 灵能 | 技能与战斗能量上限 |
| 攻击 | 物理/灵能伤害 |
| 防御 | 减免伤害 |
| 速度 | 行动顺序与闪避 |
| 韧性 | 抵抗控制与腐化 |

## 升级曲线（0-100 级 × 280 万字，每卷约 35 万字）

原则：前快后稳、每卷有肉眼可见的阶段变化；避免前 100 章升 50 级或 300 章只升 10 级。

| 卷 | 章节 | 进入等级 | 离开等级 | 每卷升幅 | 关键突破 | 第一次越级战 | 第一次碾压战 | 阶段变化（不止数字） |
|---|---|---|---|---|---|---|---|---|
| 一 | 1-15 | Lv.0 | Lv.10 | +10 | 觉醒吞噬（2）；职业觉醒斩波者（15） | 静电史莱姆王（Lv.15，越 5 级，14） | 三只静电史莱姆一刀清（3） | 身体：吞噬强化；身份：废灵→冒险者候补 |
| 二 | 16-30 | Lv.10 | Lv.20 | +10 | 噬流虫王首杀（19）；Lv.20 过载荒原解锁（30） | 噬流虫王（Lv.20，同级偏上） | 赵启赌斗三连碾压（30） | 身份：注册冒险者；社会：天梭城名气 |
| 三 | 31-45 | Lv.20 | Lv.30 | +10 | 壁垒（41）；过载巨人击杀（44） | 过载巨人（Lv.35，越 5-7 级，42-44） | 烧蚀犬群清场（32） | 装备：雷弧战甲图纸；队伍：闸门立威 |
| 四 | 46-60 | Lv.30 | Lv.40 | +10 | 忆灵入队（52）；锈王击杀（58）；转职雷弧剑士（60） | 锈王（Lv.45，越 7 级，55-58） | 地牢甲虫群扫荡（50） | 职业：斩波者→雷弧剑士；武器：裂变剑蓝→紫 |
