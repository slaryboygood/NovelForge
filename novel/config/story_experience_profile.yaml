# 故事体验档案（Novel Reboot v2）

## 读者体验目标

- 追读性：每章结尾必须有钩子；每 3-5 章一个爽点。
- 情绪曲线：压抑开局（废灵）→ 觉醒爆爽（卷一）→ 持续升级爽感（卷二-六）→ 代价与情感（卷七）→ 史诗收束（卷八）。
- 代入感：主角草根出身、吐槽、贪吃、讲义气——普通读者容易代入。
- 画面感：怪物与 Boss 视觉化（外形/动作/特效）；战斗用动作短句。

## 爽点分层（每卷）

- 小爽点：单场战斗胜利/捡到装备/技能升级/打脸小角色。
- 中爽点：精英怪/Boss 首杀/新队友入队/地图开启。
- 大爽点：区域 Boss 击杀/转职/隐藏能力觉醒/势力事件。
- 爆点：卷末 Boss/大型打脸/身份反转/世界事件。

## 笑点设计

- 主角吐槽、容小满算钱、频闪嘴炮、团子卖萌、铸鸣铁公鸡。
- 打脸前后对比（"刚才谁说我是废物？"）。
