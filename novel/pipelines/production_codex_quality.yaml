pipeline_id: production_codex_quality
version: 6.1.0-planned
auto_commit: false
stages:
  - id: chapter_resolver
    plugin: locked_or_rolling_chapter_resolver
  - id: chapter_card
    plugin: chapter_card_compiler
    depends_on:
      - chapter_resolver
  - id: A_codex_raw
    plugin: codex_chapter_writer
    depends_on:
      - chapter_card
  - id: story_safety_review
    plugin: deepseek_story_safety_reviewer
    depends_on:
      - A_codex_raw
  - id: webnovel_editorial_review
    plugin: deepseek_webnovel_editorial_reviewer
    depends_on:
      - A_codex_raw
  - id: verified_review_claims
    plugin: deterministic_claim_verifier
    depends_on:
      - story_safety_review
      - webnovel_editorial_review
  - id: revision_plan
    plugin: deepseek_revision_planner
    depends_on:
      - verified_review_claims
  - id: B_codex_revised
    plugin: codex_chapter_rewriter
    depends_on:
      - revision_plan
  - id: regression_audit
    plugin: deepseek_regression_auditor
    depends_on:
      - B_codex_revised
  - id: C_deepseek_polished
    plugin: deepseek_prose_polisher
    optional: true
    depends_on:
      - regression_audit
  - id: fact_diff
    plugin: deterministic_fact_diff
    depends_on:
      - B_codex_revised
      - C_deepseek_polished
  - id: final_story_audit
    plugin: deepseek_final_story_auditor
    depends_on:
      - fact_diff
  - id: state_delta
    plugin: deepseek_state_extractor
    depends_on:
      - final_story_audit
  - id: author_approval
    kernel_gate: author_approval
    depends_on:
      - state_delta
