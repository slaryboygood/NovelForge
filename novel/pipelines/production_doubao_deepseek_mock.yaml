pipeline_id: production_doubao_deepseek_mock
version: 6.2.0
auto_commit: false
stages:
  - id: plan
    plugin: mock_planner
  - id: capacity_gate
    kernel_gate: capacity
    depends_on:
      - plan
  - id: context
    kernel_gate: context_builder
    depends_on:
      - capacity_gate
  - id: draft
    plugin: prose_writer
    runtime:
      provider: fake_llm
      model: fake-writer-model
    depends_on:
      - context
  - id: draft_quality_gate
    kernel_gate: draft_quality
    depends_on:
      - draft
  - id: story_safety_review
    plugin: mock_reviewer
    depends_on:
      - draft_quality_gate
  - id: webnovel_editorial_review
    plugin: mock_final_reviewer
    depends_on:
      - draft_quality_gate
  - id: verified_review_claims
    plugin: deterministic_claim_verifier
    depends_on:
      - story_safety_review
      - webnovel_editorial_review
  - id: revision_plan
    plugin: mock_revision_planner
    depends_on:
      - verified_review_claims
  - id: B_provider_revised
    plugin: revision_rewriter
    runtime:
      provider: fake_llm
      model: fake-rewriter-model
    depends_on:
      - revision_plan
  - id: final_quality_gate
    kernel_gate: final_quality
    depends_on:
      - B_provider_revised
  - id: regression_audit
    plugin: mock_regression_auditor
    depends_on:
      - final_quality_gate
  - id: revision_delta
    plugin: deterministic_revision_delta
    depends_on:
      - regression_audit
  - id: candidate_state_delta
    plugin: mock_state_extractor
    depends_on:
      - revision_delta
