pipeline_id: revision_validation
version: 1.0.0
auto_commit: false
stages:
  - id: plan
    plugin: deepseek_planner
    runtime:
      provider: deepseek_api_stream
      profile: planner
  - id: capacity_gate
    kernel_gate: capacity
    depends_on:
      - plan
  - id: context
    kernel_gate: context_builder
    depends_on:
      - capacity_gate
  - id: draft
    plugin: deepseek_writer
    runtime:
      provider: deepseek_api_stream
      profile: writer
    depends_on:
      - context
  - id: draft_quality_gate
    kernel_gate: draft_quality
    depends_on:
      - draft
  - id: review_main
    plugin: deepseek_continuity_reviewer
    runtime:
      provider: deepseek_api_stream
      profile: reviewer
    depends_on:
      - draft_quality_gate
  - id: verified_review_claims
    plugin: deterministic_claim_verifier
    depends_on:
      - review_main
  - id: revision_plan
    plugin: deepseek_revision_planner
    runtime:
      provider: deepseek_api_stream
      profile: revision_planner
      thinking: false
    depends_on:
      - verified_review_claims
  - id: B_deepseek_rewritten
    plugin: deepseek_rewriter
    runtime:
      provider: deepseek_api_stream
      profile: rewriter
    depends_on:
      - revision_plan
  - id: final_quality_gate
    kernel_gate: final_quality
    depends_on:
      - B_deepseek_rewritten
  - id: regression_audit
    plugin: deepseek_regression_auditor
    runtime:
      provider: deepseek_api_stream
      profile: reviewer
      thinking: false
    depends_on:
      - final_quality_gate
  - id: revision_delta
    plugin: deterministic_revision_delta
    depends_on:
      - regression_audit
  - id: state_delta
    plugin: deepseek_state_extractor
    runtime:
      provider: deepseek_api_stream
      profile: state_extractor
    depends_on:
      - revision_delta
