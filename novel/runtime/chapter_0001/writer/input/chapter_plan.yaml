chapter_id: 0001
title: 废渣镇的零
source_title: 卷一 · 废灵崛起
source_file: novel/config/outline/chapters/volume_01_chapters.yaml
timeline:
  date: null
  time: 腐化潮来临前的碎屑平原
  elapsed_from_previous: null
pov:
  character: 未命名
  perspective: 近距离第三人称，跟随人形少年主角
location:
  - 碎屑平原
  - 废渣镇
  - 镇外废料堆
chapter_purpose:
  main: 零（Lv.0 废灵）在腐化潮中为救容小满被迫迎战静电史莱姆，意外吞噬灵核觉醒隐藏能力【吞噬】。
  secondary:
    - 建立废灵身份与打脸期待
    - 埋下空白灵核与裂变剑来历伏笔
    - 展示拟人化主角的性格（嘴硬/贪吃/讲义气）
opening_state:
  protagonist: 废渣镇孤儿少年零，Lv.0 废灵，灵核空白，全镇公认的废物；银灰短发琥珀眼，破旧灰布衣。
  world: 碎屑平原腐化潮将至，镇外静电史莱姆数量暴增。
must_happen:
  - 零在废料堆捡到一根破铁条（裂变剑）
  - 腐化潮爆发，镇民逃散
  - 零为救被史莱姆围住的容小满，被迫挥剑迎战
  - 绝境中零本能吞噬了一枚静电史莱姆灵核，觉醒【吞噬】
  - 等级 Lv.0 → Lv.1，掌心浮现暗紫灵核纹
must_not_happen:
  - 不能揭示空白灵核的真正来历
  - 不能让零觉醒正式职业（Lv.10 才觉醒斩波者）
  - 不能让容小满入队（第 9 章才入队）
  - 不能出现天梭城、公会、高级地图与势力
  - 不能让吞噬能力毫无代价地使用（吞噬后短暂眩晕/饥饿感）
conflicts:
  external:
    - 腐化潮与静电史莱姆群袭击废渣镇
  internal:
    - 废灵自卑 vs 保护容小满的冲动
  interpersonal:
    - 镇民对废灵的嘲笑与容小满的善意
information:
  reveal:
    - 零是废渣镇零级废灵
    - 他觉醒了从未见过的吞噬能力
    - 破铁条来历不明（剑身断口有旧纹）
  hide:
    - 空白灵核真相
    - 裂变剑的真实身份
    - 腐化信号来源
  misunderstandings:
    - "零以为吞噬能力只是'能吃'，还不知道它的代价与上限"
character_arc:
  before: 自卑、嘴硬、认命当废物的拾荒少年。
  change: 为保护他人第一次拼命战斗，吞噬灵核觉醒力量。
  after: "第一次相信'我可能不是废物'，握紧裂变剑。"
foreshadowing:
  plant:
    - 空白灵核
    - 裂变剑断口旧纹
    - 吞噬后的饥饿感（代价伏笔）
  advance: []
  resolve: []
theme:
  silicon_polishing: 力量来自愿意保护他人的瞬间，而不是身份标签。
  subjective_elevation: 从认命的废物到第一次主动选择战斗。
  daoist_dimension: 有：被嘲笑的身份；无：还没有被定义的自己。
  implicit_question: 如果所有人都说你是废物，你还能相信自己的选择吗？
emotional_curve:
  - 压抑
  - 惊慌
  - 绝境
  - 拼命
  - 觉醒后的狂喜
ending_hook: 零握着裂变剑，看着掌心暗紫灵核纹，饿得肚子咕咕叫——远处脉冲林方向，腐化潮的余波还在翻涌。
target_words: 4000
chapter_length:
  length_class: STANDARD
  min_chinese_chars: 3800
  target_chinese_chars: 4500
  preferred_max_chinese_chars: 5000
