hard_rules:
- 实体怪物灵核不得无接触飘起、钻入或没入身体
- 飘起并被吸收的对象必须命名为逸散灵能或灵韵残响
- 完整吞噬后只能留下核印，不能继续把实体核写在体内或库存中
- 获得表示进入库存；已吸收表示实体已消耗；同一物品不能同时成立
- 灵能结晶与怪物灵核不可互相改名
