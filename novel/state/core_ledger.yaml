  native_core: 本命灵核；每个硅基生命自身唯一的核心，不属于背包库存
  monster_core: 怪物灵核；实体战利品，必须挖取/拾取/接触，不会自行飘入身体
  core_fragment: 灵核碎片/核屑；实体材料，吸收后实体消失并扣库存
  ambient_energy: 逸散灵能/灵韵残响；非实体击杀收益，可以飘起并被吸收，不计库存
  core_imprint: 核印；吞噬后留下的信息与本能，不是实体灵核
  energy_crystal: 灵能结晶；矿物/神龛/能量仓储能物，不等于怪物灵核
