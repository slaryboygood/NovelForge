[pytest]
# 本项目不使用 pytest 缓存（--lf/--cache 等）；禁用 cacheprovider 避免
# 沙盒/文件权限环境下 .pytest_cache 写入被拒绝产生的噪音告警。
#
# 默认只运行当前产品测试：V2 里程碑验收（M11–M18 / historical / wasteland）依赖
# 本机历史验收数据（authoring / forge chain / workspace 产物），默认被排除，
# 需要时显式运行：
#     pytest -m historical_acceptance
addopts = -p no:cacheprovider -m "not historical_acceptance"
testpaths = tests
markers =
    historical_acceptance: 依赖本机历史验收数据的 V2 里程碑验收（默认不运行）
