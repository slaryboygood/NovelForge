[pytest]
# 本项目不使用 pytest 缓存（--lf/--cache 等）；禁用 cacheprovider 避免
# 沙盒/文件权限环境下 .pytest_cache 写入被拒绝产生的噪音告警。
#
# V4-01 Boundary Foundation：依赖历史验收数据（M11–M18 / wasteland / 570 章 historical）
# 的测试已随废弃资产一并删除（作者决策 A / B），因此不再需要默认排除规则。
# `historical_acceptance` marker 保留注册，供 V4 里程碑验收重新启用（届时由新的
# 最小 deterministic fixture 支撑，不再依赖本机历史数据）。
addopts = -p no:cacheprovider
testpaths = tests
markers =
    historical_acceptance: 预留：依赖历史验收数据的里程碑验收（V4-01 起默认无此类测试）
